ut’ ça sur ton habit<br>Et combats toujours l’ennemi.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Faut que ce soit quequ’ chose de précieux<br>Pour que les autres m’appellent Monsieur,<br>Et bout leur main à leur chapiau<br>Quand ils veulent compter au Pelot.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Ma mère, si j’meure en combattant,<br>J’vous enverrai ce biau ruban<br>Et vous l’coudrez à votre fusiau<br>En souvenir du gars Pelot.</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Dites à mon père, à mon cousin<br>A mes amis que je vais bien,<br>Je suis leur humble serviteur<br>Pelot qui vous embrasse de cœur.</div></div></section>","120":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Malbrough s'en va-t-en guerre</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Malbrough s’en va-t-en guerre,<br>Mironton ton ton, mirontaine,<br>Malbrough s’en va-t-en guerre,<br>Ne sait quand reviendra,<br>Ne sait quand reviendra,<br>Ne sait quand reviendra.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Il reviendra-z-à Pâques,...<br>Ou à la Trinité. (ter)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>La Trinité se passe,<br>Malbrough ne revient pas.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Madame à sa tour monte,<br>Si haut qu’elle peut monter.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Elle voit venir son page,<br>Tout de noir habillé.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Beau page, mon beau page,<br>Quelles nouvelles apportez ?</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Aux nouvelles que j’apporte,<br>Vos beaux yeux vont pleurer.</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Monsieur Malbrough est mort,<br>Est mort et enterré.</div><div class=\"verse\"><span class=\"verse-number\">9.</span>J’l’ai vu porter en terre,<br>Par quatre-z-officiers.</div><div class=\"verse\"><span class=\"verse-number\">10.</span>L’un portait sa cuirasse,<br>L’autre son bouclier.</div><div class=\"verse\"><span class=\"verse-number\">11.</span>L’troisième portait sa veste,<br>L’autre ne portait rien.</div><div class=\"verse\"><span class=\"verse-number\">12.</span>J’ai vu voler son âme,<br>Couronnée de lauriers.</div></div></section>","121":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Frédéri</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Trois jolies demoiselles, ô Frédéri<br>Trois jolies demoiselles, ô Frédéri<br>S’en allaient promener,<br>Sur la berge, sur la barque sur laquelle on ne sait pas<br>Frédéri lon la.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>La plus jeune d’entre elles, ô Frédéri (bis)<br>Sur la berge pleurait,<br>Sur la berge, sur la barque...</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Qu’avez-vous donc la belle,<br>Qu’avez-vous à pleurer ?..</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Mon anneau d’or, dit-elle,<br>Dans le lac est tombé.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Que donnerez-vous la belle<br>Si j’allais le chercher ?</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Je suis trop pauvre fille,<br>Je n’ai rien à donner.</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Que mon cœur en mariage<br>Et mon anneau doré.</div><div class=\"verse\"><span class=\"verse-number\">8.</span>À la première plongée,<br>L’anneau d’or a frôlé.</div><div class=\"verse\"><span class=\"verse-number\">9.</span>À la seconde plongée<br>L’anneau d’or a touché.</div><div class=\"verse\"><span class=\"verse-number\">10.</span>À la troisième plongée,<br>Le galant s’est noyé.</div><div class=\"verse\"><span class=\"verse-number\">11.</span>Sa mère à la fenêtre<br>Se mit à sangloter.</div><div class=\"verse\"><span class=\"verse-number\">12.</span>Alors la pauvre fille<br>S’est remise à pleurer.</div></div></section>","122":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le vieux Joe</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Ils ne sont plus<br>Les beaux jours de l’amitié.<br>Tous mes amis<br>Ont quitté les cotonniers,<br>Ils sont partis<br>Au pays du grand repos ;<br>J’entends leurs douces voix chanter<br>Eho vieux Joe !</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Me voilà, Me voilà,<br>Tout brisé par les travaux,<br>J’entends leurs douces voix chanter<br>Eho vieux Joe !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Pourquoi pleurer,<br>Quand mon cœur est toujours gai ?<br>Pourquoi gémir ?<br>Ils ne peuvent revenir.<br>Depuis longtemps<br>Ils sont tous partis là-haut :<br>J’entends leurs douces voix chanter...</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Où sont-ils donc,<br>Les amis qu’on aimait tant ?<br>Et ces enfants<br>Qu’on berçait si doucement ?<br>Ils sont heureux !<br>Près d’eux je serai bientôt.<br>J’entends leurs douces voix chanter...</div></div></section>","123":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le vieux chalet</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Là-haut sur la montagne,<br>L’était un vieux chalet. (bis)<br>Murs blancs, toit de bardeaux,<br>Devant la porte, un vieux bouleau.<br>Là-haut sur la montagne,<br>L’était un vieux chalet.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Là-haut sur la montagne,<br>Croula le vieux chalet. (bis)<br>La neige et les rochers<br>S’étaient unis pour l’arracher<br>Là-haut sur la montagne<br>Croula le vieux chalet.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Là-haut sur la montagne,<br>Quand Jean vint au chalet.<br>Pleura de tout son cœur (bis)<br>Sur les débris de son bonheur.<br>Là-haut sur la montagne<br>Quand Jean vint au chalet.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Là-haut sur la montagne,<br>L’est un nouveau chalet. (bis)<br>Car Jean d’un cœur vaillant<br>L’a rebâti plus beau qu’avant.<br>Là-haut sur la montagne<br>L’est un nouveau chalet.</div></div></section>","124":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La bataille de Fontenoy</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>J’ons vu le poème fringant,<br>Fait par ce maître Voltaire,<br>Quoiqu’il ait de l’esprit tant,<br>Est-ce que nous devons nous taire ?<br>Pour briller tout comme lui<br>Je n’avons qu’à chanter Louis.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Aux plaines de Fontenoy,<br>Si t’avais vu ce monarque,<br>Son air inspirait l’effroi,<br>Semblait commander à la Parque,<br>Ses ennemis disaient tous<br>Le voilà, morbleu sauvons-nous !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Et toi brave Maréchal,,<br>Toi de Saxe le grand comte,<br>Si l’on trouvait ton égal<br>Je dirais bon que chien de compte !<br>Car je n’y vois que ce Roi<br>Qui puisse l’emporter sur toi.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Les Anglais à leurs dépens,<br>Connaissaient votre courage,<br>A tous vos coups foudroyants<br>En vain ils opposaient leur rage,<br>Ceux qu’échappent à l’armement<br>Sont contraints de ficher le camp !</div></div></section>","125":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Fleur d'épine</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Ma mère qui m’a nourrie<br>N’a jamais connu mon nom Ohé ! (bis)<br>On m’appelle, on m’appelle,<br>On m’appelle, Fleur d’Épine,<br>Fleur de Rose c’est mon nom.<br>Tralalala lalalala,<br>Tralalala lalalala,<br>Tralalala lalalala lalalala lalalala. Ohé !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Fleur d’Épine, Fleur de Rose<br>C’est un nom qui coûte cher, Ohé ! (bis)<br>Car il coûte, car il coûte,<br>Car il coûte la valeur<br>De cent écus que j’ai perdu.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Qu’est-ce que cent écus<br>Quand on a l’honneur perdu ? Ohé ! (bis)<br>Car l’honneur, car l’honneur<br>Car l’honneur est privilège<br>Des fillettes de quinze ans !</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Ne fais donc pas tant la fière<br>On t’a vue hier au soir. Ohé ! (bis)<br>On t’a vue, on t’a vue<br>On t’a vue hier au soir<br>Un beau cyrard auprès de toi !</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Ce n’était pas un cyrard<br>Qui était auprès de moi. Ohé ! (bis)<br>C’était l’ombre, c’était l’ombre<br>C’était l’ombre de la lune<br>Qui rôdait autour de moi !</div></div></section>","126":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La complainte de Mandrin</div><div class=\"song-actions\"></div></div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Nous étions vingt ou trente<br>Brigands tout une bande,<br>Tous habillés de blanc à la mod’des<br>... vous m’entendez ?<br>Tous habillés de blanc<br>A la mod’des marchands.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>La premièr’ volerie<br>Que je fis dans ma vie<br>C’est d’avoir goupillé la bourse d’un<br>...vous m’entendez<br>C’est d’avoir goupillé<br>La bourse d’un curé.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>J’entrai dedans sa chambre<br>Mon Dieu ! qu’elle était grande<br>J’y trouvai mille écus<br>Je mis la main ... dessus.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>J’entrai dedans une autre<br>Mon Dieu ! qu’elle était haute !<br>De robes et de manteaux<br>J’en chargeai trois... chariots.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Je les portai à vendre<br>A la foire en Hollande<br>J’les vendis bon marché :<br>Y m’avaient rien ... coûté !</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Ces Messieurs de Grenoble<br>Avec leurs longues robes<br>Et leurs bonnets carrés<br>M’eurent bientôt ... jugé.</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Ils m’ont jugé à pendre<br>Ah ! c’est dur à entendre<br>A pendre, à étrangler<br>Sur la place du ... marché.</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Monté sur la potence,<br>Je regardais la France<br>Je vis mes compagnons<br>A l’ombre d’un ... buisson.</div><div class=\"verse\"><span class=\"verse-number\">9.</span>Compagnons de misère<br>Allez dire à ma mère :<br>Qu’elle ne m’reverra plus<br>J’suis un enfant ... perdu.</div></div></section>","127":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La Piémontaise</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Ah Dieu ! Que je suis à mon aise<br>Quand j’ai ma mie auprès de moi,<br>De temps en temps je la regarde<br>Et je lui dis embrasse-moi, embrasse-moi !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Comment veux-tu que je t’embrasse (bis)<br>Quand on me dit du mal de toi :<br>On dit que tu parts pour la guerre<br>Dans le Piémont, servir le Roi.... (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Ceux qui t’ont dit cela ma belle,<br>Ils t’ont bien dit la vérité :<br>Mon cheval est dans l’écurie<br>Sellé, bridé, prêt à partir... (bis)</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Quand tu seras dans ces campagnes<br>Tu ne penseras plus à moi,<br>Tu penseras aux Piémontaises<br>Qui sont cent fois plus belles que moi... (bis)</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Quand je serai dans ces campagnes<br>Je penserais toujours à toi,<br>Je ferai faire une belle image<br>Tout à la ressemblance de toi... (bis)</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Je l’ai aimée, je l’aime encore<br>Je l’aimerai tant que j’ vivrai<br>Je l’aimerai quand je serai mort<br>Si c’est donné aux trépassés. (bis)</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Alors, j’ai tant versé de larmes<br>Que trois moulins en ont tourné.<br>Petits ruisseaux, grandes rivières<br>Pendant trois jours ont débordé. (bis)</div></div></section>","128":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">File la laine</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>File la laine, filent les jours<br>Garde ma peine et mon amour<br>Livre d’images des rêves lourds<br>Ouvre la page à l’éternel retour.</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Dans la chanson de nos pères<br>Monsieur de Malbrough est mort,<br>Si c’était un pauvre hère<br>On n’en dirait rien encore ;<br>Mais la dame à sa fenêtre<br>Pleurant sur son triste sort<br>Dans mille ans, deux mille peut-être<br>Se désolera encore.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Hennins aux rubans de soie<br>Chansons bleues des troubadours,<br>Regrets des festins de joie<br>Ou fleurs du joli tambour,<br>Dans la grande cheminée<br>S’éteint le feu du bonheur<br>Car la dame abandonnée<br>Ne retrouvera son cœur.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Croisés des grandes batailles<br>Sachez vos lances manier !<br>Ajustez cottes de mailles<br>Armures et boucliers.<br>Si l’ennemi vous assaille<br>Gardez-vous de trépasser<br>Car derrière vos murailles<br>On attend sans se lasser.</div></div></section>","129":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Debout les gars</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Debout les gars, réveillez-vous<br>Il va falloir en mettre un coup<br>Debout les gars, réveillez-vous<br>On va au bout du monde !</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Vois-tu cette montagn’ là-bas<br>On en viendra à bout mon gars<br>Un bulldozer et deux cents bras<br>Et passera la route.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Il ne faut pas se dégonfler<br>Devant les tonnes de rochers,<br>On va s’faire un 14 juillet<br>A coups de dynamite.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Encore un mètre et deux ou trois<br>En 1983<br>Tes enfants seront fiers de toi<br>La route sera belle.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Il nous arrive parfois le soir<br>Comme un petit coup de cafard<br>Mais ce n’est qu’un peu de brouillard<br>Que le soleil déchire.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Les gens nous prennent pour des fous<br>Mais nous on passera partout<br>Et nous serons au rendez-vous<br>De ceux qui nous attendent.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Et quand tout sera terminé<br>Il faudra bien se séparer<br>On n’oubliera jamais, jamais<br>Ce qu’on a fait ensemble.</div></div></section>","130":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le Roi Arthur</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Le Roi Arthur avait trois fils, quel supplice !<br>Mais c’était un excellent roi, oui ma foi !<br>Par lui ses fils furent chassés,<br>Oui chassés à coups de pied<br>Pour n’avoir pas voulu chanter.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Pour n’avoir pas voulu chanter, ohé ! (bis)<br>Par lui ses fils furent chassés,<br>Oui chassés à coups de pied<br>Pour n’avoir pas voulu chanter.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Le premier fils se fit meunier, c’est bien vrai !<br>Le second se fit tisserand, oui, vraiment !<br>Le troisième se fit commis<br>D’un tailleur de son pays,<br>Un rouleau de drap sous le bras.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Pour n’avoir pas voulu chanter, ohé ! (bis)<br>Le troisième se fit commis ...</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Le premier fils volait du blé, c’est bien laid !<br>Le second fils volait du fil, c’est bien vil !<br>Et le commis du tailleur<br>Volait du drap à toute heure<br>Pour en habiller ses deux sœurs.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Pour n’avoir pas voulu chanter, ohé ! (bis)<br>Et le commis du tailleur ...</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Dans l’écluse le meunier se noya, Ha ! ha ! ha !<br>À son fil, le tisserand se pendit, Hi, hi, hi !<br>Et le diab’ mis en furie<br>Emporta le p’tit commis,<br>Un rouleau de drap sous le bras.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Pour n’avoir pas voulu chanter, ohé ! (bis)<br>Et le diable mis en furie ...</div></div></section>","131":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le soldat belge</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>C’était un soir sur les bords de l’Yser<br>Un soldat belge qui montait la faction<br>Vinrent à passer trois gardes militaires<br>Parmi lesquels était le roi Albert,<br>Qui vive là cria la sentinelle ?<br>Qui vive là vous ne passerez pas ?<br>Si vous passez craignez ma baïonnette,<br>Retirez-vous vous ne passerez pas ! (bis)<br>Halte-là !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Le roi Albert en fouillant dans ses poches,<br>Tiens, lui dit-il, et laisse-moi passer.<br>Non, répondit la brave sentinelle,<br>L’argent n’est pas pour un vrai soldat belge.<br>Dans mon pays, je cultivais la terre,<br>Dans mon pays, je gardais les brebis,<br>Mais, maintenant que je suis militaire,<br>Retirez-vous, vous ne passerez pas, (bis)<br>Halte-là !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Le roi Albert dit à ses camarades :<br>Fusillons-le, c’est un mauvais sujet.<br>Fusillons-le à la lueur des astres,<br>Fusillons-le, c’est un mauvais sujet.<br>Fusillez-moi, lui dit la sentinelle,<br>Fusillez-moi, vous ne passerez pas.<br>Si vous passez, craignez ma baïonnette.<br>Retirez-vous, vous ne passerez pas, (bis)<br>Halte-là !</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Le lendemain, au grand conseil de guerre,<br>Le roi Albert lui demanda son nom.<br>Tiens, lui dit-il, voilà la croix de guerre,<br>La croix de guerre et la décoration.<br>Que va-t-elle dire, ma bonne et tendre mère,<br>Que va-t-elle dire en me voyant si beau ?<br>La croix de guerre est à ma boutonnière<br>Pour avoir dit : vous ne passerez pas, (bis)<br>Halte-là !</div></div></section>","132":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Pour Dieu et ma Patrie</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Pour Dieu et ma Patrie<br>Je donnerai ma vie<br>Comme un bon soldat<br>Quand il le faudra<br>Si jamais on fait encore appel à moi<br>Pour Dieu et ma Patrie<br>Je donnerai ma vie<br>Au lever du jour, quand battront tambours<br>Je m’en irai sans me retourner sur mes amours.</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Quand de son char, Constantin vit aux Cieux<br>Le signe de la Gloire<br>Sur sa bannière, il fit tracer joyeux,<br>La Croix de la victoire.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Comme les croisés l’ont fait en d’autres temps<br>Sans haine mais sans crainte.<br>Allant chercher là-bas vers l’orient<br>Un peu de Terre Sainte.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Lorsque jadis le Turc a combattu<br>Les marins de Lépante<br>C’est la prière qui donna le salut<br>A notre flotte ardente.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Dans les tranchées, redécouvrant la foi,<br>Sur le bleu des vareuses<br>Ils ont offert et le cœur et la croix<br>Au feu des mitrailleuses.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Et nous aussi, reprenons le flambeau<br>Pour l’honneur de l’Eglise<br>Pour notre France, pour qu’un espoir nouveau<br>Enfin se réalise.</div><div class=\"refrain\"><div class=\"refrain-label\">Dernier refrain :</div>Pour Dieu et ma Patrie<br>Si je donne ma vie<br>Comme un bon soldat,<br>Quand l’instant viendra,<br>J’aimerais bien m’en aller au Ciel tout droit.<br>Pour Dieu et ma Patrie<br>Si je donne ma vie,<br>A la fin des jours, là-haut sans détour<br>Je m’en irai simplement retrouver mes amours.</div></div></section>","133":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les gars de Locminé</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Sont, sont, sont les gars de Locminé<br>Qui ont de la maillette sens dessus, dessous<br>Sont, sont sont les gars de Locminé<br>Qui ont de la maillette dessous leurs souliers.</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Mon Père, ma Mère d’Locminé y sont (bis)<br>Ils m’ont fait promesse qu’ils me marieront !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Ils m’ont fait promesse qu’ils me marieront ! (bis)<br>Mais s’ils me marient s’en repentiront !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Mais s’ils me marient s’en repentiront ! (bis)<br>Je vendrai leurs terres sillons par sillons.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Je vendrai leurs terres sillons par sillons (bis)<br>Au dernier bout d’terre, j’bâtirai maison.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Au dernier bout d’terre, j’bâtirai maison (bis)<br>Et si le Roy passe, nous l’inviterons.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Et si le Roy passe, nous l’inviterons (bis)<br>Et s’il veut des crêpes, nous lui en ferons...</div></div></section>","134":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La trompe sonne</div><div class=\"song-actions\"></div></div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>La trompe sonne dans les bois<br>L’ardente meute passe<br>Chasseurs brillants,<br>Piqueurs adroits s’élancent à la fois.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Entendez-vous ? De trente voix<br>Le bruit frappe l’espace<br>Taïaut, le cerf est aux abois<br>Il meurt, il meurt, je crois.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Ah que la chasse<br>Soit le plaisir des Roys !<br>Ah que la chasse<br>Soit le plaisir des Roys.</div></div></section>","135":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Berceuse du petit Prince</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Dormez, dormez, mon petit Prince,<br>N’ayez pas peur du loup-garou,<br>N’écoutez pas le vent qui grince,<br>Les Saints français veillent sur vous.</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Madame sainte Geneviève,<br>Qui filait en gardant Paris,<br>Vous file aujourd’hui de beaux rêves<br>Où l’Enfant Jésus vous sourit.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Madame sainte Radegonde,<br>Au balcon d’or du Paradis,<br>Penche sur vous sa tête blonde<br>Qui, comme un soleil, resplendit.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Madame Blanche de Castille<br>Etend sur vous son blanc manteau,<br>Où les lys glorieux fourmillent,<br>Afin que vous ayez bien chaud.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Monseigneur saint Michel, qui porte<br>Un glaive dont l’ombre éblouit,<br>Se tient debout à votre porte<br>Avec Monseigneur saint Louis.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Dans la neige en fleur de vos langes,<br>Mon petit Prince, dormez bien<br>Sous les yeux des Saints et des Anges,<br>Protecteurs des Rois très chrétiens.</div></div></section>","136":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le Roy Louis</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Le Roy Louis a convoqué<br>Tous ses barons et chevaliers.<br>Le Roy Louis a demandé :<br>Qui veut me suivre où que j’irai ?</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Les plus ardents se sont dressés,<br>Ont juré foi, fidélité.<br>Les plus prudents ont deviné<br>Où le Roy les voulait mener.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Ainsi parla le duc de Beaune :<br>Je combattrai pour le Royaume.<br>Le Roy lui dit : C’est point assez,<br>Nous défendrons la chrétienté.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Ainsi parla Seigneur d’Estienne :<br>Je défends la terre chrétienne,<br>Mais je ne veux pas m’en aller<br>Semer la mort dessus la mer.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Ah, dit le Roy, notre domaine<br>S’étend sur la rive africaine ;<br>Jusqu’au désert le plus avant<br>C’est notre fief et prix du sang.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>S’en est allé le Roy Louis,<br>Les plus fidèles l’ont suivi.<br>S’en sont allés bien loin, bien loin,<br>Pour conquérir le fief divin.</div></div></section>","137":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Saints de France</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Saints de France à qui notre histoire,<br>Doit ses jours de plus belle gloire,<br>Dans le malheur ou le danger,<br>Vous saurez bien nous protéger. (bis)</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>De la France qui se lève,<br>Dieu bénit le clair matin,<br>Par Clotilde et Geneviève<br>Saint Remi, et Saint Martin !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Des vieux Francs la Foi profonde<br>De l’Eglise est le soutien<br>Et Saint Louis présente au monde<br>L’idéal du Roi chrétien !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Quand se meurt la France en larmes,<br>Le secours lui vient du Ciel :<br>Jeanne d’Arc reçoit ses armes<br>De l’Archange Saint Michel.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Pour transmettre les messages<br>De son cœur victorieux,<br>Dieu choisit nos vierges sages<br>De Paray et de Lisieux.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Ô grands Saints, la France est fière<br>De compter près du Seigneur<br>Tant d’élus dont la prière<br>Est un gage de bonheur.</div></div></section>","138":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Russie libre</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Le peuple russe souffre la passion,<br>Mais sa résurrection<br>Fera trembler le rouge bastion<br>Et prendront fin ces temps de persécutions.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Quand les évêques et le Saint Père<br>Feront la consécration.<br>Dans les goulags, les martyrs espèrent<br>Mais quand donc s’accompliront ces prédictions ?</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Dans les ténèbres brûlent des cierges<br>Pour la Russie glorieuse !<br>A Fatima l’a promis la Vierge :<br>Du Kremlin, elle sera un jour victorieuse.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Russie libre en Chrétienté<br>Retrouvant l’Unité !<br>Paix, Justice et prospérité<br>Pour les nations recouvrant leur liberté.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>La Chrétienté enfin unie<br>Libérera la terre<br>Pour le Christ et la Vierge Marie,<br>Devant qui tous fléchiront genou en terre !</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Dieu, éclairez le clergé rebelle<br>Aux demandes de la Reine,<br>Qu’il entende enfin vos appels<br>Que votre Divin Cœur triomphe de la haine.</div></div></section>","139":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le Seigneur appelle ses militants</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Le Seigneur appelle tous ses militants<br>À la conquête de la Chrétienté.<br>L’heure tarde d’ordonner ce monde révoltant<br>À la loi d’amour et de vérité.<br>Le Seigneur est Roi de tout pays<br>Le nôtre est royaume de Marie.<br>Le Seigneur appelle tous ses militants<br>À la conquête de la Chrétienté.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Les peines de nos ancêtres et leurs souffrances<br>Au cours des âges ont fait la France.<br>Nous en sommes nés héritiers et notre honneur<br>Est de servir loyalement même Seigneur ;<br>Sa loi est juste, et bon est son cœur,<br>Et Lui ne garde point de rancœur.<br>Les peines de nos ancêtres et leurs souffrances<br>Au cours des âges ont fait la France.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Nous voulons ce que Dieu veut pour la France :<br>Un état juste, digne et chrétien,<br>Qui fortifie les Francs dans l’espérance<br>Et des humbles soit fidèle soutien.<br>Mais de partout les ennemis nous agressent<br>Et ils complotent pour que France disparaisse.<br>Nous voulons ce que Dieu veut pour la France :<br>Un état juste, digne et chrétien.</div></div></section>","140":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le cygne de Montfort</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Dindin Daon, Dann engann, Dann engann o ! (bis)<br>Dindin daon, Dann engann eann !</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Voici le cygne de Montfort<br>Qui fait blanchir la mer au bord,<br>C’est le Duc Jean au casque d’or !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Messire Jean est de retour,<br>Ohé guetteur, monte à la tour<br>Et que l’hermine claque au jour !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Les monts du Laz ont tressailli<br>La mer bondit, hennit, jaillit,<br>L’été revient sur le pays !</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Ô Notre Dame de l’Armor,<br>Préservez-nous de l’âpre mort,<br>De la défaite et du remords.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Le foin est mûr : qui fauchera ?<br>Les blés sont mûrs qui les prendra ?<br>Les morts, qui les recueillera ?</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Traîtres pensez au jugement,<br>L’heure viendra prochainement<br>Comptez vos os soigneusement.</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Nous ne ferons paix ni merci<br>Que nous ne vous ayons occis ;<br>Vous vouliez des hommes : en voici !</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Entendez-vous dans les cantons<br>Le hurlement des loups bretons,<br>Hou hou ! Partons ; hou hou ! Partons.</div></div></section>","141":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Honneur et Fidélité</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Honneur, Fidélité, Honneur, Fidélité<br>Sauront nous donner des jours plus beaux !</div><div class=\"verse\"><span class=\"verse-number\">1.</span>Par les routes inondées de lumière,<br>Nos chants montent dans un jour nouveau.<br>Dans le matin claquent nos bannières,<br>Notre Foi vit dans nos drapeaux !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Hier, amis, c’était l’aventure,<br>La guerr’ les routes, les combats sanglants.<br>Nous avons conquis une âme dure.<br>Amis, la France nous attend !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Partout la misère nous tenaille<br>Notre peuple souffre mille maux.<br>Mais nos cœurs tout prêts à la bataille<br>Feront naître des temps nouveaux !</div></section>","142":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le Roy Renaud</div><div class=\"song-actions\"></div></div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Le Roy Renaud, de guerre revint<br>Tenant ses tripes dans ses mains.<br>Sa mère était sur les créneaux<br>Qui vit venir son fils Renaud.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>« Mon fils Renaud, réjouis toi,<br>Ta femme a mis au monde un roi. »<br>« - Ni de ma femme, ni de mon fils<br>Je ne saurais me réjouir. »</div><div class=\"verse\"><span class=\"verse-number\">3.</span>« Faites moi vite un beau lit blanc<br>Je n’y dormirai pas longtemps ! »<br>Et quand ce vint sur les minuits<br>Le Roi Renaud rendit l’esprit.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>« Ah ! dites moi, mère, m’amie,<br>Que pleurent nos valets ici ? »<br>« Ma fille en baignant les chevaux,<br>Ont laissé noyer les plus beaux. »</div><div class=\"verse\"><span class=\"verse-number\">5.</span>« Ah ! dites moi, mère, m’amie,<br>Pourquoi j’entends cogner ici ? »<br>« - Ma fille ce sont les charpentiers<br>Qui raccommodent les greniers. »</div><div class=\"verse\"><span class=\"verse-number\">6.</span>« Ah ! dites moi, mère, m’amie,<br>Que chantent les prêtres ici ? »<br>« - Ma fille c’est la procession<br>Qui fait le tour de la maison. »</div><div class=\"verse\"><span class=\"verse-number\">7.</span>« Ah ! dites moi, mère, m’amie,<br>Quel habit prendrai-je aujourd’hui ? »<br>« - Prenez le vert, prenez le gris,<br>Prenez le noir, pour mieux choisir. »</div><div class=\"verse\"><span class=\"verse-number\">8.</span>« Ah ! dites moi, mère, m’amie,<br>Ce que ce noir là signifie ? »<br>« - La femme qui relève d’enfant<br>Le noir lui est bien plus séant. »</div><div class=\"verse\"><span class=\"verse-number\">9.</span>« - Ah ! dites moi, mère, m’amie,<br>Irai-je à la messe aujourd’hui ? »<br>« - Ma fille, attendez à demain,<br>Et vous irez pour le certain. »</div><div class=\"verse\"><span class=\"verse-number\">10.</span>« Ah ! dites moi, mère, m’amie,<br>Que disent ces pastoureaux-ci ? »<br>« - Ils disent d’avancer le pas,<br>Ou que la messe n’aurons pas. »</div><div class=\"verse\"><span class=\"verse-number\">11.</span>Quand à l’église fut arrivée<br>Le cierge on lui a présenté,<br>Elle aperçut, s’agenouillant<br>La terre fraîche sous la banc.</div><div class=\"verse\"><span class=\"verse-number\">12.</span>« Ah! dites moi, mère, m’amie,<br>Pourquoi la terre est fraîche ici ? »<br>« - Ma fille ne peux vous le celer<br>Renaud est mort et enterré. »</div></div></section>","143":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La violette</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>La violette double, double,<br>La violette doublera !</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>J’ai une amie dans le monde,<br>Mais elle est bien loin, hélas ! (bis)<br>J’ai quelque chose à lui dire,<br>Oui, mais qui le lui dira ?</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Si je le dis à l’alouette,<br>Tout le monde le saura ; (bis)<br>Rossignol du vert bocage,<br>Faites-moi ce plaisir-là.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Rossignol prend sa volée,<br>Au château d’amour s’en va ; (bis)<br>Trouvant la porte fermée,<br>Par la fenêtre il entra.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Bonjour l’une, bonjour l’autre,<br>Bonjour la belle que voilà ; (bis)<br>C’est votre amant qui demande,<br>Que vous ne l’oubliiez pas.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Quoi, mon ami me demande<br>Que je ne l’oublie pas ? (bis)<br>J’en ai oublié bien d’autres,<br>J’oublierai bien celui-là !</div><div class=\"verse\"><span class=\"verse-number\">6.</span>S’il était venu lui-même,<br>N’aurait pas perdu ses pas ; (bis)<br>Tout ami qui craint sa peine<br>Restera dans l’embarras.</div></div></section>","144":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les Terres Saintes</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Sellez donc bridez donc belles montures<br>Vrais chevaliers tombez toute parure !<br>Armez-vous drapez-vous de votre Foi<br>Fiers chrétiens le Seigneur vous envoie !<br>Nos enfants exaltent de joie<br>Front de l’amour et chantant sans peur<br>De nos âmes ils vont défendre<br>La Jérusalem de leur cœur.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Les remparts d’une sainte famille<br>Foyer, chaleur qui point ne vacillent<br>Les fortes enceintes des dynasties<br>Offrant tutelle à tous ses amis.<br>La fleur fade est de courtoisie<br>La fleur de France s’est remise,<br>Roi Saint Louis, à l’ombre du chêne<br>Brille pour cette terre promise.</div><div class=\"verse nonum\">La la la la ...<br>La la la la ...</div></section>","145":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Vive Henri IV</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Vive Henri IV,<br>Vive ce Roy vaillant ;<br>Ce diable à quatre<br>Eut le triple talent<br>De boire et de battre,<br>Et d’être un vert galant.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Chantons l’antienne<br>Qu’on chant’ra dans mille ans :<br>Que Dieu maintienne<br>En paix ses descendants,<br>Jusqu’à ce qu’on prenne<br>La lune avec ses dents !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Au diable guerres,<br>Rancunes et partis !<br>Comme nos pères<br>Chantons en vrais amis,<br>Au choc des verres,<br>Les roses et les lys.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Vive la France !<br>Vive le roi Henry ;<br>Qu’à Reims on danse,<br>En disant comm’ Paris :<br>Vive la France !<br>Vive le roi Henry !</div></div></section>","146":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Marche des vagabonds</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Nous sommes les vagabonds,<br>Sans toit ni maison.<br>Seul, Dieu sait où nous allons<br>Par vaux et par monts.<br>Nous errons à l’aventure.<br>Sans souci du pain ;<br>Et nous logeons sur la dure<br>Sans songer au lendemain.<br>Marchons, marchons,<br>Devant nous la route est libre.<br>Marchons, marchons,<br>Nous sommes les vagabonds.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>L’hiver, sous sa rude loi,<br>Nous remplit d’effroi.<br>Nous devons subir le froid,<br>Cachés dans les bois,<br>Une cabane méchante<br>Pour nous abriter.<br>Alors, la route nous chante<br>Son appel hospitalier.<br>Marchons, marchons,<br>C’est la route qui réchauffe.<br>Marchons, marchons,<br>Nous sommes les vagabonds.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Mais l’été, par les chemins,<br>Nous marchons sans fin.<br>Dieu nous mène par la main,<br>Calme notre faim.<br>Lorsque tombe la nuitée,<br>Lassés mais sereins,<br>Nous rêvons à la journée<br>Qui se lèvera demain.<br>Marchons, marchons,<br>C’est le soleil qui nous guide.<br>Marchons, marchons,<br>Nous sommes les vagabonds.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Nous sommes les vagabonds,<br>Sans toit ni maison.<br>Seul, Dieu sait où nous allons,<br>Par vaux et par monts.<br>Chaque jour est une étape,<br>Vers le Paradis.<br>Malgré les maux qui nous frappent,<br>Le blanc chemin nous sourit.<br>Marchons, marchons,<br>Vers les cieux où Dieu nous mène.<br>Marchons, marchons,<br>Nous sommes les vagabonds.</div></div></section>","147":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Silvestrick</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>A Saint-Michel en grève,<br>Mon fils s’est engagé.<br>M’en fus en capitaine<br>Pour lui demander :<br>«Mon vieux, c’est impossible,<br>C’est mon meilleur soldat.<br>Il a touché sa prime,<br>Je ne le rendrai pas.»</div><div class=\"verse\"><span class=\"verse-number\">2.</span>«Oiseau de ma muraille,<br>Va-t’en vers mon enfant<br>Savoir s’il est en vie,<br>S’il est au régiment.<br>-Bonjour ! petit Sylvestre<br>-Bonjour ! petit oiseau<br>Va dire à mon vieux père<br>Que je reviens bientôt.»</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Le vieux bonhomme pleure<br>Là-bas dans sa maison.<br>Au loin les filles chantent<br>Le chant de son garçon.<br>Le soldat sur la porte<br>L’écoute avec amour :<br>«Ne pleure pas mon père<br>Sylvestre est de retour.»</div></div></section>","148":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Monsieur de Turenne</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse nonum\">(Sur l’air de la Marche des Rois)</div><div class=\"verse\"><span class=\"verse-number\">1.</span>M’sieur d’Turenne a dit aux Poitevins,<br>Qui avons soif et lui demande à boire<br>M’sieur d’Turenne a dit aux Poitevins :<br>Aux Champs d’Alsace il pousse aussi du vin !<br>Et ce vin-là pétille mieux,<br>S’il est versé par Madame la Gloire,<br>Et ce vin-là pétille mieux<br>Lorsqu’il s’y mêle un flot de sang joyeux !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>M’sieur d’Turenne a dit aux Provençaux,<br>Très désireux d’entendre les cigales<br>M’sieur d’Turenne a dit aux Provençaux :<br>La poudre sonne à l’heure des assauts !<br>Dans l’air en feu vous entendrez<br>Autour de vous la musique des balles,<br>Dans l’air en feu vous entendrez :<br>Les cigalons de soleil enivrés.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>M’sieur d’Turenne a dit aux gars Bretons,<br>A qui les cloches donnent du courage<br>M’sieur d’Turenne a dit aux gars Bretons :<br>Morbleu ! Courez me prendre ces canons !<br>Avec leur bronze l’on fera<br>De quoi sonner par-dessus vos églises,<br>Avec leur bronze l’on fera<br>De quoi sonner lorsqu’on vous mariera.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>M’sieur d’Turenne a dit aux gens du Roi<br>Qui marchent fiers sous les drapeaux de France,<br>M’sieur d’Turenne a dit aux gens du Roi :<br>Levez la tête et tenez le corps droit !<br>Aux jolis yeux sachez soldats<br>Mousquets au poing faire la révérence,<br>Aux jolis yeux sachez soldats<br>Quant aux boulets ne les saluez pas !</div></div></section>","149":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Réveillez-vous Picards</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Réveillez-vous Picards, Picards et Bourguignons,<br>Et trouvez la manière d’avoir de bons bâtons ;<br>Car voici le printemps et aussi la saison<br>Pour aller à la guerre donner des horions...</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Tel parle de la guerre et ne sait que c’est ;<br>Je vous jure mon âme que c’est un piteux faict ;<br>Et que maint hommes d’armes et gentils compagnons<br>Y ont perdu la vie et robe et chaperon.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Où est ce duc d’Autriche ? Il est au Pays-Bas ;<br>Il est en Basse Flandre avecque ses Picards<br>Qui nuit et jour le prient qu’il les veuille mener<br>En la haute Bourgogne pour la lui subjuguer.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Quand serons en Bourgogne et Franche-Comté<br>Ce sera qui qu’en grogne le temps de festoyer.<br>Boutrons le Roy de France dehors de ces costeaux<br>Et mettrons en nos panses le vin de leurs tonneaux.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Adieu, adieu, Salins ! Salins et Besançon !<br>Et la ville de Beaune, là où les bons vins sont<br>Les Picards les ont bus, les Flamands les paieront<br>Quatre pastards la pinte, ou bien battus seront.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Nous lansquenets et reîtres et soudards si marchons<br>Sans finir de connaître où nous arriverons<br>Aidons Dame Fortune et Destin que suivons<br>A prêter longue vie aux soldats bourguignons.</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Quand mourrons de malheur la hacquebutte au poing<br>Le duc notre seigneur digne tombeau nous doint<br>Et que dedans la terre où tous nous dormirons<br>Fasse le repos guerre aux braves bourguignons.</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Et quand viendra le temps où trompes sonneront<br>Au dernier ralliement, quand nos tambours battront<br>Nous lèverons bannière aux fusils bourguignons<br>Pour aller à la guerre donner des horions.</div></div></section>","150":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les Lansquenets</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Ce monde vétuste et sans joie, Faïlalla<br>Croulera demain devant notre Foi, Faïlalla<br>Et nos marches guerrières<br>Feront frémir la terre<br>Au rythme des hauts tambours des lansquenets. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Que nous font insultes et horions, Faïlalla<br>Un jour viendra où les traîtres paieront, Faïlalla<br>Qu’ils freinent donc s’ils osent<br>Notre ascension grandiose<br>Que rythment les hauts tambours des lansquenets. (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Nous luttons pour notre idéal, Faïlalla<br>Pour un ordre catholique et royal, Faïlalla<br>Et à l’heure dernière<br>Nous quitterons la terre<br>Au rythme des hauts tambours des lansquenets. (bis)</div></section>","151":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les Dragons de Noailles</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Lon, lon, la, laissez les passer<br>Les Français reprennent la Lorraine,<br>Lon, lon, la, laissez les passer<br>Ils ont eu du mal assez.</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Ils ont traversé le Rhin<br>Avec Monsieur de Turenne.<br>Jouez fifres et tambourins,<br>Ils ont traversé le Rhin.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Ils ont fait tous les chemins<br>D’Anjou, d’Artois et du Maine.<br>Ils n’ont jamais eu peur de rien.<br>Ils ont fait tous les chemins.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Ils ont incendié Coblence,<br>Les fiers Dragons de Noailles,<br>Et pillé le Palatinat.<br>Ils ont incendié Coblence.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Ils ont pavoisé Paris,<br>Les fiers Dragons de Noailles ;<br>Avec les trophées ennemis,<br>Ils ont pavoisé Paris.</div></div></section>","152":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Déjà mal mariée</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Mon père m’a mariée<br>A un tailleur de pierre ; (bis)<br>Le lendemain de mes noces,<br>M’envoie-t-à la carrière.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Lonlà ! déjà mal mariée déjà,<br>Déjà mal mariée, gué<br>Déjà mal mariée déjà,<br>Déjà mal mariée gué !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Le lendemain d’ mes noces<br>M’envoie-t-à la carrière; (bis)<br>Et j’ai trempé mon pain<br>Dans le jus de la pierre.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Et j’ai trempé...<br>Par là vint à passer<br>Le curé du village.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Par là vint à passer ...<br>Bonjour, Monsieur le curé,<br>J’ai trois mots à vous dire.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Bonjour, Monsieur le curé ...<br>Hier vous m’avez fait femme,<br>Aujourd’hui faites-moi fille.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Hier vous m’avez fait femme ...<br>Hélas de fille j’fais femme,<br>De femme je n’fais point fille.</div></div></section>","153":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les Partisans blancs</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Dans le froid et la famine,<br>Par les villes et par les champs,<br>A l’appel de Denikine<br>Marchaient les Partisans blancs. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Sabrant les troupes bolcheviques<br>Et ralliant les Attamans,<br>Dans leurs campagnes épiques<br>Ils traquaient Trotski tremblant. (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>C’est pour la sainte Russie,<br>Pour la vieille tradition,<br>Pour la gloire et la patrie<br>Que luttaient ces bataillons. (bis)</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Souffle le vent, sifflent les balles,<br>Gronde le son du canon,<br>Parmi la mort, les rafales,<br>Se tiennent les bataillons. (bis)</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Se tienn’ debout dans la tempête,<br>Germe d’or au sein du chaos,<br>Camarades levez la tête<br>Avant d’monter à l’assaut. (bis)</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Au cri : «viv’ la sainte Russie»<br>Nous écraserons les bolcheviques !<br>Au galop des ch’vaux cosaques (bis)<br>Nous libérerons la patrie.</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Votre gloire est immortelle,<br>Volontaires et officiers blancs,<br>Et votre agonie cruelle<br>La honte de l’Occident. (bis)</div></div></section>","154":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La mort de Saint François</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Ô frère, gentil frère, quand mourut-il ?<br>Ô frère, gentil frère, quand mourut-il ?<br>Quand mourut-il d’amour, quand mourut-il ?<br>Quand mourut-il ?</div><div class=\"verse\"><span class=\"verse-number\">2.</span>C’était un jour d’automne, Vers le midi. (bis)<br>Vers le midi, d’amour,<br>Vers le midi, vers le midi.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Ô frère, gentil frère, où gisait-il ?...</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Dans très froide cabane, Méchant réduit...</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Ô frère, gentil frère, Que souffrait-il ?</div><div class=\"verse\"><span class=\"verse-number\">6.</span>En tout son corps, semblable au Crucifix.</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Ô frère, gentil frère, Quel fut son lit ?</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Nu, sur la terre nue, Il s’endormit.</div><div class=\"verse\"><span class=\"verse-number\">9.</span>Ô frère, gentil frère, a-t-il frémi ?</div><div class=\"verse\"><span class=\"verse-number\">10.</span>Comme au sommeil qui berce, il a souri.</div><div class=\"verse\"><span class=\"verse-number\">11.</span>Ô frère, gentil frère, et qu’a-t-il dit ?</div><div class=\"verse\"><span class=\"verse-number\">12.</span>Sœur la mort corporelle est notre amie.</div><div class=\"verse\"><span class=\"verse-number\">13.</span>Ô frère, gentil frère, qui l’a ravi ?</div><div class=\"verse\"><span class=\"verse-number\">14.</span>Ce sont les mains sanglantes du Christ béni.</div></div></section>","155":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La légende de Saint Nicolas</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Ils étaient trois petits enfants<br>Qui s’en allaient glaner aux champs.</div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Tant sont allés tant sont venus<br>Que le soir se sont perdus.<br>S’en sont allés chez le boucher<br>Boucher voudrais-tu nous loger ?</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Allez-vous-en, les garnements !<br>Nous avons trop d’empêchements.<br>Mais sa femme qui l’entendit,<br>Tout aussitôt le gourmandit.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Pour sûr dit-ell’ qu’ils ont de l’argent.<br>Nous en serons riches d’autant !<br>Entrez, entrez, mes beaux enfants,<br>Y a d’ la place assurément !</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Ils n’étaient pas sitôt entrés<br>Que le boucher les a tués !<br>Les a coupés en p’tits morceaux,<br>Mis au saloir comme pourceaux.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Saint Nicolas, au bout d’sept ans,<br>Vint à passer dedans ce champ.<br>Alla frapper chez le boucher :<br>Boucher, voudrais-tu me loger ?</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Entrez, entrez, saint Nicolas,<br>Il y a d’ la place, n’en manque pas !<br>Il n’était pas sitôt entré<br>Qu’il a demandé à souper.</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Voulez un morceau d’ jambon ?<br>Je n’en veux point, il n’est point bon…<br>Voulez-vous mieux un’ tranch’ de veau ?<br>Tu ris de moi, il n’est point beau !</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Du p’tit salé je veux avoir<br>Qu’il y a sept ans qu’est au saloir.<br>Saint Nicolas alla s’asseoir<br>Dessus le bord de ce saloir.</div><div class=\"verse\"><span class=\"verse-number\">9.</span>Petits enfants qui dormez là,<br>Je suis le grand Saint Nicolas !<br>Et le saint étendit trois doigts.<br>Les enfants se lèvent tous les trois.</div><div class=\"verse\"><span class=\"verse-number\">10.</span>Le premier dit : J’ai bien dormi !<br>Le second dit : Et moi aussi !<br>A ajouté le plus petit :<br>Je croyais être au Paradis !</div></div></section>","156":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Cadet Rousselle</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Cadet Rousselle a trois maisons (bis)<br>Qui n’ont ni poutres ni chevrons, (bis)<br>C’est pour loger les hirondelles<br>Que direz-vous d’Cadet Rousselle ?</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Ah! Ah! Ah! oui vraiment<br>Cadet Rousselle est bon enfant.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Cadet Rousselle a trois garçons : (bis)<br>L’un est voleur, l’autre est fripon (bis)<br>Le troisième est un peu ficelle<br>Il ressemble à Cadet Rousselle.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Cadet Rousselle a marié (bis)<br>Ses trois filles dans trois quartiers (bis)<br>Les deux premièr’s ne sont pas belles<br>La troisièm’ n’a pas de cervelle…</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Cadet Rousselle a trois gros chiens (bis)<br>L’un court aux lièvres l’autre aux lapins (bis)<br>L’troisièm’ s’enfuit quand on l’appelle<br>Comm’ le chien de Jean de Nivelle.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Cadet Rousselle a trois beaux chats (bis)<br>Qui n’attaquent jamais les rats (bis)<br>Le troisième n’a pas de prunelle<br>Il monte au grenier sans chandelle.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Cadet Rousselle a trois beaux yeux (bis)<br>L’un regarde à Caen, l’autre à Bayeux (bis)<br>Comme il n’a pas la vue bien nette<br>Le troisième c’est sa lorgnette…</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Cadet Rousselle ne mourra pas (bis)<br>Car avant de sauter le pas (bis)<br>On dit qu’il apprend l’orthographe,<br>Pour faire lui-même son épitaphe.</div></div></section>","157":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La laine des moutons</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>La laine des moutons<br>C’est nous qui la tondaine.<br>La laine des moutons<br>C’est nous qui la tondons.<br>Tondons, tondons,<br>La laine des moutaines,<br>Tondons, tondons,<br>La laine des moutons.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>La laine des moutons.<br>C’est nous qui la lavaine…<br>...Tondons, lavons...</div><div class=\"verse\"><span class=\"verse-number\">3.</span>… C’est nous qui la cardaine…</div><div class=\"verse\"><span class=\"verse-number\">4.</span>… C’est nous qui la filaine…</div><div class=\"verse\"><span class=\"verse-number\">5.</span>… C’est nous qui la vendaine…</div><div class=\"verse\"><span class=\"verse-number\">6.</span>… C’est nous qui la chantaine…</div></section>","158":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le sire de Framboisy</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>C’était l’histoire du sire de Framboisy, (bis)<br>Et youp et youp ! et tra la la la!<br>Et youp et youp ! et tra la la la!</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Qui prit pour femme, la plus belle du pays...</div><div class=\"verse\"><span class=\"verse-number\">3.</span>La prit trop jeune, bientôt s’en repentit...</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Partit en guerre, afin qu’elle mûrit...</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Revint de guerre, après cinq ans et d’mi...</div><div class=\"verse\"><span class=\"verse-number\">6.</span>N’trouva personne, de la cave au chenil...</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Chercha la belle, trois jours et quatre nuits...</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Un grand silence, hélas, lui répondit...</div><div class=\"verse\"><span class=\"verse-number\">9.</span>Le pauvre sire courut dans tout Paris...</div><div class=\"verse\"><span class=\"verse-number\">10.</span>Trouva la belle, dans un bal à Clichy...</div><div class=\"verse\"><span class=\"verse-number\">11.</span>Corbleu, princesse, que faites vous ici?...</div><div class=\"verse\"><span class=\"verse-number\">12.</span>Voyez, je danse avecque mes amis...</div><div class=\"verse\"><span class=\"verse-number\">13.</span>Dans son carrosse, la r’mène à Framboisy...</div><div class=\"verse\"><span class=\"verse-number\">14.</span>Il l’empoisonne avec du vert de gris...</div><div class=\"verse\"><span class=\"verse-number\">15.</span>Et sur sa fosse, il sema du persil...</div><div class=\"verse\"><span class=\"verse-number\">16.</span>De cette histoire, la moral’, la voici...</div><div class=\"verse\"><span class=\"verse-number\">17.</span>A jeune femme, il faut jeune mari !...</div></div></section>","159":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Kergariou</div><div class=\"song-actions\"></div></div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Il s’appelait Kergariou,<br>Il s’en venait d’on ne sait où,<br>Probablement du Finistère.<br>Bien qu’il eût d’illustres aïeux,<br>Il était pauvre comme un gueux,<br>Il n’en faisait aucun mystère,<br>Portait l’habit des anciens jours,<br>Et mettait le même tous les jours<br>Hiver, été, printemps, automne ;<br>Vint à Paris en Bragou Braz,<br>Appuyé sur un grand Pen Baz,<br>A la Bretonne !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Mais en arrivant à la cour,<br>Il eut deux duels chaque jour,<br>Le matin et l’après souper,<br>Pour prouver aux gens de bon ton,<br>Que s’il jouait bien du bâton,<br>Il tirait encore mieux de l’épée ;<br>Il n’avait que des ennemis.<br>Au vingtième il eut pour amis<br>Tous les gens de la capitale ;<br>Devint alors un élégant,<br>Habit bleu, jabot catogan,<br>A la Royale !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Chantez trompettes et tambours,<br>Adieu Paris et les amours ;<br>Kergariou part à la guerre,<br>Il s’y bat gaiement, sans souci ;<br>La mort est une femme aussi,<br>Kergariou ne la craint guère.<br>Or le matin de Fontenoy,<br>Nous ayant crié Suivez-moi !<br>Il fondit sur la troupe anglaise ;<br>Reçut trois balles dans la peau,<br>Et mourut devant son drapeau,<br>A la Française !</div></div></section>","160":"<div class=\"pdfimg\" data-img=\"160\" data-alt=\"Illustration du carnet\"></div>","161":"<div class=\"pdfimg\" data-img=\"161\" data-alt=\"Chants de guerre\"></div>","162":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La Cavalcade</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Un jour dans la fusillade,<br>Galopant à l’inconnu<br>Nous marchions en cavalcade,<br>Tu étais mon camarade<br>Celui que j’aimais le plus. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Un cavalier par bravade,<br>Des siens le plus résolu,<br>Me porta son estocade<br>Ce fut toi mon camarade<br>Ce fut toi qui la reçue. (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>J’ai vengé l’estafilade<br>Que ce coup t’avait valu,<br>Mais très tard dans la nuit froide,<br>J’ai pleuré mon camarade<br>Près de son corps étendu. (bis)</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Je suis ma route maussade,<br>Et je chevauche sans but.<br>Au hasard d’une embuscade,<br>J’ai perdu mon camarade.<br>Je ne rirai jamais plus. (bis)</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Prince écoute ma ballade, et mon appel éperdu :<br>Prie le Dieu des cavalcades,<br>De placer mon camarade<br>A la droite de Jésus. (bis)</div></div></section>","163":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les Africains</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Nous étions au fond de l’Afrique,<br>Gardiens jaloux de nos couleurs.<br>Quand sous un soleil magnifique,<br>Retentissait ce cri vainqueur :<br>En avant, en avant, en avant !</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>C’est nous les africains qui arrivons de loin,<br>Venant des colonies pour sauver la Patrie.<br>Nous avons tout quitté, parents, gourbis, foyer.<br>Et nous gardons au cœur une invincible ardeur<br>Car nous voulons porter haut et fier,<br>Le beau drapeau de notre France entière.<br>Et si quelqu’un venait à y toucher,<br>Nous serions là pour mourir à ses pieds.<br>Battez tambour, à nos amours,<br>Pour le pays, pour la Patrie,<br>Mourir au loin, c’est nous les africains</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Pour le salut de notre Empire,<br>Nous combattons tous les vautours.<br>La faim, la mort nous font sourire,<br>Quand nous luttons pour nos amours.<br>En avant, en avant, en avant !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>De tous les horizons de France,<br>Groupés sur le sol africain<br>Nous venons pour la délivrance<br>Qui, par nous se fera demain.<br>En avant, en avant, en avant !</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Et lorsque finira la guerre,<br>Nous reviendrons à nos gourbis<br>Le cœur joyeux et l’âme fière<br>D’avoir libéré le pays<br>En criant, en chantant, en avant...</div></div></section>","164":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le Combat de demain</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Etait noire la nuit, était rouge le feu.<br>La Nation semblait à l’agonie.<br>Plus de chefs, plus de foi,<br>Un destin malheureux<br>S’abattait sur la chère Patrie.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Les héros d’autrefois nous convient à leur foi<br>Camarades, groupons-nous en avant,<br>Les héros d’autrefois nous convient à leur foi<br>Camarades tous ensemble à l’assaut !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Tous sont morts et leurs casques rouillés dans le vent<br>Veillent sur mille tombes fleuries<br>Sur la route au lointain<br>Nos chars rythment en grondant<br>Le refrain de la grande Patrie</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Le cri de notre histoire et la terre et les morts<br>Nous appellent au combat de demain.<br>Nous jurons d’être unis,<br>Nous jurons d’être forts.<br>France, ton avenir est le mien.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Etait noire la nuit, était rouge le feu<br>C’était le moment du grand assaut,<br>Coude à coude en marchant<br>Ils chantaient par lambeaux<br>Le refrain de l’hymne des adieux.</div></div></section>","165":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les Bérets verts</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Dans le ciel, couleur d’acier,<br>Ils descendent par milliers,<br>Ceux qui vont sur cette terre,<br>Lutter pour le béret vert.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Il faut croire ce que l’on dit,<br>Ne dire que si l’on agit,<br>Etre brave et être fier,<br>Pour gagner le béret vert.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Ils sont parmi les meilleurs,<br>Qui combattent et qui meurent,<br>Pour l’Occident qui espère,<br>Rester grâce aux bérets verts.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Il est tombé en laissant,<br>Avec ses ailes d’argent,<br>Une lettre pour sa femme,<br>Une lettre du Vietnam.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Donne les ailes d’argent,<br>Au fils quand il sera grand,<br>Qu’il soit brave et qu’il soit fier,<br>Pour gagner son béret vert.</div></div></section>","166":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les Commandos</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Les Commandos partent pour l’aventure,<br>Soleil couchant les salue.<br>Chez l’ennemi la vie sera très dure,<br>Pour ceux qui pillent et qui tuent.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>France, ô ma France très belle,<br>Pour toi je ferai bataille,<br>Je quitterai père et mère,<br>Sans espoir de les revoir jamais.<br>La la la la la la la......</div><div class=\"verse\"><span class=\"verse-number\">2.</span>En pagayant sur la mer toujours belle,<br>Ils songeront à leur vie.<br>Demain, peut-être elle sera éternelle,<br>Ils tomberont dans l’oubli.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Loin du biffin qui toujours les envie,<br>Un Dakota les dépose.<br>Loin de la fille qui pour eux toujours prie,<br>Dans leur pépin ils reposent.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Si d’aventure la mort les refuse,<br>Ils reviendront vers le port.<br>Ils sabreront le champagne qui fuse,<br>A la santé de leurs morts</div></div></section>","167":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Marche du 1er Commando de France</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Quel est cet orage qui gronde ?<br>Quel est ce signe dans le ciel ?<br>Est-ce la fin de notre monde,<br>L’apocalypse qui nous réveille ?<br>Ce sont nos frères, nos camarades<br>Qui chantent ensemble et en cadence<br>Le grand Requiem de parade<br>Du Premier Commando de France</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>C’est la grande marche virile,<br>C’est la grande marche du sang,<br>C’est le grand rythme des cœurs d’hommes, Oh Commando !<br>C’est la grande marche virile des Commandos<br>C’est la grande marche du sang des Commandos<br>C’est le grand rythme des cœurs d’hommes,<br>Que les femmes, ah les femmes n’entendent jamais Commando !(bis)<br>C’est du sang nouveau<br>Comme du vin nouveau<br>Mais pas pour les lèvres des femmes.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Ils ont vaincu sous un ciel noir,<br>Mais ils n’ont pas pleuré leurs morts<br>Car dans l’amour de la victoire,<br>Ils se sont révélés plus forts.<br>Ils ont servi sur leurs tombeaux<br>Une patrie que leur vaillance<br>Fera plus nette que les couteaux<br>Du Premier Commando de France.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Un jour on les verra combattre<br>Ils seront beaux, ils seront purs<br>Ainsi ils marchent volontaires,<br>Vers la mitraille, sans murmure<br>Et sans murmure dans la souffrance<br>Pour mieux entendre au loin les cris<br>Echo des morts des ennemis<br>Du Premier Commando de France.</div></div></section>","168":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les Cuirassiers</div><div class=\"song-actions\"></div></div><div class=\"verse nonum\">Au milieu de la bataille,<br>Sur les étriers de leurs grands chevaux,<br>Grisés par le sang, la mitraille,<br>Les cuirassiers chargent au galop.</div><div class=\"verse nonum\">C’est la charge, c’est la foudre,<br>C’est l’assaut dans le sang et dans la poudre,<br>L’ennemi s’enfuit, l’épée dans les reins,<br>Laissant tous ses morts sur le terrain.</div><div class=\"verse nonum\">Les cuirassiers sur les étriers<br>De leurs grands chevaux,<br>Pour mieux boir’ à la victoire<br>Remettent vivement les sabres au fourreau.</div></section>","169":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Sarie Mares</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Sarie Mares, belle amie d’autrefois<br>En moi tu demeures vive.<br>L’amour est plus fort que la pluie et que le vent.<br>Qui peut arrêter son élan ?</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Je veux revoir, dans mon vieux Transvaal,<br>Ma ferme au toit de chaume.<br>Où le parfum du miel, et des conifères embaument.<br>L’air pur est clair comme un cristal. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Sarie Mares est bien loin de mon cœur<br>Mais je crois en son amour.<br>Car c’est entre ses bras que j’ai connu le bonheur.<br>J’irai la revoir un jour.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Quand j’étais petit, je croyais qu’un démon<br>Venait me ravir ma maison.<br>Mais lorsque je fus grand, ce fut une horrible guerre<br>Qui m’emmena loin de mes terres.</div></section>","170":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Alléluia !</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Nous sommes partis de bon matin avant le jour (ter)<br>La nuit était comme un four...<br>Glory, Glory, Alléluia (ter)<br>Bon voyage pour les paras !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Longue est la route qui serpente devant nous (ter)<br>Mais nous irons jusqu’au bout...<br>Glory, Glory, Alléluia (ter)<br>Bon voyage pour les paras !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Oui, nous avons les traits tirés, les pieds poudreux (ter)<br>Mais nous sommes les plus heureux...<br>Glory, GIory, Alléluia (ter)<br>Bon voyage pour les paras !</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Oui, nous irons nous faire casser la gueule en chœur (ter)<br>Mais nous reviendrons vainqueurs...<br>Glory, Glory, Alléluia (ter)<br>Bon voyage pour les paras !</div></section>","171":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Chant des marais</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Loin dans l’infini s’étendent<br>Les grands prés marécageux,<br>Pas un seul oiseau ne chante<br>Dans les arbres secs et creux.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Ô terre de détresse<br>Où nous devons sans cesse<br>Piocher, piocher, piocher.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Dans ce camp morne et sauvage<br>Entouré de fils de fer,<br>Il nous semble vivre en cage<br>Au milieu d’un grand désert.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Bruits de chaînes, bruits des armes<br>Sentinelles jour et nuit<br>Des cris, des pleurs et des larmes,<br>La mort pour celui qui fuit.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Mais un jour dans notre vie,<br>Le printemps refleurira,<br>Liberté, liberté chérie<br>Je dirai : «Tu es à moi» !</div><div class=\"refrain\"><div class=\"refrain-label\">Dernier refrain :</div>Ô terre d’allégresse<br>Où nous pourrons sans cesse,<br>Aimer, aimer, aimer.</div></div></section>","172":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Marche de la 2ème DB</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Après le Tchad, l’Angleterre et la France,<br>Le grand chemin qui mène vers Paris,<br>Le cœur joyeux tout gonflé d’espérance<br>Ils ont suivi la gloire qui les conduit.<br>Sur une France une croix de Lorraine<br>Écusson d’or qu’on porte fièrement ;<br>C’est le joyau que veulent nos marraines<br>C’est le flambeau de tous nos régiments.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Division de fer, toujours en avant<br>Les gars de Leclerc passent en chantant.<br>Jamais ils ne s’attardent :<br>La victoire n’attend pas.<br>Et chacun les regarde<br>Saluant chapeau bas.<br>Division de fer<br>Toujours souriant<br>Les gars de Leclerc<br>Passent en chantant<br>DB ! Vive la deuxième DB !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Il ont vécu des heures merveilleuses<br>Depuis Koufra, Ghadamès et Cherbourg<br>Pour eux Paris fut l’entrée glorieuse<br>Mais ils voulaient la Lorraine et Strasbourg.<br>Et tout là-haut dans le beau ciel d’Alsace<br>Faire flotter notre drapeau vainqueur<br>C’est le serment magnifique et tenace<br>Qu’ils avaient fait dans les heures de douleur.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Au coin du feu dans la paix radieuse<br>Très fièrement auprès de leurs enfants,<br>Ils conteront l’histoire merveilleuse<br>Des bataillons de notre régiment :<br>Gars de Leclerc sera le mot de passe,<br>Qui groupera la poignée des français<br>Disant «malgré» quand la défaite passe<br>«Restant debout ne se rendant jamais».</div></div></section>","173":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les oies sauvages</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Les oies sauvages vers le Nord,<br>Leur cri dans la nuit monte,<br>Gare au voyage, car la mort<br>Nous guette par le monde. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>En avant, vole grise armée<br>Et cingle aux mers lointaines.<br>Tu reviendras, mais nous qui sait,<br>Où le destin nous mène. (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Au bout de la nuit qui descend,<br>Voyage grise escadre.<br>L’orage gronde et l’on entend<br>La rumeur des batailles. (bis)</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Comme toi, toujours nous allons,<br>Grise armée dans la guerre.<br>Murmure-nous si nous tombons (bis)<br>La dernière prière.</div></section>","174":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La petite piste</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Combien de fois l’a-t-on parcourue<br>Cette petite piste ?<br>En traversant la lande herbue<br>Lorsque le jour se lève,<br>En écoutant le rythme<br>De la chanson intime :<br>O porteur et ascari aïdo aïdo aïe safari<br>O porteur et ascari aïdo aïdo aïe safari</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Et quand un jour nous partirons<br>Pour le dernier voyage<br>Chantez nous cette chanson<br>Comme un dernier hommage.<br>Et s’il ne pleure personne<br>Que Dieu nous le pardonne !<br>O porteur et ascari aïdo aïdo aïe safari<br>O porteur et ascari aïdo aïdo aïe safari</div></section>","175":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Eugénie</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Eugénie, les larmes aux yeux,<br>Nous venons te dire adieu ;<br>Nous partons de bon matin,<br>Par un ciel des plus sereins.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Nous partons pour le Mexique,<br>Nous partons, la voile au vent ;<br>Adieu donc, belle Eugénie,<br>Nous reviendrons dans un an.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Ce n’est pas commode du tout,<br>Que de penser à l’amour,<br>Surtout quand il fait grand vent,<br>Par-dessus l’gaillard d’avant.</div></section>","176":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La Cavalerie d'Afrique</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Toujours prêts à servir,<br>A vaincre ou à mourir,<br>Nos cœurs se sont unis<br>Pour la Patrie !</div><div class=\"verse\"><span class=\"verse-number\">1.</span>C’est nous les descendants des régiments d’Afrique<br>Les chasseurs, les spahis, les goumiers<br>Gardiens et défenseurs d’Empires magnifiques<br>Sous l’ardent soleil, chevauchant sans répit leurs fiers coursiers.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Trompettes au garde à vous, sonnez, sonnez à l’étendard<br>Et que fièrement, dans le ciel, montent nos trois couleurs<br>Le souffle de la France anime la fanfare<br>Et met à chacun un peu d’air du pays au fond du cœur.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>La piste est difficile et toujours nous appelle<br>Par les monts pelés de Taza, de Ksar’s souh, de Midelt.<br>L’élan de Bournazel vers le Tafilalet<br>Sur les Ksours ralliés, plantera fièrement nos trois couleurs.</div></section>","177":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Chant du 1er RHP</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Pour libérer le pays qu’on enchaîne,<br>Briser ses liens et massacrer ses ennemis<br>Il faut des gars endurcis à la peine<br>Chacun pour tous et tous pour un réunis.<br>Voyez bonnes gens, largués sur vos plaines<br>Tombant du ciel et rampant seul dans la nuit<br>Ne craignant rien, ni la mort, ni la haine<br>Voyez ce sont les hussards de Bercheny !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Autour de nous attendant l’esclavage<br>Les libéraux se vautrent dans leur veulerie,<br>A eux la paix, mais à nous le courage<br>De risquer tout pour secourir la patrie.<br>O parac
