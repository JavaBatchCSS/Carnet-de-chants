<br>Feront fuir le mauvais temps. (bis)</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Nous chantons, ma foi Dieu, pour être apôtres ;<br>Etre scout, c’est penser d’abord aux autres.<br>A tous ceux dont le cœur ploie,<br>Nous voulons porter la joie. (bis)</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Déridons les pleurards et les moroses !<br>Quand on veut, les épines ont des roses<br>Nos ennuis, nous les chassons,<br>À coup d’aile de chansons (bis)</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Nous chantons, car pour nous la vie est belle,<br>Nous croyons, notre joie est immortelle !<br>Dieu nous fît pour être heureux,<br>Et nous garde encore bien mieux. (bis)</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Nous chantons ; la tristesse use et divise,<br>Nous chantons pour tenir notre devise :<br>Tout aimer, ne rien haïr,<br>Et surtout, ne pas vieillir ! (bis)</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Lorsqu’inquiets devant notre allure étrange<br>On nous dit : non vous n’aurez pas ma grange,<br>Nous partons si réjouis,<br>Qu’les gens croient avoir dit oui !</div><div class=\"verse\"><span class=\"verse-number\">9.</span>Lorsqu’un jour, notre tâche bien finie,<br>L’appel scout viendra clore notre vie, (bis)<br>Au ciel, où Dieu nous attend,<br>Nous irons tout en chantant. (bis)</div></div></section>","67":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les excuses de l'aspirant</div><div class=\"song-actions\"></div></div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Mon cher Scoutmestre, excusez-moi<br>Je n’irai pas au camp pourquoi ?<br>Il faut bien que je vous le dise :<br>Je suis couché tout simplement,<br>Je vais vous raconter comment<br>Cela m’arrive.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>J’étais dans la rue, une auto<br>Filait tout droit sur un marmot.<br>L’accident allait être atroce :<br>Alors, mon sang n’a fait qu’un tour,<br>Et je me suis élancé pour<br>Sauver ce gosse.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Il était temps, mais après ça,<br>Je ne sais ce qui se passa,<br>Car l’auto m’a jeté par terre<br>Et du trottoir de gens remplis,<br>Je me suis trouvé dans mon lit<br>Près de ma mère.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>J’ai beaucoup de mal au côté.<br>Le docteur qui m’a visité<br>Dit qu’il se peut bien que je meure.<br>Pour être prêt à tout moment<br>J’ai reçu tous les sacrements,<br>Et maman pleure.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Faut pas me traiter de martyr :<br>L’auto n’a pas pu ralentir,<br>Le chauffeur a perdu la tête.<br>Moi je cherchais l’occasion<br>De faire ma bonne action,<br>Et je l’ai faite.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Notre Seigneur un jour a dit<br>Que lorsqu’on mourrait pour autrui<br>C’la prouvait un amour énorme :<br>Eh bien, j’aurai ce grand bonheur,<br>Et je suis content pour l’honneur<br>De l’uniforme.</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Je sais que vous prendrez le deuil,<br>Surtout mettez sur le cercueil<br>Qui recouvrira ma dépouille,<br>Mon chapeau scout et mon bâton,<br>Et, s’il vous plaît, le fanion<br>De ma patrouille.</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Adieu ! je meurs, et je vous dis :<br>Rassemblement au Paradis !<br>Pleurez pas faut pas vous en faire !<br>Et je vous fais en expirant<br>Le grand salut de l’aspirant<br>Mort pour ses frères.</div></div></section>","68":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Hé ! Garçon</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Hé ! Garçon, prends la barre,<br>Vire au vent et largue les ris !<br>Le vent te raconte l’histoire<br>Des marins couverts de gloire.<br>Il t’appelle, et tu le suis. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Vers les rives lointaines,<br>Que tu rêves tant d’explorer<br>Et qui sont déjà ton domaine,<br>Va tout droit sans fuir la peine<br>Et sois fier de naviguer. (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Sur la mer et sur terre,<br>Au pays comme à l’étranger,<br>Marin, sois fidèle à tes frères ;<br>Car tu as promis naguère<br>De servir et de protéger. (bis)</div></section>","69":"<div class=\"pdfimg\" data-img=\"69\" data-alt=\"Chants marins\"></div>","70":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Hardi les gars !</div><div class=\"song-actions\"></div></div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Hardi les gars, vire au guindeau<br>Good bye, farewell, good bye, farewell !<br>Hardi les gars, adieu Bordeaux<br>Hourra, oh Mexico, oh oh oh !<br>Au Cap Horn, il ne fera pas chaud<br>Haul away, hé, oula tchalez<br>A faire la pêche aux cachalots<br>Hâle matelot, hé, ho hisse hé ho !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Plus d’un y laissera sa peau<br>Good bye, farewell, good bye, farewell !<br>Adieu misère, adieu bateau<br>Hourra, oh Mexico, oh oh oh !<br>Et nous irons à Valparaíso<br>Haul away, hé, oula tchalez<br>Où d’autres laisseront leurs os<br>Hâle matelot, hé, ho hisse hé ho !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Ceux qui reviendront pavillon haut<br>Good bye, farewell, good bye, farewell !<br>C’est premier brin de matelot<br>Hourra, oh Mexico, oh oh oh !<br>Pour la bordée ils seront à flot<br>Haul away, hé, oula tchalez<br>Bon pour le rack, l’rhum, le couteau<br>Hâle matelot, hé, ho hisse hé ho !</div></div></section>","71":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Et le premier c'est un marin</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Et le premier c’est un marin !<br>Et le premier c’est un marin ! (bis)<br>Toujours le verre à la main,<br>La bouteille sur la table.<br>Jamais il n’aura ma main<br>Cet homme est misérable !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Et le deuxième c’est un barbu !<br>Et le deuxième c’est un barbu ! (bis)<br>Il est barbu par devant<br>Et barbu par derrière.<br>Jamais il n’aura ma main<br>Barbu de cette manière !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Et le troisième c’est un bossu !<br>Et le troisième c’est un bossu ! (bis)<br>Il est bossu par devant<br>Et bossu par derrière.<br>Jamais il n’aura ma main<br>Bossu de cette manière !</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Le quatrième c’est un boiteux !<br>Le quatrième c’est un boiteux ! (bis)<br>Quand j’ le vois venir de loin<br>Avec sa p’tite jambe courte !<br>Jamais il n’aura ma main<br>Sa démarche me dégoutte !</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Et le cinquième c’est un sonneur !<br>Et le cinquième c’est un sonneur ! (bis)<br>Je lui donnerai ma main<br>Mon cœur et ma boutique,<br>Nous irons par les chemins<br>En jouant d’ la musique !</div></div></section>","72":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le Capitaine de Saint-Malo</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Le Capitaine de Saint Malo ali, alo !<br>Qui fait la pêche aux cachalots<br>ali, ali, ali, alo, ali alo !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Il a trois filles qui font la peau...<br>La première à San Francisco...</div><div class=\"verse\"><span class=\"verse-number\">3.</span>La deuxième à Rio Janeiro,...<br>La troisième à Valparaíso...</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Il donne la goutte à ses matelots...<br>A grands coups de barre de guindeau !</div><div class=\"verse\"><span class=\"verse-number\">5.</span>A la manœuvre le Bosco, ali, alo !<br>Te dresse à coup de cabillauds.<br>ali, ali, ali, alo, ali alo !</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Il mange la viande, nous laisse les os,<br>Il boit du vin, on boit de l’eau...</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Le Lieutenant t’envoie là-haut...<br>A coups de bottes dedans le dos!</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Et le Second, qui est le plus beau,<br>Si tu groum’ il te fout à l’eau...</div></div></section>","73":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La Danaé</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>L’était une frégate lonla l’était une frégate :<br>C’était la Danaë<br>Larguez les ris dans les basses voiles !<br>C’était la Danaë<br>Larguez les ris dans les huniers !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>A sa première croisière...<br>La frégate a sombré...</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Sur cent quatre-vingts hommes...<br>Y en a eu qu’un de sauvé...</div><div class=\"verse\"><span class=\"verse-number\">4.</span>C’était un quartier-maître...<br>Qui savait bien nager...</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Il nage de roche en roche...<br>De rocher en rocher...</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Et derrière une roche...<br>Trouve une fille à pleurer...</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Qu’avez-vous donc la belle...<br>Qu’avez-vous à pleurer...</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Je pleure mon anneau d’or...<br>Dans la mer qu’est tombé...</div><div class=\"verse\"><span class=\"verse-number\">9.</span>Que donneriez-vous la belle...<br>A qui vous le rendrait...</div><div class=\"verse\"><span class=\"verse-number\">10.</span>Je lui en ferais offrande...<br>Avec mon amitié...</div><div class=\"verse\"><span class=\"verse-number\">11.</span>A la première plonge...<br>L’marin n’a rien trouvé...</div><div class=\"verse\"><span class=\"verse-number\">12.</span>A la dixième plonge...<br>Le pauvre s’a noyé...</div></div></section>","74":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le Corsaire le grand coureur</div><div class=\"song-actions\"></div></div><div class=\"cols c4\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Le corsaire le Grand Coureur<br>Est un navire de malheur :<br>Quand il se met en croisière<br>Pour aller chasser l’Anglais ,<br>Le vent, la mer et la guerre<br>Tournent contre le Français.<br>Allons les gars gai, gai<br>Allons les gars gaiement !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Il est parti de Lorient<br>Avec belle mer et bon vent,<br>Il cinglait bâbord amure<br>Naviguait comme un poisson,<br>Un grain tombe sur la mature<br>Et v’la le corsaire en ponton.<br>Allons les gars gai, gai<br>Allons les gars gaiement !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Il nous fallut remâter<br>Et diablement bourlinguer,<br>Tandis que l’ouvrage avance<br>On aperçoit par tribord<br>Un navire d’apparence<br>A mantelets de sabords.<br>Allons les gars gai, gai<br>Allons les gars gaiement !</div><div class=\"verse\"><span class=\"verse-number\">4.</span>C’était un Anglais vraiment<br>A double rangée de dents<br>Un marchand de mort subite,<br>Mais le Français n’a pas peur :<br>Au lieu de brasser en fuite<br>Nous le rangeons à l’honneur.<br>Allons les gars gai, gai<br>Allons les gars gaiement !</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Ses boulets pleuvent sur nous<br>Nous lui rendons coups pour coups<br>Pendant que la barbe en fume<br>A nos braves matelots ,<br>Dans un gros bouchon de brume<br>Il nous échappe aussitôt.<br>Allons les gars gai, gai<br>Allons les gars gaiement !</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Nos prises au bout de six mois<br>Ont pu se compter à trois :<br>Un navir’ plein de patates<br>Plus qu’à moitié chaviré ,<br>Un deuxième de savates<br>Un troisième de fumier.<br>Allons les gars gai, gai<br>Allons les gars gaiement !</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Pour nous refaire des combats<br>Nous avions à nos repas<br>Des gourganes et du lard rance<br>Du vinaigre au lieu du vin,<br>Du biscuit pourri d’avance<br>Et du camphre le matin.<br>Allons les gars gai, gai<br>Allons les gars gaiement !</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Pour finir ce triste sort,<br>Nous venons périr au port<br>Dans cette affreuse misère.<br>Quand chacun s’est vu perdu<br>Chacun selon sa manière<br>S’est sauvé comme il a pu.<br>Allons les gars gai, gai<br>Allons les gars gaiement !</div><div class=\"verse\"><span class=\"verse-number\">9.</span>Le cap’taine et son second<br>S’ont sauvés sur un canon ;<br>Le maître sur la grande ancre,<br>Le commis dans son bidon<br>Ah le triste et vilain cancre<br>Le voleur de rations.<br>Allons les gars gai, gai<br>Allons les gars gaiement !</div><div class=\"verse\"><span class=\"verse-number\">10.</span>Il eut fallut voir le coq<br>Vec sa cuillère et son croc :<br>Il s’est mis dans sa chaudière<br>Comme un vilain pot au feu<br>Il est parti vent arrière<br>Atterrit au feu de Dieu.<br>Allons les gars gai, gai<br>Allons les gars gaiement !</div><div class=\"verse\"><span class=\"verse-number\">11.</span>De notre horrible malheur<br>Le calfat seul est l’auteur<br>En tombant de la grand’hune<br>Dessus le gaillard d’avant,<br>A rebondi dans la cambuse<br>A crevé le bâtiment.<br>Allons les gars gai, gai<br>Allons les gars gaiement !</div><div class=\"verse\"><span class=\"verse-number\">12.</span>Si l’histoire du Grand Coureur<br>A pu vous toucher le coeur<br>Ayez donc belles manières<br>Et payez-nous largement :<br>Du vin, du rack, de la bière<br>Et nous serons tous contents.<br>Allons les gars gai, gai<br>Allons les gars gaiement !</div></div></section>","75":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Au trente et un du mois d’août</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Au 31 du mois d’août (bis)<br>Nous vîmes venir sous l’vent à nous (bis)<br>Une frégate d’Angleterre<br>Qui fendait la mer et les flots<br>C’était pour aller à Bordeaux !</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Buvons un coup, buvons en deux<br>A la santé des amoureux,<br>A la santé du roi de France !<br>Et merde ! pour le roi d’Angleterre<br>Qui nous a déclaré la guerre.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Le capitaine au même instant (bis)<br>Fit appeler son lieutenant : (bis)<br>Lieutenant te sens-tu capable<br>D’aller attaquer à son bord<br>Pour voir qui sera le plus fort.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Le lieutenant fier-z’ et hardi (bis)<br>Lui répondit capitaine oui (bis)<br>Faites monter tout l’équipage ;<br>Hardis gabiers, fiers matelots<br>Faites monter tout l’monde en haut.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Vire lof pour lof en arrivant (bis)<br>Nous l’abordâmes par son avant (bis)<br>A coups de haches d’abordage<br>De piques, de sabres, de mousquetons<br>Nous l’avons mis à la raison.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Que dira-t-on de lui tantôt (bis)<br>En Angleterre et à Bordeaux (bis)<br>Pour s’être ainsi laisser surprendre<br>Par un corsaire de dix canons,<br>Lui qui en avait trente et si bons.</div></div></section>","76":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les trois marins de Groix</div><div class=\"song-actions\"></div></div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Nous étions deux, nous étions trois<br>Nous étions deux, nous étions trois<br>Nous étions trois marins de Groix<br>Mon tra déritra la la la<br>Mon tra déritra la lère.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Mon matelot, le mousse et moi<br>Mon matelot, le mousse et moi<br>Embarqués sur le Saint François.<br>Mon tra déritra la la la<br>Mon tra déritra la lère.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Vint à venter grains de noroît<br>Vint à venter grains de noroît<br>A faire céder notre mât !<br>Mon tra déritra la la la<br>Mon tra déritra la lère.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Jean-Pierre, dis-je, matelot !<br>Jean-Pierre, dis-je, matelot !<br>Serrer de la toile qu’il nous faut.<br>Mon tra déritra la la la<br>Mon tra déritra la lère.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Ce failli temps n’mollira pas<br>Ce failli temps n’mollira pas<br>Je prends la barre vas-y mon gars !<br>Mon tra déritra la la la<br>Mon tra déritra la lère.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Il est allé pour prendre un ris<br>Il est allé pour prendre un ris<br>Un coup de mer l’aura surpris.<br>Mon tra déritra la la la<br>Mon tra déritra la lère.</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Au jour j’ai revu son sabot<br>Au jour j’ai revu son sabot<br>Il flottait seul là-bas sur l’eau.<br>Mon tra déritra la la la<br>Mon tra déritra la lère.</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Il n’a laissé sur not’ bateau<br>Il n’a laissé sur not’ bateau<br>Que son garde-pipe et son couteau<br>Mon tra déritra la la la<br>Mon tra déritra la lère.</div><div class=\"verse\"><span class=\"verse-number\">9.</span>Plaignez mon pauvre matelot<br>Plaignez mon pauvre matelot<br>Sa femme avec ses trois petiots.<br>Mon tra déritra la la la<br>Mon tra déritra la lère.</div></div></section>","77":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les marins de Groix</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Nous étions trois marins de Groix, Ah<br>Embarqués sur le Saint François. Ah</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Il vente, il vente,<br>C’est le vent de la mer<br>Qui nous tourmente.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Le mousse est allé prendre un ris, Ah<br>Un paquet de mer l’aura pris. Ah</div><div class=\"verse\"><span class=\"verse-number\">3.</span>On n’a retrouvé que son chapeau, Ah<br>Son garde-pipe et son couteau. Ah</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Sa pauvre mère s’en est allée Ah<br>Prier à Sainte-Anne d’Auray. Ah</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Sainte Anne, rendez-moi mon garçon Ah<br>Il était jeune, il était blond. Ah</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Et sainte Anne lui répondit : Ah<br>Tu le verras en Paradis ! Ah</div></section>","78":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Satanicles</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Matelot le vent est bon !<br>La cambuse pleine de jambon !<br>Avons été si longtemps<br>A sec de toile dans le gros temps.</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>D’où viens-tu oiseau de mer ?<br>J’arrive d’une grande île,<br>Vous annoncer que la terre<br>Est proche de quelques miles.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Est-ce vous Capitaine Troude<br>Qui vous posez sur le pont<br>Lorsque s’écorchent nos coudes<br>Au bois du mât d’artimon ?</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Et me reconnaissez-vous<br>Cap’tain’ Troude moi qui de vous<br>Ai pris cent coups de bâton<br>A charge de punition ?</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Dites-nous que terre est proche<br>Et que les vents sont portants,<br>Sonne l’heure de la bamboche<br>Attendue de si longtemps !</div></div></section>","79":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Loguivy de la mer</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Ils reviennent encore à l’heure des marées<br>S’asseoir sur le muret le long de la jetée.<br>Ils regardent encore au delà de Bréhat<br>Respirant le parfum du vent qui les appelle,<br>Mais s’il est révolu le temps des terre-neuvas<br>La race des marins chez nous ne s’en va pas.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Loguivy de la mer, Loguivy de la mer,<br>Tu regardes mourir tes derniers vrais marins.<br>Loguivy de la mer, au fond de ton vieux port<br>S’entassent les carcasses des bateaux déjà morts.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Ils ont connu le temps où la voile était reine ;<br>Ils parlent des haubans, des focs et des misaines,<br>De tout ce qui a fait le charme de leur vie<br>Et qu’ils emporteront avec eux dans l’oubli,<br>Mais s’il est révolu le temps des cap-horniers<br>Il reste encore chez nous d’la graine d’aventurier.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Je n’ai jamais su dire ce que disent leurs yeux,<br>Perdus dans ses visages burinés par le vent,<br>Ces beaux visages d’hommes ces visages de vieux<br>Qui savent encore sourire et dire à nos vingt ans :<br>Remettez vos cabans et rompez les amarres<br>Allez y de l’avant et tenez bon la barre !</div></div></section>","80":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Quinze marins</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Long John Silver a pris le commandement<br>Des marins, et vogue la galère<br>Il tient ses hommes comme il tient le vent<br>Tout l’monde a peur de Long John Silver.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Quinze marins sur le bahut du bord<br>Ya boum là ho ! une bouteille de rhum<br>A boire, et l’diable avait réglé leur sort<br>Ya boum là ho ! une bouteille de rhum !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>C’est Bill, le second du corsaire,<br>Le capitaine Flint en colère<br>Qu’est revenu du royaume des morts<br>Pour hanter la cache au trésor.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>“Essaye un peu de le contrecarrer<br>Et tu iras où tant d’autres sont allés<br>Quequ’s uns aux vergu’ et quequ’s uns par d’sus bord<br>Tout l’monde pour nourrir les poissons d’abord”.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Tous nous finirons par danser la gigue<br>La corde au cou, au quai des pendus<br>Toi, John Forest, et toi, John Merwig<br>Si près du gibet qu’j’en ai l’cou tordu.</div></div></section>","81":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Matelots, puisqu’il fait bon vent</div><div class=\"song-actions\"></div></div><div class=\"verse nonum\">Matelots, puisqu’il fait bon vent,<br>Poussons ce soir la chansonnette<br>Matelots, puisqu’il fait bon vent,<br>Montons tous chanter sur l’avant.</div><div class=\"verse nonum\">Et le chant du gaillard d’avant,<br>Montera jusqu’à la dunette<br>Et le chant du gaillard d’avant,<br>Égaiera tout le bâtiment.</div></section>","82":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Santiano</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>C’est un fameux trois mâts fin comme un oiseau.<br>Hisse et ho, Santiano !<br>Dix huit nœuds, quatre cent tonneaux :<br>Je suis fier d’y être matelot.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Tiens bon la vague et tiens bon le vent.<br>Hisse et ho, Santiano !<br>Si Dieu veut toujours droit devant,<br>Nous irons jusqu’à San Francisco.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Je pars pour de longs mois en laissant Margot.<br>Hisse et ho, Santiano !<br>D’y penser j’en ai le cœur gros<br>En doublant les feux de Saint-Malo.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Il paraît que là-bas l’argent coule à flots.<br>Hisse et ho, Santiano !<br>On trouve l’or au fond des ruisseaux.<br>J’en ramènerai plusieurs lingots.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Un jour, je reviendrai chargé de cadeaux.<br>Hisse et ho, Santiano !<br>Au pays, j’irai voir Margot.<br>A son doigt, je passerai l’anneau.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain final :</div>Tiens bon le cap et tiens bon le flot.<br>Hisse et ho, Santiano !<br>Sur la mer qui fait le gros dos,<br>Nous irons jusqu’à San Francisco.</div></div></section>","83":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Ceux qu’ont nommé les bancs</div><div class=\"song-actions\"></div></div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Ceux qu’ont nommé les bancs<br>Les ont bien mal nommés ;<br>Ils en font des louanges,<br>N’y ont jamais été.<br>S’ils faisaient une campagne<br>Comme nous venons de faire<br>Ils diraient que Saint-Pierre<br>C’est un pays d’enfer !<br>C’est un pays d’enfer !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Quand on est en pleine mer,<br>Pendant la traversée,<br>On tisse des haussières<br>Chacun à son métier :<br>Le décolleur débourre<br>Et le trancheur dégage,<br>Le saleur écarnache.<br>Le voilà justement !<br>Le voilà justement !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>La traversée finie,<br>Sur le banc faut mouiller.<br>Deux hommes dans chaque doris,<br>La morue faut pêcher.<br>Si l’on revient à bord,<br>Et qu’on n’est pas chargé,<br>On nous envoie au diable<br>Doris et dorissiers !<br>Doris et dorissiers !</div><div class=\"verse\"><span class=\"verse-number\">4.</span>La première pêche finie,<br>A Saint-Pierre faut aller<br>Débarquer la morue<br>Que nous avons péchée.<br>Les officiers nous disent :<br>« Allons dépêchez-vous ! »<br>Ceux qui sont aux galères<br>Sont plus heureux que nous !<br>Sont plus heureux que nous !</div><div class=\"verse\"><span class=\"verse-number\">5.</span>La campagne terminée,<br>En France il faut rentrer<br>Revoir les jolies filles<br>Que nous avons laissées.<br>Leur raconter nos peines<br>Tout c’que nous avons souffert<br>Et leur dire que Saint-Pierre<br>C’est un pays d’enfer !<br>C’est un pays d’enfer !</div></div></section>","84":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le Galérien</div><div class=\"song-actions\"></div></div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Je m’souviens, ma mèr’ m’aimait<br>Et je suis aux galères,<br>Je m’souviens ma mèr’ disait<br>Mais je n’ai pas cru ma mère ;<br>Ne traîn’ pas dans les ruisseaux<br>T’bats pas comme un sauvage<br>T’amuses pas comm’ les oiseaux !<br>Ell’ me disait d’être sage.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>J’ai pas tué, j’ai pas volé,<br>J’voulais courir la chance.<br>J’ai pas tué, j’ai pas volé,<br>J’voulais qu’chaqu’ jour soit dimanche<br>Je m’souviens ma mèr’ pleurait<br>Dès qu’je passais la porte.<br>Je m’souviens comme ell’pleurait :<br>Ell’ voulait pas que je sorte.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Toujours, toujours ell’ disait :<br>T’en vas pas chez les filles,<br>Fais donc pas toujours c’qui t’plait<br>Dans les prisons y a des grilles.<br>J’ai pas tué, j’ai pas volé,<br>Mais j’ai cru Madeleine.<br>J’ai pas tué, j’ai pas volé<br>J’voulais pas lui fair’de peine.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Je m’souviens ma mèr’ disait :<br>Suis pas les bohémiennes !<br>Je m’souviens comme ell’ disait :<br>On ramass’ les gens qui traînent.<br>Un jour les soldats du roi<br>T’emmen’ront aux galères,<br>Tu t’en iras trois par trois<br>Comme ils ont emmenés ton père.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Tu auras la têt’ rasée,<br>On te mettra des chaînes,<br>T’en auras les reins brisés<br>Et moi j’en mourrai de peine !<br>Toujours, toujours tu ram’ras<br>Quand tu s’ras aux galères.<br>Toujours toujours tu ram’ras<br>Tu pens’ras p’t’être à ta mère !</div><div class=\"verse nonum\">J’ai pas tué, j’ai pas volé,<br>Mais j’ai pas cru ma mère !<br>Et je m’souviens qu’ell’m’aimait<br>Pendant qu’je rame aux galères...</div></div></section>","85":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Quand je suis parti de La Rochelle</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Quand je suis parti de La Rochelle,<br>Je suis parti tout en pleurant<br>En naviguant, ma brunette<br>Je suis parti tout en pleurant en naviguant.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Mais qu’avez-vous donc beau camarade<br>Qu’avez-vous donc à pleurer tant ?...</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Regrettes-tu ton père ou ta mère<br>Ou bien quelqu’un de tes parents ?...</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Je ne regrette qu’une jeune fille<br>Agée de quinze à dix-huit ans...</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Si jamais je reviens en France<br>Je l’aimerai tout en passant...</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Je lui donnerai du vin à boire<br>Dans un beau verre de cristal blanc...</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Je lui dirai : buvez donc la belle<br>A la santé de votre amant...</div></section>","86":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Belle Virginie</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Belle Virginie les larmes aux yeux<br>Je viens t’y faire mes adieux,<br>Nous partons pour le Mexique.<br>Nous allons droit au couchant<br>Adieu donc belle Virginie,<br>Les voiles sont déja au vent.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Les voiles au vent mon cher amant !<br>Cela m’y caus’ du tourment :<br>Il surviendra une tempête<br>De l’orage aussi du vent<br>Qui détruira ton équipage<br>Et je serai sans amant.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Chère Virginie, ne crains donc rien<br>Je suis un premier marin<br>Je connais le pilotage<br>Je suis fier sur mon vaisseau,<br>Il m’arrivera aucun naufrage<br>Tant que je s’rai sur les flots.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Belle Virginie à mon retour<br>Sois fidèle à nos amours.<br>Je te promets ô ma mignonne<br>De revenir au pays<br>Nous nous marierons ensemble<br>Et adieu belle Virginie.</div></div></section>","87":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Il était un petit navire</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Il était un petit navire (bis)<br>Qui n’avait ja, ja, jamais navigué (bis)<br>Ohé ! Ohé Matelot, matelot navigue sur les flots (bis)</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Les matelots (bis)<br>De la belle Eugénie (bis)<br>Ont pavoisé (bis)<br>Aux brillantes couleurs (bis)<br>Et leur vaisseau (bis)<br>Revenant d’Italie (bis)<br>Etait chargé d’macaronis, d’macaronis<br>Si la piquette est bonne, amis, buvons un coup !<br>Car le jus de la treille égaille nos amours ! (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Au bout de cinq à six semaines (bis)<br>Les vivres vin, vin, vinrent à manquer (bis) ...</div><div class=\"verse\"><span class=\"verse-number\">3.</span>On tira à la courte paille (bis)<br>Pour savoir qui, qui, qui serait mangé (bis) ...</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Le sort tomba sur le plus jeune (bis)<br>Le mousse qui, qui, se mit à pleurer (bis) ...</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Ô sainte Vierge, ô ma patronne, (bis)<br>Je vous en prie, de moi ayez pitié (bis) ...</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Sur le pont du petit navire (bis)<br>Des poissons pleu, pleu, pleuvent par milliers (bis)...</div><div class=\"verse\"><span class=\"verse-number\">7.</span>C’est ainsi que le petit mousse (bis)<br>Par un grand mi, miracle fut sauvé (bis) ...</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Si vous aimez bien cette histoire (bis)<br>Nous allons la, la, la recommencer (bis)</div></div></section>","88":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Allez les marins</div><div class=\"song-actions\"></div></div><div class=\"verse nonum\">Allez les marins, encor’ un p’tit verre<br>Un’ dernièr’ liqueur<br>Avant le départ !<br>Allez les marins, encor’ un p’tit air<br>Un’ dernièr’ chanson<br>Pour chasser l’cafard !</div><div class=\"verse\"><span class=\"verse-number\">1.</span>Laissons les copains, il nous faut partir<br>Une fois encor’ larguer les haussières<br>Pour l’irrésistible appel de la mer !<br>On ne voit mêm’ pas ses enfants grandir<br>Et si nous pensons à eux tous les jours<br>L’amour que l’on a pour la grande bleue<br>Commence à nous jouer de bien vilains tours<br>Et nos cœurs sont las de tous ces adieux.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Toutes voil’s dehors navigue ô barreur !<br>Les amures tendues sous les vents du Nord.<br>Monter la coupée, c’est un dur labeur<br>Lorsque sont éteints tous les feux du bord<br>Ils ne savent pas que nos cœurs sont lourds<br>D’avoir trop vécu hors de leur pays<br>Souffrez, dieux des mers et doux alcyons<br>Que tous nos regrets se noient dans l’oubli.</div></section>","89":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Qui peut faire de la voile sans vent</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Qui peut faire de la voile sans vent,<br>Qui peut ramer sans rames<br>Et qui peut quitter son ami<br>Sans verser une larme ?</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Je peux faire de la voile sans vent<br>Je peux ramer sans rames<br>Mais ne peux quitter mon ami<br>Sans verser une larme.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Qui peut faire du pain sans levain<br>Qui peut faire du vin sans raisin<br>Et qui peut quitter son ami<br>Sans verser une larme ?</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Je peux faire du pain sans levain<br>Je peux faire du vin sans raisin<br>Mais ne peux quitter mon ami,<br>Sans verser une larme.</div></section>","90":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Cruelle berceuse</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>La pauvre veuve en sa chaumière<br>À son petit disait tout bas :<br>« Le flot déjà m’a pris ton frère,<br>Il l’aimait trop, ne l’aime pas ».<br>Berce, disait la mer mauvaise,<br>Berce ton gâs dans tes deux bras<br>Berce, berce, berce ton gâs ! (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Lorsque la mer était mauvaise,<br>Le petit gâs lui murmurait :<br>« Espère un peu je serai mousse,<br>Dès mes douze ans je partirai ».<br>Rêve, disait le vent de grève,<br>Rêve aux beaux jours où tu fuiras,<br>Rêve, rêve, rêve mon gâs ! (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Lorsque la mer était méchante,<br>Le petit gâs à demi nu<br>Chantait sur la falaise,<br>Le front tourné vers l’inconnu.<br>Chante, disait la mer méchante,<br>Chante aussi fort que tu pourras,<br>Chante, chante, chante mon gâs ! (bis)</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Un jour enfin la pauvre veuve<br>A vu partir son dernier-né,<br>S’en est allé vers Terre-Neuve,<br>Comme jadis son frère aîné.<br>Danse le flot, roule la cadence,<br>Jusqu’à la mort tu danseras,<br>Danse, danse, danse mon gâs ! (bis)</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Son gâs parti, la pauvre femme<br>L’attend en vain depuis un an<br>En maudissant la mer infâme,<br>Qui lui répond en ricanant :<br>Pleure, gémis, hurle à cette heure,<br>J’ai mieux que toi serré mes bras:<br>Pleure, pleure, pleure tes gâs ! (bis)</div></div></section>","91":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les cannibales</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Il était un petit navire<br>Qui fit naufrage au Gabon<br>Là-bas sur des terres lointaines,<br>Avec dix matelots bretons.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Ah ! Qu’ c’est triste, c’est bien malheureux !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Sur un îlot de cannibales<br>Nous avons dû nous réfugier.<br>Pour voir si nous étions mangeables,<br>Ils commencèrent à nous palper.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>La reine de ce peuple sauvage<br>Vêtue d’une feuille de palmier<br>Ordonna à son entourage<br>D’nous dévêtir pour nous baigner.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Nous comprenions d’après ses gestes<br>Qu’ ça coûterait cher de nous engraisser<br>Que nous étions bien indigestes<br>Qu’il valait mieux y renoncer.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Encore si vous étiez beaux gars,<br>Vous remplaceriez mon époux<br>Que j’ai mangé aux épinards<br>Mais il n’y a rien à tirer de vous.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>-Revenez quand vous s’rez plus gras,<br>Car vous avez l’air de mendiants<br>Je vais quand même garder vos bras,<br>Voilà c’est tout foutez-moi le camp !</div></div></section>","92":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Brave marin</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Brave marin revient de guerre, tout doux, (bis)<br>Tout mal chaussé, tout mal vêtu,<br>Pauvre marin d’où reviens-tu ? tout doux !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Madame je reviens de guerre, tout doux,<br>Qu’on apporte ici du vin blanc<br>Que le marin boive en passant, tout doux !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Pauvre marin se met à boire, tout doux,<br>Se met à boire et à chanter<br>La belle hôtesse à soupirer, tout doux !</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Qu’avez-vous donc, la belle hôtesse ? tout doux,<br>Regrettez-vous votre vin blanc<br>Que le marin boit en passant ? tout doux !</div><div class=\"verse\"><span class=\"verse-number\">5.</span>C’est pas mon vin que je regrette, tout doux, (bis)<br>Mais c’est la mort de mon mari<br>Monsieur, vous ressemblez à lui, tout doux !</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Ah ! dites-moi, la belle hôtesse, tout doux,<br>Vous aviez de lui trois enfants<br>Et j’en vois quatre maintenant, tout doux !</div><div class=\"verse\"><span class=\"verse-number\">7.</span>J’ai tant reçu de tristes lettres, tout doux,<br>Qu’il était mort et enterré<br>Que je me suis remariée, tout doux !</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Pauvre marin vide son verre, tout doux,<br>Sans remercier, tout en pleurant<br>S’en retourne à son bâtiment, tout doux !</div></div></section>","93":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Chantons pour passer le temps</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Chantons pour passer le temps<br>Les amours jolies d’une jeune fille,<br>Chantons pour passer le temps<br>Les amours jolies d’une fille de quinze ans.<br>Aussitôt qu’elle fut promise,<br>Aussitôt elle changea de mise :<br>Elle prit l’habit de matelot<br>Et vint s’embarquer à bord du navire ;<br>Elle prit l’habit de matelot<br>Et vint s’embarquer à bord du bateau.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Le capitaine, enchanté<br>D’avoir à son bord un si beau jeune homme<br>Le capitaine enchanté,<br>La fit appeler sur l’ gaillard d’avant.<br>« Tes yeux doux ton joli visage<br>Ta tournure et ton joli corsage<br>Me font toujours me rappeler<br>Une jeune beauté que j’ai tant aimée<br>Me font toujours me rappeler<br>Une jeune beauté du port de Calais.»</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Monsieur vous vous moquez de moi,<br>Vous me badinez, vous me faites rire !<br>Monsieur vous vous moquez de moi<br>Je n’ai jamais été au port de Calais.<br>Je suis née à la Martinique<br>Et même que je suis enfant unique<br>Et c’est un navire hollandais<br>Qui m’a débarquée au port de Boulogne<br>Et c’est un navire hollandais<br>Qui m’a débarqué au port de Calais.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Ayant ainsi vécu sept ans<br>Sur le bâtiment sans se reconnaître<br>Ayant ainsi vécu sept ans<br>Se sont reconnus au débarquement.<br>« Puisqu’enfin l’amour nous rassemble<br>Nous allons nous marier ensemble ;<br>L’argent que nous avons gagné ,<br>Il nous servira à notre ménage<br>L’argent que nous avons gagné<br>Il nous servira à nous marier.»</div><div class=\"verse\"><span class=\"verse-number\">5.</span>C’ui-là qu’ a fait cette chanson :<br>C’est le gars Camus gabier de misaine<br>C’ui-là qu a fait cette chanson :<br>C’est le gars Camus gabier d’artimon !<br>Matelot ! faut hisser de la voile<br>Au cab’stan il faut qu’tout l’monde y soit<br>Et vire et vire vire donc !<br>Sans ça t’auras rien dedans ta gamelle<br>Et vire et vire vire donc !<br>Sans ça t’auras rien dedans ton bidon.</div></div></section>","94":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Guerre guerre, vente vent !</div><div class=\"song-actions\"></div></div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Après sept années de guerre,<br>Sept années de bâtiment, (bis)<br>Je reviens de Grande-Terre,<br>Je reviens à Lorient.<br>Je reviens de Grande-Terre,<br>Guerre guerre, vente vent.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>J’ai passé des nuits entières, (bis)<br>Debout, au gaillard d’avant.<br>Sous bons vents, sous vents contraires,<br>Sous la brise et les brisants.<br>Sous bons vents, sous vents contraires<br>Guerre guerre, vente vent.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Voyez mon sac de misère,<br>Lourd de poux, vide d’argent. (bis)<br>Allez dire au Capitaine :<br>J’ai obéi trop souvent !<br>Allez dire au Capitaine,<br>Guerre guerre, vente vent.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Bonjour ma mie qui m’est chère,<br>Revoilà ton cher amant.<br>Je suis las de trop de guerres (bis)<br>Sans voir grandir mes enfants.<br>Je suis las de trop de guerres.<br>Guerre guerre, vente vent</div><div class=\"verse\"><span class=\"verse-number\">5.</span>J’ai reçu tes mille lettres, (bis)<br>Par le rossignol chantant<br>Je t’écrivais moins peut être,<br>Je t’envoyais des rubans.<br>Je t’écrivais moins peut être,<br>Guerre guerre, vente vent.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Mes amis plus que naguère,<br>Vous me verrez bien souvent. (bis)<br>Après tant d’années de guerre<br>J’aurai tant et tant de temps.<br>Après tant d’années de guerre<br>Guerre guerre, vente vent .</div><div class=\"verse\"><span class=\"verse-number\">7.</span>De Lorient à Grande-Terre, (bis)<br>Vent arrière, vent avant,<br>Les fleurs d’hiver étaient belles,<br>Elles annonçaient le printemps.<br>Les fleurs d’hiver étaient belles,<br>Guerre guerre, vente vent.</div></div></section>","95":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Chant des Corsaires</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Sont des hommes de grand courage,<br>Ceux qui partiront avec nous !<br>Ils ne craindront point les coups<br>Ni les naufrages, ni l’abordage ;<br>Du péril seront jaloux<br>Tous ceux qui partiront avec nous.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Ce seront de hardis pilotes,<br>Les gars que nous embarquerons :<br>Fins gabiers et francs lurons<br>Je t’escamote toute une flotte<br>Bras solides et coup d’œil prompt,<br>Tous les gars que nous embarquerons.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Ils seront de fiers camarades,<br>Ceux qui navigueront à bord,<br>Faisant feu bâbord, tribord,<br>Dans la tornade des canonnades<br>Vainqueurs rentreront au port<br>Tous ceux qui navigueront à bord.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Et des prises de tous tonnages<br>Nous ramènerons avec nous.<br>Et la gloire et les gros sous<br>Feront voyage dans nos sillages.<br>Vent arrière ou vent debout<br>Nous les ramènerons avec nous.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Car c’est le plus vaillant corsaire<br>Qui donna l’ordre du départ.<br>Vite en mer et sans retard !<br>Faisons la guerre à l’Angleterre !<br>Car c’est le fameux Jean Bart<br>Qui nous commandera le départ.</div></div></section>","96":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La triste vie du matelot</div><div class=\"song-actions\"></div></div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Mon Dieu quelle triste vie<br>Que la vie du matelot :<br>Il mange des gourganes<br>Il ne boit que de l’eau<br>Il couche sur la dure,<br>Sur un vieux lit de camp,<br>Il fait triste figure<br>Quand il n’a plus d’argent. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Adieu, cher camarade<br>Adieu, faut nous quitter,<br>Faut quitter la Bamboche<br>A bord il faut aller.<br>En arrivant à bord,<br>En montant la coupée,<br>A l’officier d’ marine<br>Faudra se présenter. (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Dimanches et jours de fête<br>On nous fait travailler<br>Comme les bêtes de somme<br>Qui sont chez nos fermiers,<br>Un jeune quartier-maître<br>Nous dit «Dépêchez-vous !»<br>Les forçats de Cayenne<br>Sont plus heureux que nous. (bis)</div><div class=\"verse\"><span class=\"verse-number\">4.</span>On se fait mettre en ligne<br>Sur le gaillard avant ;<br>Prenez du bourbillage<br>Astiquez les cabestans.<br>Un jeune quartier maître,<br>La garcette à la main<br>Aux ordres d’un second maître<br>Nous astique les reins. (bis)</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Et toi, ma pauvre mère<br>Qu’as-tu fait de ton fils ?<br>Marin, c’est la misère,<br>Marine, c’est trop souffrir<br>J’ai encore un p’tit frère<br>Qui dort dans son berceau<br>Je t’en supplie ma mère<br>N’en fais pas un matelot. (bis)</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Et vous, jeunes fillettes<br>Qui avez des amants<br>Sur ces navires de guerre<br>Ces grands bagnes flottants,<br>Ah! Restez leur fidèles<br>Gardez bien votre cœur<br>A ces marins modèles<br>Qui ont tant de malheur. (bis)</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Et si je me marie<br>Et que j’ai des enfants,<br>Je leur casserai une patte<br>Avant qu’ils ne soient grands,<br>Je ferai mon possible<br>Pour leur gagner du pain<br>Le restant de ma vie<br>Afin qu’ils n’soient pas marins. (bis)</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Et si j’ai le bonheur<br>Un jour d’être congédié,<br>Dans les journaux de France<br>Je ferai publier :<br>“Prenez bien garde mes frères<br>De vous faire embarquer<br>Sur ces navires de guerre<br>Où l’on vous fait crever. (bis)</div></div></section>","97":"<div class=\"pdfimg\" data-img=\"97\" data-alt=\"Chants de la fleur de lys\"></div>","98":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Monsieur de Charette</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Prends ton fusil, Grégoire,<br>Prends ta gourde pour boire,<br>Prends ta Vierge d’ivoire ;<br>Nos messieurs sont partis<br>Pour chasser la perdrix.</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Monsieur d’Charette a dit à ceux d’Anc’nis : (bis)<br>«Mes amis, le Roi va ramener la fleur de lys.»</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Monsieur d’Charette a dit à ceux d’Louroux : (bis)<br>«Mes bijoux, pour mieux tirer, mettez-vous à genoux.»</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Monsieur d’Charette a dit à ceux d’Montfort : (bis)<br>«Frappez fort, le drapeau blanc défend contre la mort !»</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Monsieur d’Charette a dit à ceux d’Clisson : (bis)<br>«Le canon, fait mieux danser que le son du violon !»</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Monsieur d’Charette a dit à ceux d’Conflans : (bis)<br>«Mes enfants, ralliez-vous à mon panache blanc...»</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Monsieur d’Charette a dit tout Français : (bis)<br>«Dieu promet que la France ne périra jamais !»</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Monsieur d’Charette a mis sa plume au vent : (bis)<br>«En avant !<br>On parlera longtemps des vieux Chouans !»</div></div></section>","99":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Chanson de Monsieur Henri</div><div class=\"song-actions\"></div></div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Sous l’effort de la tempête,<br>Quand tous ont courbé le front (bis)<br>Seul debout dressant la tête<br>Je vous vois, fiers compagnons.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Vendéens !<br>Marchons au feu sans effroi,<br>Mourons pour Dieu, pour le Roi,<br>Marchons au feu sans effroi vive le Roi.<br>Vive Dieu ! Vive Dieu! Vive le Roi !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>En partant pour la croisade,<br>J’avais dit, moi faible enfant (bis)<br>Je serai leur camarade...<br>Vous m’avez fait commandant !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>S’il était là mon vieux père,<br>Lui saurait vous commander, (bis)<br>Le ciel m’enverra j’espère,<br>Son ombre pour me guider.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Si je fonce à la bataille,<br>Suivez mon panache blanc. (bis)<br>Si j’ai peur de la mitraille<br>Sabrez votre chef tremblant !</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Si le plomb d’un vil rebelle,<br>Frappe un jour mon front meurtri (bis)<br>Ami, d’une main fidèle,<br>Vengez le trépas d’Henri...</div></div></section>","100":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les gars du Berry</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Sont les gars du Berry<br>Rataplan, ta plan, tire lire,<br>Sont les gars du Berry<br>Qu’ont descendus à Nantes. (ter)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>De Nantes, ils sont venus...<br>Au camp des Sorinières. (ter)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Monsieur de Charrette est venu...<br>Qu’en a ben tué dix mille. (ter)</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Et quinze cent prisonniers...<br>Avec trois cents blessés !</div></section>","101":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le petit Grégoire</div><div class=\"song-actions\"></div></div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>La maman du petit homme<br>Lui dit un matin :<br>A seize ans t’es haut tout comme<br>Notre huche à pain.<br>A la ville tu peux faire<br>Un bon apprenti,<br>Mais pour labourer la terre,<br>T’es ben trop petit, mon ami,<br>T’es ben trop petit, dame oui !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Vit un maître d’équipage<br>Qui lui rit au nez,<br>En lui disant : point n’engage<br>Les tout nouveaux-nés !<br>Tu n’as pas laide frimousse,<br>Mais t’es mal bâti :<br>Pour faire un tout petit mousse,<br>T’es ben trop petit, mon ami,<br>T’es ben trop petit, dame oui !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Dans son palais de Versailles<br>Vint trouver le roi :<br>Je suis gars de Cornouailles,<br>Sire, équipez-moi !<br>Mais le bon roi Louis XVI<br>En riant lui dit :<br>Pour être garde française,<br>T’es ben trop petit, mon ami,<br>T’es ben trop petit, dame oui !</div><div class=\"verse\"><span class=\"verse-number\">4.</span>La guerre éclate en Bretagne<br>Au printemps suivant,<br>Et Grégoire entre en campagne<br>Avec Jean Chouan.<br>Les balles passaient nombreuses<br>Au-dessus de lui,<br>En sifflotant dédaigneuses :<br>Il est trop petit ce joli,<br>Il est trop petit, dame oui !</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Cependant une le frappe<br>Entre les deux yeux :<br>Par le trou l’âme s’échappe,<br>Grégoire est aux cieux.<br>Mais Saint Pierre qu’il dérange<br>Lui dit : Hors d’ici !<br>Il nous faut un grand archange,<br>T’es ben trop petit, mon ami,<br>T’es ben trop petit, dame oui !</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Mais en apprenant la chose<br>Jésus se fâcha,<br>Entrouvrit son manteau rose<br>Pour qu’il s’y cachât.<br>Fit ainsi rentrer Grégoire<br>Dans son paradis,<br>En disant : Mon Ciel de Gloire<br>En vérité, je vous le dis,<br>Est pour les petits, dame oui !</div></div></section>","102":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Kyrie des gueux</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Kyrie eleison, miserere nostri ! (bis)</div><div class=\"verse\"><span class=\"verse-number\">1.</span>Holà ! marchons les gueux,<br>Errant sans feu ni lieu,<br>Bissac et ventre creux<br>Marchez les gueux.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Bissac et ventre creux,<br>Aux jours calamiteux,<br>Bannis et malchanceux.<br>Marchez les gueux.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Bannis et malchanceux,<br>Maudits comme lépreux,<br>En quête d’autres cieux,<br>Marchez les gueux.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>En quête d’autres cieux,<br>Rouleux aux pieds poudreux,<br>Ce soir chez le Bon Dieu,<br>Frappez les gueux.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Ce soir chez le Bon Dieu,<br>Errant sans feu ni lieu,<br>Bissac et ventre creux,<br>Entrez les gueux.</div></section>","103":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La Marseillaise des Blancs</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Aux armes Vendéens<br>Formez vos bataillons !<br>Marchez, marchez, le sang des bleus<br>Rougira nos sillons.</div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Allons, Armée des Catholiques<br>Le jour de gloire est arrivé<br>Contre nous de la République,<br>L’étendard sanglant est levé (bis)<br>Entendez-vous dans nos campagnes,<br>Les cris impurs des scélérats<br>Qui viennent jusque dans vos bras<br>Egorger vos filles et vos femmes.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Tremblez pervers et vous timides<br>La bourrée des deux partis.<br>Tremblez vos intrigues perfides<br>Vont enfin recevoir leur prix (bis)<br>Tout est levé pour vous combattre<br>De Saint Jean De Mont à Beaupreau<br>D’Angers à la ville d’Airvault<br>Nos gars ne veulent que se battre.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Chrétiens, vrais fils de l’Eglise<br>Séparez de vos ennemis<br>La faiblesse à la peur soumise<br>Que verrez en pays conquis (bis)<br>Mais ces citoyens sanguinaires<br>Mais les adhérents de Camus<br>Ces prêtres jureurs et intrus<br>Cause de toutes nos misères.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Ô Sainte Vierge Marie<br>Conduis, soutiens nos bras vengeurs !<br>Contre une séquelle ennemie<br>Combats avec tes zélateurs ! (bis)<br>A vos étendards la victoire<br>Est promise assurément.<br>Que le régicide expirant<br>Voie ton triomphe et notre gloire !</div></div></section>","104":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les bleus sont là</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Les bleus sont là, le canon gronde,<br>Dites les gars, avez-vous peur ? (bis)<br>Nous n’avons qu’une peur au monde,<br>C’est d’offenser Notre-Seigneur. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Vos corps seront jetés à l’onde,<br>Vos noms voués au déshonneur.<br>Nous n’avons qu’un honneur au monde,<br>C’est l’honneur de Notre-Seigneur.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Les bleus chez vous dansant la ronde<br>Boiront le sang de votre cœur.<br>Nous n’avons qu’un espoir au monde,<br>C’est le Cœur de Notre-Seigneur.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Allez les gars, le canon gronde,<br>Partez les gars, soyez vainqueurs.<br>Nous n’avons qu’une gloire au monde,<br>C’est la victoire du Seigneur.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Allons les gars pour notre terre,<br>Tels nos aïeux, pour notre Foi,<br>Reprenons le vieux cri de guerre :<br>Vive Dieu, la France, et le Roy.</div></div></section>","105":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La chasse aux loups</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Guêtres aux pieds, penbaz en main,<br>Où donc vas-tu si bon matin,<br>Où donc vas-tu mon Corentin ?<br>Tous nos gars ont pris rendez-vous,<br>Tihou hou !<br>Pour aller à la chasse aux loups !<br>Tihou hou, hou, hou, hou !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Pourquoi donc n’as-tu pas aux pieds<br>Tes lourds sabots de châtaignier<br>Mais tes fins et légers souliers<br>Nous aurons à forcer les loups,<br>Tihou hou<br>Chaussés de bons souliers à clous !<br>Tihou hou, hou, hou, hou !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Souperez-vous donc dans les bois<br>Qu’à ta boutonnière je vois<br>Ta vieille cuillère de bois ?<br>Après avoir chassé les loups<br>Tihou hou !<br>Nous mangerons la soupe aux choux !<br>Tihou hou, hou, hou, hou !</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Mais pourquoi donc as-tu cousu<br>Sur ton cœur le Cœur de Jésus,<br>Mis ton chapelet par dessus ?<br>C’est qu’avant de traquer les loups<br>Tihou hou !<br>Il fait bon se mettre à genoux !<br>Tihou hou, hou, hou, hou !</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Eh quoi vas-tu chasser ainsi<br>Avec le couteau que voici,<br>Sans emporter ton vieux fusil ?<br>Ne sais-tu donc plus que chez nous<br>Tihou hou !<br>C’est au couteau qu’on sert les loups !<br>Tihou, hou, hou, hou, hou !</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Adieu donc, mon bon Corentin,<br>Va t’embusquer dans un ravin<br>Au fond du hallier vendéen !<br>Quand la nuit, hurleront les loups,<br>Tihou hou !<br>Fais ta prière... Et pense à nous<br>Tihou, hou, hou, hou, hou !</div></div></section>","106":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Chant du Bas-Poitou</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Nous sommes poursuivis par ces gens d’armes<br>Aussi par ces gardes nationaux<br>Aussi par ces gardes nationaux<br>Aussi par ces jeunes militaires...<br>Nous sommes toujours pourchassés<br>Et même souvent attaqués... (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>S’rons-nous toujours dans la misère<br>N’aurons-nous donc jamais de joie<br>S’rons nous toujours parmi ces bois<br>S’rons-nous toujours parmi ces landes ?<br>S’rons-nous toujours parmi ces bois<br>N’aurons-nous donc jamais de joie ? (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Nous les mettrons hors de ces villes,<br>Nous les enverrons promener<br>Avec leur drapeau bigassé ;<br>Nous les mettrons hors de ces villes,<br>Avec leur drapeau bigassé ;<br>Nous les enverrons promener... (bis)</div></section>","107":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La blanche hermine</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>J’ai rencontré ce matin devant la haie de mon champ<br>Un troupe de marins, d’ouvriers, de paysans.<br>Où allez-vous, camarades, avec vos fusils chargés ?<br>Nous tendons des embuscades, viens rejoindre notre armée !</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>La voilà la blanche hermine,<br>Vivent la mouette et l’ajonc,<br>La voilà la blanche hermine,<br>Vivent Fougère et Clisson !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Où allez-vous, camarades, avec vos fusils chargés ?<br>Nous tendons des embuscades, viens rejoindre notre armée.<br>Ma mie dit que c’est folie d’aller faire la guerre aux Francs,<br>Moi je dis que c’est folie d’être enchaîné plus longtemps.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Ma mie dit que c’est folie d’aller faire la guerre aux Francs<br>Moi je dis que c’est folie d’être enchaîné plus longtemps.<br>Elle aura bien de la peine pour élever les enfants,<br>Elle aura bien de la peine car je m’en vais pour longtemps.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Elle aura bien de la peine pour élever les enfants,<br>Elle aura bien de la peine, car je m’en vais pour longtemps.<br>Je viendrai à la nuit noire, tant que la guerre durera,<br>Comme les femmes en noir, triste et seule, elle m’attendra.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Je viendrai à la nuit noire, tant que la guerre durera,<br>Comme les femmes en noir, triste et seule, elle m’attendra.<br>Mais sans doute pense-t-elle que je suis en déraison ?<br>De la voir mon cœur se serre, là-bas devant la maison.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Mais sans doute pense-t-elle que je suis en déraison ?<br>De la voir mon cœur se serre, là-bas devant la maison.<br>Et si je meurs à la guerre, saura-t-elle me pardonner<br>D’avoir préféré ma terre à l’amour qu’elle me donnait ?</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Et si je meurs à la guerre, saura-t-elle me pardonner<br>D’avoir préféré ma terre à l’amour qu’elle me donnait ?<br>J’ai rencontré ce matin devant la haie de mon champ<br>Un troupe de marins d’ouvriers de paysans...</div></div></section>","108":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les mouchoirs de Cholet</div><div class=\"song-actions\"></div></div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>J’avais acheté pour ta fête,<br>Trois petits mouchoirs de Cholet<br>Rouges comme la cerisette,<br>Tous les trois ma mie Annette<br>Oh ! Qu’ils étaient donc joliets,<br>Les petits mouchoirs de Cholet.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Ils étaient là dans ma poquette,<br>Dans mon vieux mouchoir blanc, si laid<br>Et chaque nuit, la Guerre faite<br>Dans les bois, ma mie Annette,<br>En rêvant de toi je rêvais<br>Aux petits mouchoirs de Cholet.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Les a vu Monsieur de Charette<br>Les voulut, je les lui donnai<br>Il en mit un dessus sa tête<br>Le plus biau, ma mie Annette,<br>C’était le plus fier des plumets,<br>Le petit mouchoir de Cholet.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Fit de l’autre une cordelette<br>Pour pendre son sabre au poignet<br>Fit du troisième une bouclette<br>Sur son cœur, ma mie Annette,<br>Et tout le jour les Bleus visaient<br>Le petit mouchoir de Cholet.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Ont visé le cœur de Charette<br>.. Ont trouvé... celui qui t’aimait<br>Et je vas mourir ma pauvrette<br>Pour mon Roy, ma mie Annette,<br>Et tu ne recevras jamais<br>Tes petits mouchoirs de Cholet !</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Mais qu’est-ce là dans ma poquette ?<br>C’est mon vieux mouchoir blanc si laid<br>Je te le donne pour ta fête<br>Plein de sang, ma mie Annette,<br>Il est si rouge qu’on dirait<br>Un mouchoir rouge de Cholet !</div></div></section>","109":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Chanson de l'armée de Charette</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>La Vendée pour défense à ses divisions,<br>Le soutien de la France va détruire la Nation.<br>Aux armes ! bombardiers artillerie,<br>Sont tout prêts à donner la symphonie.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>A l’entour de nos forces nous avons, pour certains,<br>Des ennemis atroces qui nous narguent de loin.<br>Nous pourrons nous vanter que ces mutins<br>N’oseront aborder notre terrain.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Ce Canclaux général de ces républicains<br>De ce monde total veut battre les chrétiens.<br>Mais son coup est manqué pour le certain<br>Nous l’avons bien chassé de ce terrain.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>A Nantes l’on espère vous y verrez beau jeu !<br>Les chrétiens en colère vous ferons voir du feu<br>En punition du mal et des forfaits<br>On vous prépare un bal c’est pour jamais.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>En toutes les provinces vous entendrez parler<br>Qu’il y a un nouveau prince qu’on dit dans la Vendée<br>Qui s’appelle Charette vive son cœur !<br>Chantons à pleine tête : gloire et honneur !</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Cet ami du monarque il a bien du renom,<br>Il a fait grand obstacle à toute la Nation ;<br>Jusques en Angleterre on l’applaudit ;<br>Aussi sur les frontières même à Paris.</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Admirons la vaillance de Charette homm’ de cœur<br>Il est né pour la France il fait voir sa valeur<br>Regardez cette armée rien de plus beau ;<br>Il a palmes et lauriers sur les drapeaux.</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Combien de catholiques qui n’existeraient plus<br>Si Charett’ pacifique avait perdu la vie !<br>Dieu nous l’a conservé vive le Roy !<br>Que toute cette armée chante avec moi.</div><div class=\"verse\"><span class=\"verse-number\">9.</span>Quand il va à l’attaque dit à ses commandants :<br>«Mettez-vous en bataille et marchez sur huit rangs,<br>En avant ! grenadiers ne craignez rien ;<br>Courage cavaliers, tout m’appartient.»</div><div class=\"verse\"><span class=\"verse-number\">10.</span>Qu’à fait cet’ chansonnette c’est un jeune officier<br>De l’armée de Charette de ses brav’ cavaliers<br>Si l’ est à votre gré j’en suis content !<br>Et que chaque officier en fasse autant !</div></div></section>","110":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Jean Cottereau</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Jean Cottereau disait à ses soldats, mes gars ! (bis)<br>Laissez là vos fusils trop lourds,<br>Emmanchez vos faux à rebours,<br>Nous allons chasser les regains<br>Dans les champs des Républicains</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Hou, hou, c’est le cri des hiboux,<br>Égaillez-vous !!</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Jean Cottereau ...<br>Avez-vous soif ? Avez-vous faim ?<br>Dieu vous envoie un souper fin :<br>Buvez la pluie, humez le vent,<br>Serrez la boucle et en avant !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Jean Cottereau ...<br>Vous regrettez me dites-vous<br>Le son des cloches de chez nous?<br>Pour Dieu que vous faut-il de plus?<br>Le canon sonne l’angélus.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Jean Cottereau ...<br>Ne tirez jamais sur un bleu<br>En train de prier le Bon Dieu :<br>Au lieu d’aller chez les maudits<br>Il irait droit au Paradis.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Jean Cottereau ...<br>Puisque l’on n’a plus de sabots<br>Allons chercher ceux des patauds<br>Tant mieux s’ils sont quatre contre un<br>Nous aurons huit sabots chacun !</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Jean Cottereau ...<br>Les bleus m’ont fait le beau cadeau<br>De sept, huit balles dans la peau,<br>Encore deux ou trois s’il leur plaît<br>Que je m’en fasse un chapelet !</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Jean Cottereau ...<br>Laissez les femmes pleurnicher<br>Et courez vite me venger,<br>Vivez et mourrez comme moi<br>Pour votre Dieu, pour votre Roy !</div></div></section>","111":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les Chouans</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Vivent les Chouans, les Chouans, les Chouans,<br>Vivent les Chouans du Morbihan !</div><div class=\"verse\"><span class=\"verse-number\">1.</span>La première fois qu’ils combattirent<br>Fut au bois de Camors, vous l’avez entendu.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Ils avaient reculé jusqu’à Quiberon<br>Et barré ensuite la falaise.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>A Quiberon ils s’étaient rendus,<br>Car ils étaient très menacés.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>De Quiberon quand ils s’en allèrent<br>On les conduisit au Pré des Martyrs.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Les Chouans, soldats de Dieu,<br>Savent mourir pour leur foi.</div></section>","112":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La Catholique</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Hardi contre la clique<br>Sans patrie et sans Dieu<br>Pour la foi catholique<br>Français debout ! car Dieu le veut<br>Chantons la catholique</div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Depuis dix-neuf cents ans et plus<br>La France est la France de Jésus<br>Depuis les Francs et les Gaulois<br>La France a toujours dit : Je crois ! Vive la France et Dieu !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>La belle France de Clovis<br>De Charlemagne et de Saint Louis,<br>De Jeanne d’Arc et de Bayard<br>Vers Dieu levait son clair regard.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Mais une bande de vautours<br>Planant sur elle de nos jours<br>A fait de l’ombre sur la croix<br>Et réduit la France aux abois.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>La France pleure et tend les bras<br>Malheur à qui ne l’entend pas !<br>Honte à qui n’ose pas bouger<br>Lorsque sa Mère est en danger !</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Nos fiers ancêtres ont lutté<br>Pour nous donner la liberté,<br>Pour conserver pareil trésor<br>Luttons comme eux jusqu’à la mort.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Sans crainte risquons notre peau<br>Pour la Croix et pour le Drapeau !<br>Autour d’eux si nous nous serrons<br>Par ces deux signes nous vaincrons.</div></div></section>","113":"<div class=\"pdfimg\" data-img=\"113\" data-alt=\"Chants de tradition\"></div>","114":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La Saint Hubert</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Ô saint Hubert, patron des grandes chasses,<br>Toi qu’exaltait la fanfare au galop,<br>En poursuivant le gibier à la trace,<br>Tu le forçais sous l’élan des chevaux.<br>Nous les derniers descendants de ta race,<br>Arrache nous aux plaisirs avilis ;<br>Emplis nos cœurs de jeunesse et d’audace ;<br>Dans la forêt fais nous chasseurs hardis !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Sauve d’abord, du bocage à l’Ardenne,<br>Notre forêt, si chère aux vieux Gaulois,<br>Pour qu’à ses chants notre jeunesse apprenne<br>Les fiers secrets gardés par les grands bois.<br>Fais nos yeux prompts et fais nos lèvres claires,<br>Pour bien lancer, quand viendra le danger,<br>Le cri de chasse ou le dur cri de guerre :<br>Sus à la bête et courons la traquer !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Tu vis un jour, au fond du hallier sombre,<br>Où tes limiers se pressaient aux abois,<br>La croix du Christ que le grand cerf dans l’ombre<br>Couronnait de l’auréole des bois.<br>Mystique appel qui conquit ta grande âme :<br>Tu dis aux cours un méprisant adieu ;<br>Montre à nos yeux cette divine flamme,<br>Et conduis-nous camper sur les hauts lieux.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Quand le Seigneur, la chasse terminée,<br>Appellera notre nom à son tour,<br>Épargne-nous les tristes mélopées,<br>Tu sonneras pour nous le Point du jour.<br>Au grand galop, pour célébrer ta gloire,<br>Nous bondirons en poussant l’hallali !<br>Et nous ferons, au fracas des fanfares,<br>En ton honneur, trembler le Paradis.</div></div></section>","115":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Claquez bannières de chrétienté</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Claquez bannières de chrétienté<br>Contre révolution.<br>Notre honneur est fidélité,<br>Gardons la Tradition.</div><div class=\"verse\"><span class=\"verse-number\">1.</span>Chez nous Dieu premier servi,<br>La France est aux Français.<br>Travaille, Famille Patrie,<br>Nos devises sont fixées.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Dehors escrocs libéraux,<br>Valets des communistes.<br>Complices des bourreaux,<br>Compères des socialistes.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Nos alliés ils ont trahi,<br>Sali même le sacré.<br>Livré nos colonies<br>Les enfants massacrés.</div></section>","116":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les Chacals</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Les chacals craignent pour leur peau<br>Heia hoho<br>Car l’heure des comptes viendra bientôt<br>Heia hoho, ho ho ho ho ho<br>Au clocher nous mettrons<br>Claquant dans le vent notre fanion</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Les tambours battent le rappel...<br>Et pour l’Europe c’est le réveil...</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Contre les rouges nous marchons...<br>Aidés de Dieu que nous chantons...</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Les socialistes nous les chasserons...<br>Et les marxistes nous les pendrons...</div></section>","117":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Occident, en avant !</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Occident, en avant,<br>Avant qu’il ne soit trop tard.<br>Venge les soldats tués au Drakkar<br>Par Assad et par Ivan.<br>Chrétienté, il est temps<br>De secourir le Liban chrétien ;<br>Il t’appelle depuis si longtemps<br>Et mourra sans ton soutien.</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Ils sont venus armés par les rouges,<br>Avec des chars et de l’artillerie,<br>De Palestine et de la mer Rouge,<br>De Syrie pour chasser les Roumis.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Le dos à la mer ils résistent seuls,<br>Sous les obus dans les attentats,<br>Abandonnés par leurs frères veules,<br>Qui n’ont que mots pour ce Golgotha.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Honneur à Stéphane Zanétacci,<br>Qui des phalanges rejoignit les faisceaux,<br>Pour garder libre la Phénicie,<br>À Beyrouth, tué à l’assaut.</div></div></section>","118":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Au revoir camarade</div><div class=\"song-actions\"></div></div><div class=\"verse nonum\">(se chante deux fois)<br>Au revoir camarade que le Seigneur te protège<br>Sur la route où veillera ton ange.<br>Que la Vierge te montre le chemin des étoiles<br>Où nous nous retrouverons demain. (bis)</div></section><section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le Cor</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Dans le soir d’or résonne, résonne,<br>Dans le soir d’or résonne le cor ;<br>Résonne, résonne, résonne le cor, (bis)<br>Dans le soir d’or résonne, résonne,<br>Dans le soir d’or résonne le cor...</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>C’est le cor du grand Roland<br>Qui sonne affolant sous le ciel sanglant ;<br>C’est le cor du roi Saint Louis<br>Sonnant l’hallali des païens maudits.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>C’est le cor du gai Du Guesclin<br>Harcelant sans frein l’Anglais qui le craint ;<br>C’est le cor de Jeanne Lorraine<br>Qui sonne et s’égrène dans la nuit sereine.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>C’est le cor du preux Bayard<br>Qui dans le brouillard rallie les fuyards ;<br>C’est le cor qui sonne le jour<br>Où la gloire accourt, Condé, Luxembourg.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>C’est le cor de Hoche et Marceau,<br>Des gars en sabots sauvant nos drapeaux,<br>C’est le cor du vieil Empereur<br>Qui sonne et se meurt dans l’île des pleurs.</div></div></section>","119":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Pelot d'Hennebont</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Ma chère maman, je vous écris<br>Que nous sommes entrés dans Paris, (bis)<br>Que je somm’ déjà caporal<br>Et j’serons bientôt général. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>A la bataille je combattions<br>Les ennemis de la Nation<br>Et tous ceux qui se présentions,<br>A grands coups de sabre j’les émondions !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Le roi Louis m’a z’ appelé<br>C’est “Sans quartier” qu’il m’a nommé.<br>Mais “Sans quartier” c’est point mon nom<br>J’lui dit j’m’ appelle Pelot d’Hennebont.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Il a tiré un biau ruban<br>Et je n’ sais quoi au bout d’argent,<br>M’ a dit bo
