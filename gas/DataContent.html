<script>window.page_content_data={"1":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Notre Patrie</div><div class=\"song-actions\"></div></div><div class=\"verse nonum\">“Notre Patrie à nous, c’est nos villages, nos tombeaux,<br>tout ce que nos pères ont aimé avant nous.<br>Notre Patrie, c’est notre Foi, notre terre, notre Roi. Mais leur patrie à eux,<br>qu’est-ce que c’est ? Vous le comprenez, vous ?<br>Ils veulent détruire les coutumes, l’Ordre, la Tradition.<br>Alors, qu’est-ce que c’est que cette patrie narguant le passé, sans fidélité, sans amour ?<br>Cette patrie de bille bande et d’irréligion ?<br>Pour eux, la Patrie semble n’être qu’une idée.<br>Pour nous, elle est une terre.<br>Et il est vieux comme le diable, leur monde qu’ils disent nouveau<br>et qu’ils veulent fonder dans l’absence de Dieu...<br>Vieux comme le diable ! On nous dit que nous sommes les suppôts des vieilles<br>superstitions. Mais en face de ces démons qui renaissent de siècle en siècle,<br>Nous sommes une jeunesse, messieurs, nous sommes la Jeunesse de Dieu !<br>La Jeunesse de la Fidélité !<br>Et cette Jeunesse veut préserver<br>pour elle et pour ses fils, la créance humaine, la liberté de<br>L’homme intérieur.”</div><div class=\"verse nonum\">Chevalier de Charette</div></section>","2":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Prière des chefs</div><div class=\"song-actions\"></div></div><div class=\"verse nonum\">Seigneur et chef Jésus-Christ, qui malgré ma faiblesse et mon indignité</div><div class=\"verse nonum\">m’avez choisi pour chef et gardien de mes frères scouts,</div><div class=\"verse nonum\">faites que ma parole et mes exemples conduisent leur marche au sentier de votre loi,</div><div class=\"verse nonum\">que je sache leur montrer vos traces divines dans la nature que vous avez créée,</div><div class=\"verse nonum\">leur enseigner ce que je dois et conduire ma patrouille d’étapes en étapes jusqu’à Vous ô mon Dieu,</div><div class=\"verse nonum\">dans le camp du repos et de la joie où vous avez dressé votre tente et la nôtre pour l’éternité.</div><div class=\"verse nonum\">Ainsi soit-il.</div></section>","3":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Aux Scouts morts pour la France</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse nonum\">A vous Scouts<br>A vous Scouts<br>A vous Scouts</div><div class=\"verse nonum\">A vous Scouts qui avez suivi la voie tracée par la croix Potencée<br>comme les Rois Mages ont suivi l’étoile qui les amenait à Dieu.<br>qui avez choisi le service de la France pour être mieux reçus par Dieu.<br>qui avez paraphé de votre sang la parole donnée et l’engagement souscrit.<br>qui votre vie durant, êtes restés fidèles à la noble devise de l’homme de guerre :</div><div class=\"verse nonum\">« Mon âme à Dieu,</div><div class=\"verse nonum\">Mon corps à la patrie,</div><div class=\"verse nonum\">Mon honneur à moi »</div><div class=\"verse nonum\">Et qui en êtes morts.<br>A vous enfin nous adressons cette prière :<br>Que l’épée qui vous a ouvert les portes du ciel<br>s’abatte sur les épaules de ceux que vous aurez estimés dignes<br>de suivre votre exemple et les fasse<br>chevalier du Christ.</div><div class=\"verse nonum\">Lieutenant de Vaisseau Pierre Guillaume</div></div></section>","4":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Prière des chevaliers</div><div class=\"song-actions\"></div></div><div class=\"verse nonum\">Seigneur Jésus, de qui descend toute noblesse et toute chevalerie,<br>apprenez-nous à servir noblement.<br>Que notre fait ne soit point parade ni littérature, mais loyal ministère et sacrifice coûteux.<br>Tenez nos âmes hautes, tout près de Vous, dans le dédain des marchandages,<br>des calculs et des dévouements à bon marché.<br>Car nous voulons gagner notre paradis non pas en commerçants, mais à la pointe de notre épée,<br>laquelle se termine en croix, et ce n’est pas pour rien.<br>Nous avons fait de beaux rêves pour Votre amour dans l’obscurité des journées banales,<br>préparez-nous aux grandes choses par la fidélité aux petites et enseignez-nous que la plus fière<br>épopée est de conquérir notre âme et de devenir des saints.<br>Nous n’avons pas visé moins haut, Seigneur, et nous sommes bien ambitieux,<br>mais heureusement nous sommes faibles et cette grâce, nous l’espérons de Votre miséricorde,<br>nous conservera humbles.<br>Demandez-nous beaucoup, et aidez-nous à Vous donner davantage.<br>Et puisque nous sommes livrés à Vous,<br>ne Vous gênez pas pour nous prendre au mot et pour nous sacrifier :<br>Nous Vous le demandons malgré le tremblement de notre chair, car nous voulons n’avoir qu’une crainte,<br>celle de ne pas Vous aimer assez.<br>Et quand, au soir de notre dernière bataille, Votre voix de Chef sonnera le ralliement de tous Vos chevaliers,<br>faites, Seigneur, c’est notre suprême prière, faites que notre mort serve à quelque chose,<br>et accordez-nous la grâce de mourir debout.</div><div class=\"verse nonum\">Ainsi soit-il.</div></section>","5":"<div class=\"pdfimg\" data-img=\"5\" data-alt=\"Chants de prières\"></div>","6":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Prière Scoute</div><div class=\"song-actions\"></div></div><div class=\"verse nonum\">Seigneur Jésus,</div><div class=\"verse nonum\">Apprenez-nous à être généreux,</div><div class=\"verse nonum\">A vous servir comme vous le méritez,</div><div class=\"verse nonum\">A donner sans compter,</div><div class=\"verse nonum\">A combattre sans souci des blessures,</div><div class=\"verse nonum\">A travailler sans chercher le repos,</div><div class=\"verse nonum\">A nous dépenser sans attendre d’autre récompense</div><div class=\"verse nonum\">Que celle de savoir</div><div class=\"verse nonum\">Que nous faisons votre Sainte Volonté. Ainsi soit-il</div></section>","7":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Cœur de Jésus</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Cœur de Jésus, notre chef, notre frère,<br>Apprenez-nous à être généreux<br>Et dédaigneux d’un labeur mercenaire,<br>A vous servir comme on doit servir Dieu,<br>Cœur de Jésus, notre chef, notre frère<br>Apprenez-nous à être généreux.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Apprenez-nous ce qui fait l’âme grande,<br>La noble horreur de la vulgarité.<br>Quant à l’amour, honte à qui vous marchande<br>Apprenez-nous à donner sans compter.<br>Apprenez-nous ce qui fait l’âme grande<br>La noble horreur de la vulgarité.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Apprenez-nous, maître des heures dures,<br>A travailler sans chercher le repos,<br>A guerroyer sans souci des blessures<br>Pour soutenir l’honneur de vos drapeaux.<br>Apprenez-nous, maître des heures dures<br>A travailler sans chercher le repos.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Apprenez-nous comment on se dépense,<br>Comment pour vous on s’use de son mieux,<br>Sans désirer aucune récompense<br>Que de savoir qu’on fait ce que Dieu veut.<br>Apprenez-nous comment on se dépense<br>Comment pour vous on s’use de son mieux.</div></div></section>","8":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Ô Jésus, reste avec nous !</div><div class=\"song-actions\"></div></div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Depuis l’aube où sur la terre<br>Nous l’avons revu debout,<br>Tout renaît dans la lumière,<br>O Jésus, reste avec nous ! (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Si parfois sur notre route<br>Nous menace le dégoût,<br>Dans la nuit de notre doute,<br>O Jésus, marche avec nous ! (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Tu cherchais les misérables,<br>Ton amour allait partout :<br>Viens t’asseoir à notre table,<br>O Jésus, veille avec nous ! (bis)</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Si Ta Croix nous semble dure,<br>Si nos mains craignent les clous,<br>Que Ta gloire nous rassure,<br>O Jésus, souffre avec nous ! (bis)</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Au-delà de Ton Calvaire<br>Tu nous donnes rendez-vous,<br>Dans la joie, près de Ton Père,<br>O Jésus, accueille-nous ! (bis)</div></div></section>","9":"<div class=\"song-pair\"><section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Écoute la prière</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Ecoute la prière<br>Qui du camp monte vers toi,<br>Vers la grande lumière,<br>Vers la paix et vers la joie.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Illumine la route<br>Où le monde nous attend.<br>Que suivant la loi scoute<br>Nous servions les pauvres gens.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Donne à notre patrie,<br>Divisée dans ses frontières,<br>La paix par toi promise<br>A ceux qui s’aiment en frères.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Près de toi, bonne Mère<br>Tes enfants sont à genoux<br>Entends notre prière<br>Et jette les yeux sur nous.</div></section><section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Voguons au vent de mer</div><div class=\"song-actions\"></div></div><div class=\"verse nonum\">Voguons au vent de mer,<br>Au gré des vagues.</div><div class=\"verse nonum\">Marie, là-haut, comme une étoile,<br>Marie, là-haut, veille sur nous.</div><div class=\"verse nonum\">Etoile du ciel, lumière sans voile<br>Etoile du ciel, priez pour nous !</div></section></div>","10":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Chant de la promesse</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Je veux t’aimer sans cesse<br>De plus en plus,<br>Protège ma promesse<br>Seigneur Jésus.</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Devant tous je m’engage,<br>Sur mon honneur<br>Et je te fais hommage<br>De moi, Seigneur.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Je jure de te suivre<br>En fier chrétien<br>Et tout entier je livre<br>Mon cœur au tien.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Je suis de tes apôtres<br>Et chaque jour<br>Je veux aider les autres<br>Pour ton amour.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Fidèle à ma patrie<br>Je le serai<br>Tous les jours de ma vie<br>Je servirai.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Ta règle a sur nous-même<br>Un droit sacré<br>Je suis faible, tu m’aimes<br>Je maintiendrai.</div></div></section>","11":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Cantique des patrouilles</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Seigneur, rassemblés près des tentes,<br>Pour saluer la fin du jour,<br>Tes fils laissent leurs voix chantantes<br>Voler vers Toi pleines d’amour.<br>Tu dois aimer l’humble prière<br>Qui de ce camp s’en va monter.<br>O Toi qui n’avais sur la terre<br>Pas de maison pour t’abriter.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Nous venons toutes les patrouilles<br>Te prier pour Te servir mieux.<br>Vois au bois silencieux<br>Tes fils qui s’agenouillent,<br>Bénis-les, ô Jésus, dans les cieux.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Merci de ce jour d’existence<br>Où ta bonté nous conserva.<br>Merci de ta sainte présence<br>Qui de tout mal nous préserva.<br>Merci du bien fait par la troupe,<br>Merci des bons conseils reçus,<br>Merci de l’amour qui nous groupe<br>Comme des frères, ô bon Jésus.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Nos coeurs ont-ils perdu ta grâce,<br>Pardonne encore à nos erreurs ;<br>Seigneur, que ta clémence efface,<br>Les péchés de tes éclaireurs ;<br>Et que, rempli de l’allégresse<br>D’avoir répété son serment,<br>Chacun s’endorme en la promesse<br>De te servir fidèlement.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Ô toi qui veillais tes apôtres<br>Et les bordais durant la nuit,<br>Défends notre camp et les autres<br>Des rondes du Malin Esprit !<br>Monte la garde, ô notre guide,<br>Afin que nous puissions demain<br>Ouvrir des yeux toujours limpides<br>Devant l’Etoile du Matin !</div></div></section>","12":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Miserere de la mer</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Perdu sous le ciel, perdu sur la mer<br>Là-haut écoutez ma prière !<br>Perdu sous le ciel si loin de la terre.<br>A moi Notre Dame et tous les Saints !<br>Prenez en pitié tous les marins !<br>Calmez la vague, la vague et le vent ;<br>Calmez pour moi l’ouragan.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>À tous les calvaires, aux croix des chemins<br>Je promets un pèlerinage ;<br>A tous les calvaires aux croix des villages.<br>A moi Christ en croix ayez pitié !<br>Du fond de la mer miserere !<br>Pardonnez, pardonnez, pardonnez- moi,<br>Sous mes péchés je me noie.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Plus jamais l’été, plus jamais l’hiver,<br>Plus jamais la fête au village,<br>Plus jamais l’amour sur un clair visage.<br>A moi mon pays mes souvenirs !<br>A moi tous mes rêves et l’avenir !<br>Sur moi la vague, la vague s’abat,<br>Sur moi la mer et le froid !</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Perdu sous le ciel, perdu sur la mer,<br>Perdu au milieu des nuages<br>Abordant le ciel après le naufrage.<br>A moi Notre Dame et tous les Saints !<br>Prenez en pitié tous les marins !<br>Calmez la vague, la vague et le vent ;<br>Calmez pour moi l’ouragan.</div></div></section>","13":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">À Jeanne d'Arc</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Jeanne d’Arc, ô Vierge bénie<br>Par qui la France à l’agonie<br>Fut arrachée à l’oppresseur,<br>Ne laisse pas dans la tempête,<br>Périr le fruit de ta conquête<br>Garde la France, (ter)<br>Ô noble sœur !</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Pour le salut de la Patrie<br>Prions, Français, d’un même cœur ;<br>Quand un pays espère et prie,<br>C’est le réveil de sa grandeur.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Un jour, hélas ! Au cœur frappé,<br>La belle France allait mourir<br>Sur les débris de son épée ;<br>Mais le ciel vint la secourir.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Des voix d’en haut, Jeanne inspirée<br>Quitte sa mère et son troupeau,<br>Et la victoire inespérée<br>Suit désormais son blanc drapeau.</div></div></section>","14":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Notre-Dame des Éclaireurs</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Le soir étend sur la terre<br>Son grand manteau de velours,<br>Et le camp calme et solitaire,<br>Se recueille en son amour.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Ô Vierge de Lumière,<br>Etoile de nos cœurs,<br>Entends notre prière,<br>Notre-Dame des éclaireurs</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Ô Douce Dame aux étoiles,<br>Jette un regard sur ce camp<br>Où tes fils sous leurs frêles toiles,<br>Vont dormir en t’invoquant.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Ô Toi, plus blanche que neige<br>Dans ton manteau virginal,<br>Ta beauté, Vierge nous protège<br>Contre la laideur du mal.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Fais-nous quitter l’existence<br>Joyeux et pleins d’abandon,<br>Comme un scout, après les vacances,<br>S’en retourne à la maison.</div></div></section>","15":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Notre-Dame des Scouts marins</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Vierge Marie, Reine des flots,<br>Phare dans la nuit, Stella Maris</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Sois la brise de mer, douce à tes scouts marins<br>Et ouvre grand nos cœurs aux vents de toutes terres.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Tends notre volonté, voile sous le grand vent,<br>Pour veiller à la barre, attentifs avec toi.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Fortifie notre corps pour lutter dans les grains,<br>Montre-nous les écueils qui brisent notre route.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Intercède pour nous : que tout près du Seigneur<br>Au port d’éternité, l’ancre enfin soit jetée.</div></div></section>","16":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Avant d'aller dormir</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Avant d’aller dormir sous les étoiles<br>Doux maître, humblement à genoux<br>Tes fils t’ouvrent leur cœur sans voile<br>Si nous avons pêché, pardonne-nous.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Eloigne de ce camp le mal qui passe<br>Cherchant dans la nuit son butin<br>Sans Toi, de toutes ces menaces<br>Qui nous protégera, berger divin ?</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Protège aussi, Seigneur, ceux qui nous aiment<br>Partout, garde-les du péril<br>Pitié pour les méchants eux-mêmes<br>Et paix à tous nos morts. Ainsi soit-il.</div></section>","17":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Saint Georges</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Saint Georges guide-nous<br>Sur la route claire et belle,<br>Saint Georges guide-nous<br>Rends-nous fermes et prêts à tout.</div><div class=\"verse\"><span class=\"verse-number\">1.</span>Fier chevalier, l’éclat de ton armure<br>Comme un soleil, attire tous les yeux ;<br>Ta loyauté, ton âme toute pure,<br>Nous ont conquis et nous voici joyeux.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Garde à nos yeux le charme d’un sourire,<br>Quand nous souffrons au plein de notre effort ;<br>Et dussions-nous subir un long martyre<br>Tiens nos cœurs droits quand faibliront nos corps.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Ô grand vainqueur, de ton séjour de gloire<br>Assiste-nous quand ici nous luttons,<br>Conduis nos pas aux routes de victoire<br>Jusqu’à la mort s’il faut nous te suivrons.</div></section>","18":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Notre-Dame de la Paix</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>C’est vers Toi, très Sainte Vierge,<br>Que se tournent tes fils :<br>Que ta douceur baigne et submerge<br>Nos cœurs et nos esprits.<br>Apaise en nous les désirs fous<br>Et tous les vents d’orage ;<br>Fais-nous trouver, loin des mirages,<br>Le calme à tes genoux.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Sous les étoiles palpitantes,<br>Nous dormirons bientôt<br>Si tu veux bien couvrir nos tentes<br>Des plis de ton manteau.<br>Dans la forêt, le camp se tait,<br>La nuit s’étend, profonde :<br>Entre tes bras berce le monde,<br>Ô Vierge de la paix.</div></section>","19":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Vierge des chemins de France</div><div class=\"song-actions\"></div></div><div class=\"verse nonum\">Vierge des chemins de France,<br>Vois tes fils Routiers,<br>Nous avons cueilli pour toi<br>Ces fleurs au long des bois, Ave !<br>Nous sommes las,<br>Nous pauserons auprès de Toi.<br>Pour la Route et pour le dur effort,<br>Soutiens nos pas, Maria,<br>Et prends-nous un jour au ciel,<br>Ô Mère dans tes bras.</div></section>","20":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Pour être généreux</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Pour être généreux, et donner sans compter,<br>Comme les chevaliers, les héros et les preux,<br>Le scout va recevoir son Dieu.</div><div class=\"verse\"><span class=\"verse-number\">1.</span>Je suis indigne d’approcher de vous, Seigneur ;<br>Faites un signe, et vous guérirez mon cœur !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Vierge Marie, comment accueillir Jésus ?<br>Je vous envie, votre amour et vos vertus !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Ô divin maître, votre cœur est humble et doux ;<br>Je voudrais être doux et humble comme vous !</div></section>","21":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Mater Alma</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Voyez ô Notre-Dame<br>Vos enfants devant vous<br>Ils viennent vous prier, Gratia Plena !<br>Vous les écouterez. Mater Alma !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Ils voudraient que leur âme<br>Soit toujours belle pour vous<br>Et leur vie à vos yeux, Gratia Plena !<br>Comme le reflet de Dieu. Mater Alma !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Ô vous le port des âmes<br>Rendez leur cœur plus grand<br>Et d’amour débordant, Gratia Plena !<br>Puis élevez-le vers vous. Mater Alma !</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Accordez-leur la grâce,<br>Leur service achevé<br>D’accueillir ce moment, Gratia Plena !<br>Sans peur comme des Scouts. Mater Alma !</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Prenez les scouts de France<br>Dans vos bras grands ouverts,<br>Pendant la durée des tempêtes, Gratia Plena !<br>Bercez-les sur vos genoux. Mater Alma !</div></div></section>","22":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Je mets ma confiance</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Je mets ma confiance,<br>Vierge en votre secours.<br>Servez-moi de défense,<br>Prenez soin de mes jours.<br>Et quand ma dernière heure<br>Viendra fixer mon sort,<br>Obtenez que je meure<br>De la plus sainte mort.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Sainte Vierge Marie<br>Asile des pécheurs !<br>Prenez part, je vous prie,<br>A mes justes frayeurs.<br>Vous êtes mon refuge,<br>Votre Fils est mon Roi<br>Mais Il sera mon juge :<br>Intercédez pour moi !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Je veux toujours vous plaire<br>O Mère du Sauveur.<br>Je promets de rien faire<br>Qui blesse votre Honneur.<br>Je veux que, par hommage,<br>Ceux qui me sont sujets,<br>En tout lieu à tout âge,<br>Servent vos intérêts.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Ah ! Soyez moi propice !<br>Avant que de mourir,<br>Apaisez sa justice !<br>Je crains de la subir.<br>Mère pleine de zèle,<br>Protégez votre enfant ;<br>Je vous serai fidèle<br>Jusqu’au dernier instant.</div></div></section>","23":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Prière du Parachutiste</div><div class=\"song-actions\"></div></div><div class=\"verse nonum\">Mon Dieu, mon Dieu, donne-moi la tourmente,<br>Donne-moi la souffrance<br>Donne-moi l’ardeur au combat<br>Mon Dieu, mon Dieu, donne-moi la tourmente,<br>Donne-moi la souffrance<br>Et puis la gloire au combat... (bis)<br>Ce dont les autres ne veulent pas,<br>Ce que l’on te refuse,<br>Donne-moi tout cela, oui tout cela.<br>Je ne veux ni repos, ni même la santé<br>Tout ça, mon Dieu, t’est assez demandé.</div><div class=\"verse nonum\">Mais donne-moi (bis)<br>Mais donne-moi la Foi<br>Donne moi force et courage.<br>Mais donne-moi la Foi<br>Donne-moi force et courage...</div><div class=\"verse nonum\">Mais donne-moi la Foi<br>Pour que je sois sûr de moi... Donne-moi...</div></section>","24":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Ô Vierge immaculée</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse nonum\">Ô Vierge immaculée, Océan de tendresse,<br>Nous venons te supplier, verse en nous tes largesses !</div><div class=\"verse nonum\">Ô coeur plein de bonté dont la grâce déborde,<br>Regarde l’humanité, obtiens miséricorde.</div><div class=\"verse nonum\">Je me consacre à toi, ô ma Reine et ma Mère.<br>Je me jette dans vos bras, avec un coeur sincère.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Chantons vos louanges<br>Unis aux archanges<br>Ave maria (bis)<br>Elle est notre mère<br>Encore sur la terre<br>Ave maria (bis)</div></div></section>","25":"<div class=\"pdfimg\" data-img=\"25\" data-alt=\"Chants scouts\"></div>","26":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Ô ma troupe</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Ô ma troupe, ô troupe chérie,<br>Que dans tes rangs l’on vit heureux ;<br>Garde-nous, par Jésus Marie,<br>Garde-nous toujours purs et généreux.</div><div class=\"verse\"><span class=\"verse-number\">1.</span>C’est ta loi qui nous rassemble,<br>Ta promesse qui nous unit,<br>C’est ta croix qui, tout ensemble,<br>Nous décore et nous bénit.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>L’idéal que tu fis naître<br>En nos cœurs ensoleillés<br>Nous enflamme, et nous voulons être<br>Scouts de France et vrais chevaliers.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Rassemblés souvent sur terre<br>Pour chanter autour des feux,<br>Nous serons tous un jour des frères<br>Près du Père qui règne aux Cieux.</div></section>","27":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La Croix des Scouts</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Ô Croix des Scouts, Croix glorieuse,<br>Croix des héros des anciens jours,<br>A l’âme haute et généreuse,<br>Tu nous resteras chère toujours !</div><div class=\"verse\"><span class=\"verse-number\">1.</span>Quand il partait pour la croisade,<br>Pour délivrer le saint tombeau,<br>Le chevalier fier, sans bravade,<br>Portait la Croix sur son drapeau.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Enrôlé sous cette bannière,<br>Il affrontait tous les dangers ;<br>Il était doux à la misère,<br>Et courtois pour les étrangers.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Guidé par elle, il savait être<br>Aimable et franc, loyal et fort ;<br>Et sur les pas du Divin Maître,<br>Prêt à servir jusqu’à la mort.</div></section>","28":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les grèves</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Nous chantons tout le long des grèves<br>Pour plaire au cœur de nos gars,<br>En portant partout notre rêve<br>A ceux qui n’en n’ont pas. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Nos chansons ont des mots bien tendres<br>Pour plaire au cœur dolent,<br>Mais il fait meilleur les entendre<br>Aux clairs échos des champs. (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Nos chansons ont des mots bien rudes<br>Aux cœurs trop tôt flétris :<br>Pour chasser la vieille habitude<br>Il faut des mots hardis. (bis)</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Nos chansons font chanter la vie<br>Qui plaît au cœur des forts<br>Mais la route dure est suivie<br>Au prix de durs efforts. (bis)</div></section>","29":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Va, scout de France !</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Tout en marchant, marchant, marchant,<br>Et par les bois et par les champs,<br>Observant les traces, le vol des oiseaux qui passent,<br>Et d’où vient le vent, et les couleurs du couchant ;<br>Tout en cherchant, cherchant, cherchant,<br>L’œil grand ouvert, l’oreille au guet,<br>Rien ne doit surprendre<br>Un vrai scout qui sait s’y prendre ;<br>Il doit être prêt !</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Va, scout de France, et ton bâton en main,<br>Va t’en sur la route,<br>Prêcher la loi scoute<br>Aux pauvres du grand chemin.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Va, scout de France, et par ta belle humeur,<br>Enseigne à tes frères<br>La loi simple et claire,<br>La loi du plus fier honneur !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Va, scout de France, et sers ton Dieu d’abord ;<br>Ton âme, Il l’a prise,<br>Sois fier de l’Eglise,<br>Fidèle jusqu’à la mort !</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Va, scout de France, et cœur tout frémissant,<br>Sers bien ta patrie,<br>Prospère ou meurtrie,<br>Sois prêt à verser ton sang !</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Va, scout de France, et donne avec entrain :<br>Service ou défense,<br>C’est sans récompense<br>Qu’un scout vit pour son prochain.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Va, scout de France, au risque de tes jours :<br>Danger ne peut nuire<br>A qui sait sourire ;<br>Va scout, donne-toi toujours !</div></div></section>","30":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les trois devises</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Jadis petit loup, tu promettais de faire<br>Par jour un plaisir à quelqu’un, l’as tu fait ?<br>Souvent la Cheftaine dans tes yeux<br>Lisait le désir généreux,<br>De l’imiter en faisant de ton mieux.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Plus tard, jeune scout, tu sus par tes grands frères<br>Quels étaient les devoirs de la Loi ;<br>Deux mots résumaient l’ordre express<br>Qui du Christ lui-même venait<br>Et voulut te garder toujours prêt !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Routier, maintenant, tu t’en vas dans la vie<br>La fourche en main partout aidant ton prochain<br>La route est pénible à gravir<br>Il faut lutter, il faut souffrir :<br>Qu’importe, on sait qu’il faut d’abord servir.</div></section>","31":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Youkaïdi</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Youkaïdi, youkaïda,<br>Youkaïdi aïdi aïda ;<br>Youkaïdi, youkaïda,<br>Youkaïdi aïda !</div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Aux premiers feux du soleil,<br>Youkaïdi, youkaïda,<br>Tout le camp est en éveil,<br>Youkaïdi aïda !<br>On voit sortir de la tente<br>La troupe alerte qui chante.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Le campeur, en voyageant...<br>Peut aller même sans argent...<br>Toujours joyeux en chemin,<br>Qu’importe le lendemain !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Toujours prêts, quoiqu’il arrive...<br>Ayons de l’initiative...<br>Sans geindre ni criailler,<br>Nous saurons nous débrouiller.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Nous sommes toujours contents...<br>Qu’il pleuve ou fasse beau temps...<br>Sans reproche et sans peur,<br>Est devise du campeur.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>L’honneur est notre noblesse...<br>Un bon cœur notre richesse...<br>Tout droit, fièrement, sans peur,<br>Ainsi marche le campeur.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Et si la beauté du site...<br>A camper là, plus invite...<br>Dans les fleurs et l’herbe, on tend<br>La tente en moins d’un instant.</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Puis l’appel et la toilette...<br>Et bientôt, la troupe est prête...<br>Offre à Dieu le jour nouveau,<br>En saluant le drapeau.</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Ensuite, rassemblement...<br>Sac au dos, et en avant...<br>Nous partons avec courage,<br>Transportant notre bagage.</div><div class=\"verse\"><span class=\"verse-number\">9.</span>Nous faisons notre cuisine...<br>Bientôt, la forêt voisine...<br>Laisse filtrer dans ses branches<br>De nos feux les fumées blanches.</div><div class=\"verse\"><span class=\"verse-number\">10.</span>Mais enfin, voici la nuit...<br>Doucement, la lune luit...<br>Autour du feu qui jaillit,<br>Les campeurs sont accroupis.</div><div class=\"verse\"><span class=\"verse-number\">11.</span>Avec la flamme du feu...<br>Les cœurs sont montés vers Dieu...<br>On n’entend plus aucun bruit ;<br>Tout le camp s’est endormi.</div></div></section>","32":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">L'appel de la Route</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Ohé garçon, garçon,<br>Toi qui cherches, toi qui doutes,<br>Prête l’oreille à ma chanson,<br>Entends l’appel de la Route.</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Elle est là devant ta maison<br>Comme une amie ;<br>Et pendant la belle saison,<br>Toute fleurie,<br>Elle fuit jusqu’à l’horizon<br>D’une fuite infinie.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>C’est la route des Paladins,<br>Route guerrière ;<br>Elle a vu la marche des Saints<br>Vers la lumière,<br>Et leurs pas sont encore empreints<br>Dans sa vieille poussière.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Si ton cœur parfois s’est ému<br>Pour de grands rêves,<br>Si tu veux les fières vertus<br>Qui nous soulèvent<br>Bien loin des sentiers rebattus,<br>Suis la Route sans trêve .</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Tu sauras les secrets nombreux<br>De cette Route,<br>Les calvaires dressés aux cieux<br>Sous la grande voûte.<br>Tu seras pour l’amour des gueux<br>Chaque jour aux écoutes.</div></div></section>","33":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Quand le ciel est bleu</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Marchons ensemble<br>Dans le soleil levant !<br>Chantons ensemble<br>Dans le grand vent !</div><div class=\"verse\"><span class=\"verse-number\">1.</span>Quand le ciel est bleu, mon garçon !<br>Quand les fleurs parfument le vent,<br>Siffle un air joyeux, mon garçon !<br>Prends ton sac et va t’en ! (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Quand le ciel est gris, mon garçon !<br>Quand le sol durcit en gelant<br>Siffle un air joyeux, mon garçon !<br>Prends ton sac et va t’en ! (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Car au camp, vois-tu mon garçon !<br>On se moque du mauvais temps<br>Si tu as du cran, mon garçon !<br>Prends ton sac et va t’en ! (bis)</div></section>","34":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">L'Espérance</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Le front penché sur la terre,<br>J’allais seul et soucieux<br>Quand résonna la voix claire<br>D’un petit oiseau joyeux.<br>Il disait : Reprends courage,<br>L’Espérance est un trésor.<br>Même le plus noir nuage<br>A toujours sa frange d’or. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Lorsque le soir se fait sombre<br>J’entends le petit oiseau<br>Gazouiller là-haut, dans l’ombre,<br>Sur sa branche au bord de l’eau.<br>Il me dit : Reprends courage<br>L’Espérance est un trésor.<br>Même le plus noir nuage<br>A toujours sa frange d’or. (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Mais il partit vers le Père<br>Et jamais ne le revis.<br>Je me penchai sur la terre<br>Et la contemplai ravi.<br>Car il n’est que l’Espérance<br>Pour animer notre cœur.<br>Qui de nos plus noires souffrances (bis)<br>Sait toujours être vainqueur.</div></div></section>","35":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La route est longue</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>La route est longue, longue, longue,<br>Marche sans jamais t’arrêter !<br>La route est dure, dure, dure,<br>Chante si tu es fatigué.</div><div class=\"verse\"><span class=\"verse-number\">1.</span>Tu marcheras des heures entières<br>Sous le dur soleil de l’été,<br>Tu marcheras dans la poussière<br>Que soulèveront tes souliers.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Tu traverseras des rivières<br>Sans crainte de voir s’écrouler<br>Le vieux pont de bois ou de pierres<br>Qu’ébranle ton pas cadencé.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Si ta route creusée d’ornières<br>Et si tu as peur de tomber,<br>Que ta voix se fasse plus claire<br>Et que ton pas soit plus léger.</div></section>","36":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Chef de patrouille</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse nonum\">(Sur l’air de Cadet-Roussel)</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Ah, ah, ah, oui vraiment<br>Chef de patrouille est épatant.</div><div class=\"verse\"><span class=\"verse-number\">1.</span>Chef de patrouille a deux galons (bis)<br>Et des insignes jusqu’aux talons (bis)<br>Et des badges plein les deux bras<br>On ne sait pas çui qu’il n’a pas.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>De ses dix doigts il sait tout faire (bis)<br>Une scie avec un fil de fer, (bis)<br>Et d’une demi-douzaine d’andouilles<br>Il fait la plus chic des patrouilles.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Quand il commence une inspection (bis)<br>Nous en tremblons tous d’émotion ; (bis)<br>Et quand il nous dit nos défauts,<br>Y a pas de vaseline entre les mots.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Si les petits ont marché trop, (bis)<br>Il les transporte sur son dos ; (bis)<br>Il les dorlote au campement,<br>C’est un grand frère, une maman.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Premier levé, dernier couché ; (bis)<br>Mais quand le sommeil l’a touché (bis)<br>Il ronfle auprès d’ ses compagnons<br>Comme toute une escadrille d’avions.</div></div></section>","37":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Chant des adieux</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Ce n’est qu’un au revoir, mes frères<br>Ce n’est qu’un au revoir<br>Oui, nous nous reverrons mes frères<br>Oui, nous nous reverrons.</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Faut-il nous quitter sans espoir,<br>Sans espoir de retour<br>Faut-il nous quitter sans espoir,<br>De nous revoir un jour ?</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Formons de nos mains qui s’enlacent<br>Au déclin de ce jour<br>Formons de nos mains qui s’enlacent<br>Une chaîne d’amour.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Aux scouts unis par cette chaîne<br>Autour des mêmes feux,<br>Aux scouts unis par cette chaîne<br>Ne faisons point d’adieux.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Car Dieu qui nous voit tous ensemble<br>Et qui va nous bénir,<br>Car Dieu qui nous voit tous ensemble<br>Saura nous réunir.</div></div></section>","38":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Je suis un peu fou</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Je suis un peu fou,<br>Sac au dos sans trêve,<br>J’emporte mon hibou,<br>Et mon banjo et mes rêves.</div><div class=\"verse\"><span class=\"verse-number\">1.</span>Ah ! qu’il fait bon là-bas, aller vivre à l’aventure,<br>Coucher sur le sol dur au fond des bois<br>Quand la lune se lèvera, mon hibou hululera<br>Tiou tiou la la la.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>J’emporterai là-bas, le grand vent de liberté<br>Loin des lieux habités au fond des bois<br>Quand la lune se lèvera ...</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Je sentirai là-bas, la grande joie d’exister<br>Sous le beau ciel d’été, au fond des bois<br>Quand la lune se lèvera ...</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Je pourrai vivre là de beaux rêves enchantés<br>Des jours pleins d’amitiés, au fond des bois<br>Quand la lune se lèvera ...</div></section>","39":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Souvenirs qui passent</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Souvenirs qui passent,<br>Adieu l’école et l’atelier,<br>Le camp les remplace<br>Avec ses feux à la veillée.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Ne tourne pas la tête,<br>Un scout regarde en avant. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Dans la pâle aurore<br>Nous quittons la ville endormie.<br>Ils dorment encore,<br>Nos pas les réveillent à demi.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Aux clartés brûlantes,<br>La halte n’arrive jamais.<br>Si mon copain chante,<br>Je chante avec lui pour l’aider.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Dans le soir qui baisse,<br>Je pense aux copains prisonniers.<br>J’en fais à ma tête,<br>Le soir je suis en liberté.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Dans la nuit profonde,<br>Je marche en rêvant au passé.<br>Mon copain me montre<br>Par où les anciens sont passés.</div></div></section>","40":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Ils étaient trois garçons</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Ils étaient trois garçons, (bis)<br>Leur chant, leur chant emplit ma maison. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Ils étaient si joyeux (bis)<br>Que je voulus partir avec eux. (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Amis où allez-vous ? (bis)<br>Je suis si triste et si las de tout… (bis)</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Ami viens avec nous, (bis)<br>Tu connaîtras des bonheurs plus doux. (bis)</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Tu connaîtras la paix, (bis)<br>Bien loin bien loin de ce qui est laid. (bis)</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Ils étaient venus trois, (bis)<br>Quatre s’en furent le cœur plein de joie ! (bis)</div></section>","41":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Vagabonde</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Vagabonde par le monde,<br>Pauvre cœur traînant ta peine profonde.<br>Vagabonde par le monde,<br>À la grâce de Dieu.</div><div class=\"verse\"><span class=\"verse-number\">1.</span>Ah qu’il est long le chemin,<br>Ah qu’il est long le chemin du ciel.<br>Ah ! Pour me tendre la main,<br>Le Seigneur va-t’il entendre mon appel ?</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Ah ! si le diable venait<br>Ah ! si le diable venait ce soir<br>Bien vite je le suivrais<br>Tellement mon cœur est triste et sans espoir.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Mais c’est Jésus qui viendra<br>Mais c’est Jésus qui viendra me voir<br>Mais c’est Jésus qui viendra<br>Comme naît un rayon d’or au ciel tout noir.</div></section>","42":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Vieux pèlerin</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Vieux pèlerin qui vagabonde<br>Je suis partout un étranger,<br>Mais je suis sûr qu’en l’autre monde<br>Dieu va m’offrir où me loger.<br>Je vais là-bas revoir mon Père,<br>Fini pour moi de cheminer.<br>À l’autre bord de la rivière<br>Maison à moi je vais trouver.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>J’achèverai bientôt ma route,<br>J’entends tout proche le Jourdain<br>La mort n’a rien que je redoute<br>J’y laisserai tous mes chagrins.<br>Je vais là-bas revoir ma Mère.<br>Près d’elle enfin me consoler<br>Sur l’autre bord de la rivière<br>À la maison me reposer.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Voici la fin de mes souffrances<br>Et le repos pour mon vieux corps,<br>Voici venir la récompense<br>Par Dieu promise à mes efforts.<br>Je vais là-bas parmi les anges<br>En oubliant mes vieux soucis<br>Passer mon temps à sa louange<br>Dire à Jésus sans fin - Merci !</div></section>","43":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La Bohème</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Chante et danse la Bohême, fa-ria, fa-ria, hô !<br>Vole et campe où Dieu la mène, fa-ria, fa-ria, hô ! .<br>Sans souci, au grand soleil<br>Coule des jours sans pareils.<br>Faria faria..</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Dans sa bourse rien ne pèse, fa-ria, fa-ria, hô !<br>Mais son cœur bat tout à l’aise, fa-ria, fa-ria, hô !<br>Point de comptes et point d’impôt,<br>Rien ne trouble son repos.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Quand la faim se fait tenace,<br>Dans les bois se met en chasse.<br>Tendre biche et prompt chamois<br>Lui feront un festin de roi.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Si la soif brûle en sa gorge,...<br>Au ravin la source est proche<br>Eaux plus claires que l’Asti<br>En vous tout le ciel sourit.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Sur la mousse ou dans la paille,<br>Trouve un lit fait à sa taille.<br>Cœur léger, Bohême dort<br>Que n’éveille aucun remords.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Et si mince est son bagage,<br>Que sans peine déménage.<br>Dans le ciel quand Dieu voudra<br>En chantant s’envolera.</div></div></section>","44":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le Chat noir</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Je cherche fortune<br>Tout au long du Chat Noir<br>Et au clair de la lune<br>A Montmartre le soir.</div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Avez-vous vu (bis)<br>Ces six sauvages (bis)<br>Qui débarquaient (bis)<br>Hier à Paris? (bis)<br>Ils étaient noirs (bis)<br>Comme du cirage (bis)<br>Depuis la tête (bis)<br>Jusqu’au nombril. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Chez l’boulanger :<br>Fais moi crédit,<br>N’aie donc pas peur<br>J’paierai samedi<br>Si tu n’veux pas<br>M’donner du pain<br>J’te fourre la tête<br>Dans ton pétrin.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Chez Monsieur l’Curé :<br>Fais moi crédit,<br>N’aie donc pas peur<br>J’paierai samedi<br>Si tu n’veux pas<br>Me confesser<br>J’te fourre la tête<br>Dans l’bénitier.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Chez Monsieur l’Maire :<br>Fais moi crédit,<br>N’aie donc pas peur<br>J’paierai samedi<br>Si tu n’veux pas<br>Me marier<br>J’te fourre la tête<br>Dans l’encrier.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Chez l’intendant :<br>Fais moi crédit,<br>N’aie donc pas peur<br>J’paierai samedi<br>Si tu n’veux pas<br>M’donner d’fayots<br>J’te fourre la tête<br>Dans tes cageots.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Chez le C.P. :<br>Fais moi crédit,<br>N’aie donc pas peur<br>J’paierai samedi<br>Si tu n’veux pas<br>Faire la corvée<br>Tant pis pour toi<br>Tu t’feras taper.</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Chez le second :<br>Fais moi crédit,<br>N’aie donc pas peur<br>J’paierai samedi<br>Si tu n’veux pas<br>Te décrasser<br>J’te fourre la tête<br>Dans les feuillées</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Chez le cul d’pat :<br>Fais moi crédit,<br>N’aie donc pas peur<br>J’paierai samedi<br>Si tu n’veux pas<br>Faire la vaisselle<br>Fais attention<br>A tes cuisselles.</div></div></section>","45":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Sur les monts</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Sur les monts, sur les monts,<br>Tout puissants, tout puissants<br>On n’entend... que le vent...<br>On ne voit... que le ciel...<br>On ne sent que le soleil<br>Au revoir, au revoir (bis)<br>Nous allons chercher le vent !</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>La route est dure sur la montagne<br>Mais nous allons plein de courage.<br>Dans l’ouragan nos cœurs qui chantent<br>Sont délivrés de leurs tourments.<br>Dans l’ouragan nos cœurs qui chantent<br>S’enivrent de joie et de vent !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Le pic se dresse loin de la terre<br>Et nous marchons vers la lumière,<br>Neige et soleil, montagnes aimées,<br>Dans la splendeur de l’ouragan<br>Neige et soleil, montagnes aimées<br>Soyez bénis pour vos présents !</div></div></section>","46":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">L'appel scout</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>De sous la tente au ras du sol,<br>Tihou, tihou, tire lire<br>Leur chanson a pris son vol. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Petite voix d’un petit gars...<br>Vers le ciel droit s’en alla. (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>C’est la clameur des scouts français<br>Criant qu’ils en ont assez</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Assez de peurs, de lâchetés.<br>France, irons te racheter!</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Et de mensonges, de déshonneurs,<br>Tihou, tihou, tire lire<br>Chasseront les vains sonneurs</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Et dans ce chant qu’elle entendra<br>France se reconnaîtra</div><div class=\"verse\"><span class=\"verse-number\">7.</span>France chrétienne au clair accent,<br>Fille aînée du Dieu tout-puissant</div><div class=\"verse\"><span class=\"verse-number\">8.</span>De sous la tente au ras du sol<br>L’appel scout a pris son vol.</div></div></section>","47":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Au camp</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Si tu aimes la grand’ route,<br>Le soleil et le grand vent,<br>Viens avec nous au camp.</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Tu verras la route est belle<br>Et les oiseaux, tout joyeux,<br>S’envolent à tire-d’aile<br>Vers le ciel tout bleu.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Mais si tu crois que la paille<br>C’est fait pour les animaux,<br>Alors ne crois pas qu’il faille<br>Mettre sac au dos.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Si tu crains les fourmis,<br>Les moustiques et les faucheux,<br>Vite repars dans ton lit :<br>Tu dormiras bien mieux.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Si tu aimes la cuisine<br>Au poivre et au beurre d’anchois,<br>Cherche dans « Joyeux Régime »<br>Un hôtel de ton choix.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Si tu aimes les baignoires<br>En céramique bleu foncé,<br>Tu feras sur le plongeoir,<br>Assez mauvais effet.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Et si enfin cette histoire<br>Loin de t’amuser t’ennuie,<br>Pour chasser les idées noires<br>Viens camper, ami !</div><div class=\"refrain\"><div class=\"refrain-label\">Dernier refrain :</div>Tu aimeras la grand’ route<br>Le soleil et le grand vent<br>Tu aimeras le camp.</div></div></section>","48":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">On n'en finira donc jamais</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>On n’en finira donc jamais<br>Avec ces espèces de « boy-scout » ;<br>On a beau s’enfuir en forêt,<br>On en rencontre sur toutes les routes.<br>Sur le boulevard et dans l’métro,<br>Ils font leur foire intéressante ;<br>Non, vrai, on n’dira jamais trop :<br>Assez d’cette race envahissante !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>D’abord, tout ça n’est pas français,<br>Soyons enfin patriotiques :<br>La France s’incarne en un béret,<br>Et dans un maillot d’gymnastique.<br>Mais eux, sont habillés d’kaki,<br>Pour qu’on n’voie pas qu’y s’roulent par terre,<br>Et ça fait gagner d’l’or à qui,<br>Sinon toujours à l’Angleterre ?</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Ils portent leurs valises sur leur dos,<br>Ça fait tort aux commissionnaires ;<br>Ils disparaissent sous leurs chapeaux,<br>Et les casquettes, c’est pour quoi faire ?<br>Ils ont des fichus à leur cou,<br>On les prend pour des demoiselles ;<br>Leurs chausses ne tiennent à rien du tout,<br>C’est la ruine des marchands d’bretelles !</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Moi j’sais le remède qu’il faudrait<br>Pour extirper toute cette engeance :<br>Suffit qu’les familles s’entendraient<br>Pour n’avoir plus qu’des filles en France ;<br>Alors, on s’rait tranquilles enfin,<br>Y’aurait plus d’danger sur les routes.<br>Encore, ça n’est pas bien certain,<br>Voilà qu’les filles se font « boy-scoutes » !</div></div></section>","49":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La voix des petits</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>C’est l’appel doux et puissant<br>De la jeunesse de France !<br>C’est l’appel doux et puissant<br>D’un million d’adolescents !</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Ecoutez l’appel lointain<br>Qui s’étend sous le ciel d’or,<br>Depuis la mer aux flots d’étain<br>Jusqu’aux tours du château fort !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Et ces enfants disent tous,<br>En confondant leur clameur :<br>Qui donc s’occupera de nous ?<br>Car sans chefs la France meurt !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Celui qui nous entendra,<br>Il aura tout notre cœur !<br>Et nous suivrons qui nous prendra,<br>Mauvais guide ou bon pasteur.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Ah ! Ne demeurez pas sourds<br>A l’appel que nous lançons !<br>Heureux qui sait user ses jours<br>Au service des garçons.</div></div></section>","50":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">L'aventure</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>J’ai fait un jour le sacrifice<br>De mon confort, de mes caprices ;<br>J’avais rêvé d’un coin paisible,<br>Quand tout à coup, irrésistible,<br>J’ai entendu l’appel de l’aventure,<br>Entre terre et ciel j’ai forcé l’allure.<br>Quand le vent souffle en rafales,<br>Plie le dos, mais ne romps pas !<br>Et sous la pluie qui dévale,<br>Tends le front, et ris tout bas. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Sentiers abrupts des escalades,<br>Chemins perdus des escapades,<br>Casse-croûte au bord d’une rivière,<br>Repos hâtif dans les bruyères...<br>J’ai joué le jeu de l’aventure,<br>Sous un ciel gris ou bleu, j’ai eu la vie dure.<br>Quand le vent souffle en tempête,<br>Réponds-lui toujours plus fort<br>Que c’est tous les jours la fête<br>Pour qui ne craint pas l’effort. (bis)</div></section>","51":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le camp nous appelle</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Le camp, le camp nous appelle,<br>Partons, partons pour le camp ! (bis)</div><div class=\"verse\"><span class=\"verse-number\">1.</span>Le camp nous appelle, voici l’hirondelle ;<br>Dans l’herbe nouvelle, partons pour le camp !<br>Vers les bois reverdis, vers les prés refleuris,<br>Vers la source qui chante au milieu des rochers !<br>Fuyons donc la ville, ses bruits inutiles,<br>Ses plaisirs futiles ; partons pour le camp !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Le camp nous appelle à l’ombre des chênes,<br>Le vent nous amène le souffle des champs.<br>C’est bien là que nos cœurs trouveront le bonheur ;<br>Dans le chant des oiseaux, dans la grâce des fleurs !<br>Saison de merveille, douceur sans pareille,<br>La terre s’éveille ; voici le printemps !</div></section>","52":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Être prêt</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Il faut savoir d’abord afin d’agir après ;<br>Depuis qu’un jour, j’ai dit aux douze : « soyez prêts »,<br>Rien ne sert l’ignorance et le « pas fait exprès ».</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Sois prêt comme un vrai scout, à faire à tout moment<br>Pour le prochain, ton frère, acte de dévouement ;<br>Et s’il ne te plaît pas, donne-toi doublement.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Sois prêt à recevoir qui te vient déranger,<br>Sois prêt à secourir le pauvre et l’étranger ;<br>Sois prêt comme un vrai scout à courir au danger.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Sois prêt à pardonner, car c’est prouver qu’on aime,<br>Sois prêt à faire honneur au Dieu de ton baptême,<br>Et si tu marches seul, à marcher droit quand même.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Sois prêt à t’immoler sur un banal autel,<br>Sois prêt comme un vrai scout à répondre à l’appel ;<br>Sois prêt à tout moment à partir pour le ciel.</div></section>","53":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Chante au danger</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Va fils de France,<br>Et sans tourner la tête,<br>Droit sur l’avenir<br>Fixe ton regard.</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Chante au danger et souris dans la peine<br>Telle est la loi des scouts vaillants<br>Et sans faiblir sur la grande route humaine<br>Les yeux bien clairs ils vont gaiement.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Comme autrefois les fiers guerriers de Gaule<br>Chantaient avant leurs durs combats<br>Ne craignant rien que voir sur leurs épaules<br>Crouler le ciel à grand fracas.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Chante au matin quand l’aube est radieuse<br>L’espoir d’un jour paisible et pur<br>Et quand la nuit autour d’un camp se creuse<br>Redis ton chant d’un ton plus sûr.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Au feu du soir où l’âme se repose<br>Tu ris joyeux de tout ton cœur<br>Mais quand l’effort comme un fardeau s’impose<br>Pour le porter souris sans peur.</div></div></section>","54":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Une fleur au chapeau</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Une fleur au chapeau,<br>A la bouche une chanson,<br>Un cœur joyeux et sincère,<br>Et c’est tout ce qu’il faut<br>A nous autres bons garçons<br>Pour aller au bout de la terre.</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Vous qui nous regardez passer<br>Dans le soleil ou sous l’orage,<br>Peut-être bien que vous pensez<br>Que nous avons bien du courage<br>Pour ainsi nous harasser<br>A courir le long des routes.<br>Vous ne savez pas ce que c’est,<br>Vous n’aurez jamais sans doute....</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Ah, comme nous serions heureux,<br>Si nous pouvions la vie entière,<br>Courir par les chemins ombreux,<br>Ou sur les routes familières,<br>Depuis les sommets neigeux<br>Jusqu’au bord des mers profondes ;<br>A travers nos cris joyeux,<br>Nous dirions au vaste monde :</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Hélas, il n’en est pas ainsi,<br>Et notre tâche est plus aride.<br>Mais il nous faut du cœur aussi,<br>Il faut aussi des bras solides<br>Pour combattre sans merci<br>La laideur et la paresse ;<br>A travers lutte et soucis,<br>Il nous faut garder sans cesse…</div></div></section>","55":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La loi scoute</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Ceux qui hochent la tête avec un air de doute<br>Lorsqu’ils te voient porter les trois doigts au chapeau,<br>C’est qu’ils ne savent pas, mon fils, combien est beau<br>Ce geste évocateur de ton humble loi Scoute.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Ton uniforme n’est pour eux qu’un travesti,<br>Ta loi qu’un abrégé de morale laïque,<br>Mais cette loi d’honneur, qui te rend véridique,<br>Elle doit plaire au Dieu qui n’a jamais menti.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Elle te veut loyal aux ordres que t’intime<br>Ton pays, tes parents, même un chef de hasard ;<br>Elle doit plaire au Dieu qui voulait qu’à César,<br>On rendît le denier de l’impôt légitime.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Bonne loi, qui t’oblige à servir ton prochain,<br>A partager à tous ton âme fraternelle ;<br>Je pense que Jésus reconnaîtrait en elle,<br>La loi du Bon Pasteur et du Samaritain.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Elle te dit d’aimer les fleurs et leurs corolles,<br>Dont les feux du soleil font jouer les émaux,<br>Elle te prêche la pitié des animaux ;<br>Elle doit plaire au Dieu diseur de paraboles.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Sans réplique obéir, ne rien faire à moitié,<br>Et comme un ouvrier, de tout être économe ;<br>N’est-ce pas le portrait du Fils de Dieu fait homme,<br>Qui mourut sur la croix quand tout fut consommé.</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Elle ose t’imposer la paix et le sourire,<br>Pour voiler ta maîtrise et ton renoncement ;<br>Elle doit plaire au Dieu qui sourit doucement,<br>Malgré l’intime horreur de son constant martyre.</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Elle te dit : Sois pur en ton corps et ton cœur,<br>Et que ton âme blanche, ainsi qu’un lys, émerge ;<br>Elle doit plaire au Dieu qui naquit de la Vierge,<br>Elle doit plaire au Dieu qui vit parmi les fleurs.</div><div class=\"verse\"><span class=\"verse-number\">9.</span>Laisse donc plaisanter, plaisanter est facile ;<br>S’ils devaient l’observer, ils n’en gloseraient plus.<br>Ta loi Scoute, elle est sainte et sent bon l’Evangile ;<br>Tu peux en être fier : c’est la Loi de Jésus !</div></div></section>","56":"<div class=\"song-pair\"><section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Notre Dame, Montjoie</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Notre Dame, Mont-joie ! (bis),<br>Mont-joie ! (bis)</div><div class=\"verse\"><span class=\"verse-number\">1.</span>Calvaire saint, croix du chemin,<br>Que le cri des scouts de France<br>Tende vers toi nos cœurs chrétiens ;<br>Vers toi, l’unique espérance.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Vallon riant, lointain fuyant,<br>Que le cri des scouts de France<br>Porte aux échos, lance à tous vents<br>Notre appel à la vaillance.</div></section><section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Sur mon honneur</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Sur mon honneur, et grâce à Dieu, (bis)<br>Je promets d’aimer toujours l’Eglise,<br>De lui garder ma foi soumise.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Sur mon honneur, et grâce à Dieu, (bis)<br>Je promets d’aimer toujours mes frères,<br>D’être pour eux l’ami sincère.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>... Je promets d’aider toute ma vie,<br>Et mon prochain, et ma patrie.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>... Je promets de vivre la loi scoute,<br>Pur et loyal quoiqu’il m’en coûte.</div></section></div>","57":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">L'alphabet scout</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Un jour la troupe campa A A A<br>La pluie se mit à tomber B B B<br>L’orage a tout cassé C C C<br>Faillit nous inonder A B C D</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Le chef s’mit à crier E E E<br>A son adjoint Joseph F F F<br>Fais nous vite à manger G G G<br>Les scouts sont sous les bâches E F G H</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Les oiseaux dans leur nid I I I<br>Les loups dans leur logis J J J<br>Discutent avec fracas K K K<br>Avec les hirondelles I J K L</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Joseph fit de la crème M M M<br>Et du lapin de garenne N N N<br>Et même du cacao O O O<br>Les amis quel souper ! M N O P</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Soyez en convaincus Q Q Q<br>Que la vie au grand air R R R<br>Fortifie la jeunesse S S S<br>Entretient la santé Q R S T</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Maint’nant qu’il ne pleut plus U U U<br>Les scouts vont se sauver V V V<br>Le temps est au beau fixe X X X<br>Pas besoin qu’on les aide X Y Z</div><div class=\"verse nonum\">Nous n’avons rien trouvé pour W.</div></div></section>","58":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Sortie d'hiver</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Tout au bord de la rivière,<br>Laissez-moi vous dire qu’il faisait glagla ;<br>Je suis tout à fait de l’avis d’ma grand-mère :<br>On n’couche pas dehors quand il fait c’temps là !</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Le départ me pince le cœur : c’est une aventure,<br>Etant donné la rigueur de la température !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Nous arrivons le nez bleu, les jambes violettes,<br>Sentant encore dans nos yeux, l’air de la bicyclette !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>A la fin de la veillée, serrés sous la tente,<br>Nous restons tout habillés, l’échine frémissante !</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Couchés, le froid nous poursuit, pas le moindre somme<br>Vaut bien mieux passer la nuit à se fendre la pomme !</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Au moment de se lever, le CP sévère,<br>Ne nous permet de garder qu’un slip sur le derrière !</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Je rentre me cuire la peau, dans l’eau d’la baignoire ;<br>M’enfiler du bouillon chaud et des suppositoires !</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Adieu, pour moi c’est trop dur, à bas le scoutisme !<br>J’irai sur la Côte d’Azur, l’été, faire du campisme !</div></div></section>","59":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La marche au camp</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse nonum\">(Sur l’air de La Madelon)</div><div class=\"verse\"><span class=\"verse-number\">1.</span>Entendez-vous, à travers l’espace immense,<br>La voix des mers, des montagnes, des forêts,<br>Qui nous appelle à jouir de nos vacances<br>Sur le rivage, ou sous les ombrages frais ?<br>Quittons la ville et ses usages,<br>Ses tramways et ses magasins,<br>Et vivons comme des sauvages<br>Sans être toutefois des gredins.<br>Sous la toile la nuit, au grand soleil, le jour,<br>Nous aurons des couleurs quand viendra le retour.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Allons, enfants, astiquez les gamelles,<br>Préparez tout, vos sacs et vos bâtons.<br>Des clous neufs à toutes les semelles,<br>Et de l’eau dans vos bidons.<br>Allons, enfants vite on se met en route,<br>On causera le soir en bivouaquant.<br>D’un pas vif, partons joyeux escoutes,<br>Vers le camp, vers le camp, vers le camp !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Ô cuisiniers, en vous est notre espérance,<br>Humbles héros qui n’avez pas peur du feu !<br>Souvenez-vous qu’en matière de bombance,<br>Un p’tit peu trop vaut beaucoup mieux que trop peu.<br>Ne renversez pas les marmites,<br>Ne marchez pas dans le saindoux,<br>Et lorsque vous faites des frites,<br>Ne conservez pas tout pour vous !<br>Si vos plats sont brûlés, gare à la Cour d’Honneur,<br>La Loi condamne à mort tous les empoisonneurs !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Si vous voulez conserver l’âme légère,<br>Dévouez-vous, c’est encor le seul moyen,<br>Et si le chef a besoin d’un volontaire,<br>N’attendez pas qu’ait bougé votre voisin.<br>Cuistots, épluchez les carottes,<br>Forestiers, fendez-nous du bois,<br>Tailleurs, rapiécez nos culottes,<br>Ambulanciers pansez nos doigts.<br>Il n’est que deux tireurs qui soient bannis du camp :<br>Les tireurs de carottes et les tireurs au flanc.</div></div></section>","60":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Chantons nos montagnes</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse nonum\">( Sur l’air de Aquellos Mountagnos )</div><div class=\"verse\"><span class=\"verse-number\">1.</span>Chantons nos montagnes<br>Et leurs noms fameux,<br>Inviolables gardes<br>Du sol des aïeux.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Ma Troupe, ravie<br>De ton camp d’été,<br>Campe dans la Vie<br>Et dans la Beauté.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Blanches Pyrénées,<br>Alp’ au front neigeux,<br>Tout illuminées<br>Des splendeurs des cieux.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Ô Vosges fidèles,<br>Vous avez nos cœurs,<br>Fidèles citadelles<br>De nos défenseurs.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Ô Puys de l’Auvergne,<br>Donjon du Pays,<br>Sommets des Cévennes,<br>Soyez tous bénis.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Montagnes puissantes,<br>Par vous l’on prie mieux,<br>Et gravir vos pentes<br>C’est monter vers Dieu.</div></div></section>","61":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le Foulard vert</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse nonum\">( Sur l’air de Les petits mouchoirs de Cholet )</div><div class=\"verse\"><span class=\"verse-number\">1.</span>C’était un petit Scout de France<br>Avec un joli foulard vert.<br>Dans une virile adolescence,<br>Droit et pur, le Scout de France,<br>D’un jeune prince il avait l’air,<br>Avec son joli foulard vert.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Possédant badge d’ambulance,<br>De sa croix-rouge était très fier,<br>Et pansait, plein de vigilance,<br>Les blessés, le Scout de France,<br>En les bandant comme un expert<br>Avec son joli foulard vert.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Malgré toute son innocence,<br>D’un vieil escoute avait le flair.<br>Fit plus d’une reconnaissance<br>Sur le front, le Scout de France ;<br>Et le fanion qui fendait l’air,<br>C’était son joli foulard vert !</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Fut surpris durant une avance<br>Par un officier de landwehr :<br>« Renseigne-nous sinon vengeance ! »<br>Fut muet, le Scout de France !<br>On le trouva le cœur ouvert,<br>Les yeux bandés du foulard vert.</div></div></section>","62":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les cuistots</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Les cuistots, c’est de la racaille, des empoisonneurs, des brigands ;<br>N’allez pas croire que je raille, je vais le prouver à l’instant.</div><div class=\"verse\"><span class=\"verse-number\">1.</span>Qui donc, en huit jours, sans vergogne,<br>Grossit de plus de dix kilos ?<br>Ceux qui n’aiment pas la besogne,<br>Et puis ces satanés cuistots !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Quand ils vous annoncent une tartine,<br>Vous n’recevez qu’un bout d’pain sec ;<br>Ou c’est un vieux morceau d’bottine<br>Qu’ils vous serv’nt en guise de bifteak.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Si l’on est cinquante au lieu d’treize,<br>Le cuistot n’s’en f’ra pas du tout :<br>Il ajoute, ne vous en déplaise,<br>Vingt litres d’eau dans le ragoût !</div></section>","63":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Il était une charrette</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Il était une charrette, Tirez les gars ! (bis)<br>Qui n’avait jamais voyagé, Tirez les gars sur les ficelles !<br>Qui n’avait jamais voyagé, Tirez les gars ça va marcher !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>À son premier voyage, Tirez les gars (bis)<br>Le moyeu de droit’ s’est faussé,...</div><div class=\"verse\"><span class=\"verse-number\">3.</span>À son deuxièm’ voyage, ...<br>C’est le brancard gauch’ qu’a cassé,...</div><div class=\"verse\"><span class=\"verse-number\">4.</span>À son troisième voyage,...<br>Tout le bazar s’est fracassé,...</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Deux cents kilos d’ bagages,...<br>Ont fait l’ plongeon dans le fossé,...</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Tous les scouts à la nage,...<br>N’ont jamais pu rien repêcher...</div><div class=\"verse\"><span class=\"verse-number\">7.</span>On n’ sauva du naufrage,...<br>Qu’un petit moulin à café...</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Pour compenser l’ dommage,...<br>Un’ nouvelle charrett’ fut donnée...</div><div class=\"verse\"><span class=\"verse-number\">9.</span>Ell’ promit d’être sage...<br>Et de n’ jamais recommencer...</div><div class=\"verse\"><span class=\"verse-number\">10.</span>Mais au premier voyage... etc</div></div></section>","64":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Marchons dans le vent</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Marchons dans le vent<br>Du matin levant<br>Marchons dans le vent<br>Chantant gaiement.<br>Marchons dans le vent<br>Jusqu’au soir couchant,<br>Marchons dans le vent chantant.</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Rosée perlant les prés,<br>Cri d’alouette au tournant,<br>Cheveux au vent léger,<br>Derrière de lapin blanc...</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Noisettes du chemin<br>Qu’on arrache en passant,<br>Eau fraîche au creux des mains<br>Et « Bonjour ! » en passant.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Grillons qui nous guettez<br>Au creux des chemins roux<br>L’angélus a sonné<br>Ma mie rentrons chez nous.</div></div></section>","65":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Chant de Troupe</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Dans nos coeurs la joie de servir ; dans nos corps le cran des soldats ;<br>Dans nos âmes de grands désirs : Tout à Dieu et rien à soi !<br>Si l’ennemi semble trop fort, ami, que rien ne t’épouvante,<br>Tout passe, et Dieu est bien plus fort<br>Que ces démons qui te hantent...</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Pour le Christ, pour l’Eglise, pour la France... Par saint Elme que Dieu nous garde !<br>Eclaireurs, soyons prêts à servir... Le coeur pur et l’âme gaillarde !<br>Sans mentir, sans rougir, sans subir, sans trembler<br>Nous jurons Seigneur de te servir ! Que ta Croix soit notre étendard !<br>Prends nos âmes, fortifie-les, inonde-les du feu par lequel tu feras de nous des héros.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Ô Seigneur, réveillez en nous, l’ardeur des soldats endormis,<br>Et qu’éloignés des compromis, nous nous donnions tout à vous !<br>Que la mort nous trouve fidèles, chantant toujours notre prière ;<br>Les yeux fermés, le coeur ouvert, les mains tendues vers le ciel...</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Garçon, que jamais ne te blessent, les vains plaisirs et leurs souillures.<br>Et souviens-toi que la jeunesse demeure si le coeur est pur.<br>Que dans les tentes éternelles, où ne nuit plus l’esprit malin,<br>La voix du maître nous appelle au camp qui n’a pas de fin.</div></section>","66":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La joie scoute</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Frères scouts, le soleil dore les tentes,<br>Ses rayons, sur les ondes miroitantes,<br>Font jaillir dans les roseaux<br>Les chansons de mille oiseaux. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Donc en route, et que sonne la campagne !<br>Clair et vif, le pipeau nous accompagne.<br>Faut-il des difficultés<br>Pour qu’un scout aime à chanter ? (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Que la pluie sur nos tentes tambourine,<br>Que le vent s’engouffre en nos pèlerines ;<br>Nos refrains plus éclatants
