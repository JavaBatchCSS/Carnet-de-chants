hutiste, voilà l’orage !<br>Montrons-nous dignes des anciens d’Algérie ;<br>Rien n’est trop dur pour un gars de notre âge<br>S’il est para de Bercheny cavalerie.</div></section>","178":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Adieu du bataillon de choc</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>La route vers l’inconnu est toujours bien venue,<br>Le but est devant nous, braquons les armes.<br>La défaillance exclue, plus rien ne compte plus,<br>Pour nous c’est le devoir, pour vous les larmes !</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>L’heure a sonné, adieu belle fille,<br>Nous repartons vers notre destin.<br>Loin du pays, loin de la famille,<br>Nous nous en allons par les chemins.<br>Le cœur léger avec un sourire,<br>Les yeux fixés sur l’horizon.<br>Les compagnies en marche s’entre-admirent,<br>Chantons en chœur à pleins poumons :<br>«En pointe toujours !», ce cri nous appelle,<br>Nous sommes ici taillés d’un bloc.<br>Tous en avant, adieu ô ma belle,<br>Adieu du bataillon de choc.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Debout les volontaires, chasseurs et légionnaires,<br>Les parachutes sont prêts pour l’aventure.<br>Le Dakota attend, ne perdons pas de temps,<br>Restons unis et la victoire est sûre.</div></div></section>","179":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Contre les Viets</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Contre les Viets, contre l’ennemi,<br>Partout où le combat fait signe,<br>Soldats de France, soldats du pays,<br>Nous remonterons vers les lignes.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Ô légionnaires, le combat qui commence,<br>Met dans nos âmes, enthousiasme et vaillance.<br>Peuvent pleuvoir grenades et gravats,<br>Notre victoire en aura plus d’éclat. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Et si la mort nous frappe en chemin,<br>Si nos doigts sanglants se crispent au sol,<br>Un dernier raid, adieu et demain<br>Nous souhaiterons faire école.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Malgré les balles, malgré les obus,<br>Sous les rafales et sous les bombes,<br>Nous avançons vers le même but,<br>Dédaignant l’appel de la tombe.</div></section>","180":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Ceux du Liban</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Dans la boue, les sillons, sous le ciel gris nous marchons.<br>Malgré la fatigue et la pluie, malgré la famine et l’ennui.<br>Nous veillons et nous attendons que pour nous gronde le canon.<br>Si demain il nous appelait, nous partirions sans un regret.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>La France pleure ses enfants, tombés là-bas au Levant<br>Nous garderons leur souvenir, comme eux nous voulons bien souffrir.<br>Nos anciens du Liban, nous précèdent en avant,<br>Vivant pour le même horizon, pour la France nous servirons.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Sous le soleil brûlant, montaient nos rires et nos chants.<br>Notre sourire était la paix pour tous ces enfants qui souffraient<br>Partout des orages d’acier, sur terre se sont déchaînés<br>Pour que sous un ciel bas et noir, à jamais meurt tout espoir.</div></section>","181":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Debout les paras !</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Debout les paras, il est temps d’s’en aller,<br>Sur la route au pas cadencé.<br>Debout les paras, il est temps de sauter,<br>Sur notre Patrie bien aimée.<br>Dans les prés, dans les champs,<br>Les pépins dans le vent,<br>La mitraille accompagnera nos chants.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Parachutiste, vois, le ciel est clair<br>Serre les dents, il est temps de sauter.<br>Le stick est prêt, le stick est prêt,<br>Tout le monde ira, tout le monde ira.<br>Pas un ne se, pas un ne se, dégonflera.<br>Parachutiste, vois, le ciel est clair,<br>Serre les dents, il est temps de sauter.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Pour venir avec nous, pas besoin d’être gros,<br>Il suffit d’avoir du culot.<br>Pour venir avec nous, pas besoin d’être grand,<br>Il suffit d’avoir un peu de cran.<br>C’est trop dur vous direz,<br>C’est trop fort vous penserez,<br>Allons donc un peu de bonne volonté.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Allons, les copains, avec tout le barda,<br>Dans l’avion qui mène au combat.<br>Surtout les copains, n’oubliez pas le pépin,<br>Car la haut y a pas de magasin.<br>Mais ne vous en faites pas,<br>Même s’il ne s’ouvre pas,<br>On se retrouvera quand même tous en bas.</div></div></section>","182":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">En passant par la portière</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Il est là-bas en Algérie,<br>Un régiment dont les soldats, dont les soldats.<br>A chaque instant risquent leur vie.<br>Parachutiste souviens-toi, oui souviens-toi.<br>Pour faire partie de cette élite,<br>Il faut bien être un peu cinglé, un peu cinglé.<br>Il faut surtout pas s’fair’ de bile,<br>Savoir bien boire et bien manger, et bien manger.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Et après tout qu’est-ce que ça fout<br>Et on s’en fout, la, la, la...<br>En passant par la portière,<br>Parachutiste souviens-toi, oui souviens-toi.<br>Qu’un jour il pourrait se faire<br>Malgré toi, oui, malgré toi, la, la, la...<br>Qu’après une chute libre<br>Tu auras cessé de vivre, la, la, la...<br>Entorché dans l’atmosphère<br>Tu tomberas comme une pierre.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>J’ai vu mourir un pauvre gosse,<br>A peine âgé de dix-huit ans, de dix-huit ans.<br>Son parachute s’est mis en torche.<br>Il est mort en criant Salan, criant Salan.<br>Je lui est fermé les paupières,<br>Recueilli son dernier soupir, dernier soupir.<br>Et j’ai écrit à sa pauv’ mère,<br>Comme un para savait mourir, savait mourir.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Et comme on a jamais eu d’veine,<br>Un jour l’pépin s’ouvrira pas, s’ouvrira pas.<br>Sur cette merd’ de terre Africaine,<br>A cent à l’heure tu t’écraseras, tu t’écraseras.<br>On ramassera tes côt’lettes,<br>Dans un grand sac à effets chauds, à effets chauds.<br>On dira saperlipopette,<br>Ce gazier-là n’a pas eu d’pot, n’a pas eu d’pot.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>On te mettra entre quatr’planches ,<br>Entortillé dans ton pépin, dans ton pépin.<br>Au cimetière de Maison Blanche<br>T’auras la gueule de tes copains, de tes copains.<br>T’auras les honneurs militaires<br>Et l’on mettra sur ton tombeau, sur ton tombeau,<br>La croix de guerre réglementaire.<br>Et ce jour sera le plus beau, oui le plus beau.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Mon père était parachutiste<br>Dans les armées d’Napoléon, d’Napoléon<br>Il fit la campagne d’Egypte<br>Pour éprouver des sensations des sensations.<br>Parachuté au-d’sus du Caire,<br>Son parachute ne s’ouvrit pas, ne s’ouvrit pas.<br>Un mamelouk et son cimeterre<br>Lui firent si peur qu’il remonta, qu’il remonta.</div></div></section>","183":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La Galette</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Noble galette, que ton nom<br>Soit immortel en notre histoire<br>Qu’il soit anobli par la gloire<br>D’une vaillante Promotion !<br>Et si dans l’avenir<br>Ton nom vient à paraître<br>On y joindra peut-être<br>Notre grand souvenir.<br>On dira qu’à Saint-Cyr,<br>Où tu parus si belle<br>La Promotion nouvelle<br>Vient pour t’ensevelir.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Toi qui toujours dans nos malheurs<br>Fus une compagne assidue,<br>Toi qu’hélas nous avons perdue,<br>Reçois le tribut de nos pleurs ;<br>Nous ferons un cercueil<br>Où sera déposée<br>Ta dépouille sacrée.<br>Nous porterons ton deuil,<br>Et si quelqu’un de nous<br>Vient à s’offrir en gage,<br>L’Officier en hommage<br>Fléchira le genou.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Amis, il faut nous réunir<br>Autour de la Galette sainte<br>Et qu’à jamais dans cette enceinte,<br>Règne son noble souvenir.<br>Que ton nom tout puissant<br>S’il vient un jour d’alarme,<br>A cinq cent frères d’armes<br>Serve de ralliement :<br>Qu’au jour de la conquête<br>A défaut d’étendard,<br>Nous ayons la Galette<br>Pour fixer nos regards.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Soit que le souffle du malheur<br>Sur nos têtes se déchaîne,<br>Soit que sur la terre africaine<br>Nous allions périr pour l’honneur,<br>Ou soit qu’un ciel plus pur<br>Reluire sur nos têtes,<br>Et que loin des tempêtes<br>Nos jours soient tous d’azur<br>Oui, tu seras encore,<br>O Galette sacrée,<br>La mère vénérée<br>De l’épaulette d’or.</div></div></section>","184":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Etre et durer</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Si tu crois en ton destin,<br>Si tu crois aux lendemains,<br>L’ami faut pas hésiter,<br>Prends ton sac et viens sauter.<br>Avec nous tu pourras marcher.<br>Tu pourras être et durer.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Pour aimer et pour souffrir,<br>Y a pas deux moyens de trouver tout ça<br>Pour toi sans aucun doute :<br>Viens chez les paras !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Si tu retournes au Pays<br>Si tu vas revoir ta mie<br>Pour nous tu lui conteras<br>Nos chants, nos cris et nos combats,<br>Mais qu’elle t’attende ou qu’elle t’oublie<br>Pense à ceux qui sont là-bas.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Si tu vas au bout du risque,<br>Si tu restes sur la piste,<br>La pist’ méchante et cruelle<br>La piste sauvage et belle<br>Mourant, tu sauras l’aimer<br>Car elle t’aura tout donné.</div></div></section>","185":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Chant du 2ème REP</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>La Légion marche vers le front ,<br>En chantant nous vaincrons.<br>Héritiers de ses traditions,<br>Nous aussi nous marchons.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Nous sommes les hommes des troupes d’assaut,<br>Soldats de la vieille Légion,<br>Demain brandissant nos Drapeaux<br>En vainqueurs nous défilerons.<br>Nous n’avons pas seulement des armes,<br>Mais Saint Michel marche avec nous.<br>Ha, ha, ha, ha, ha, ha.<br>Car nos aînés de la Légion<br>Se battent là-bas, nous emboîtons le pas.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Pour ce destin de chevalier,<br>Honneur, fidélité,<br>Nous sommes fiers d’appartenir<br>A ceux qui vont mourir.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Fidélité est notre loi,<br>Lutter pour notre foi,<br>Notre fierté de chevalier,<br>Notre honneur de soldat.</div></div></section>","186":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Pour nos morts</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Heureux ceux qui sont morts<br>Pour la terre charnelle.<br>Mais pourvu que ce fut<br>Dans une juste guerre.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Heureux ceux qui sont morts<br>Pour quatre coins de terre.<br>Heureux ceux qui sont morts<br>D’une mort solennelle.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Heureux ceux qui sont morts<br>Dans les grandes batailles.<br>Couchés dessus le sol,<br>A la face de Dieu.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Heureux ceux qui sont morts<br>Dans un dernier haut lieu<br>Parmi tout l’appareil<br>Des grandes funérailles.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Heureux ceux qui sont morts<br>Car ils sont retournés<br>Dans la première argile<br>Et la première terre.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Heureux ceux qui sont morts<br>Dans une juste guerre<br>Heureux les épis mûrs<br>Et les blés moissonnés.</div></div></section>","187":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Sous le soleil brûlant d'Afrique</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Sous le soleil brûlant d’Afrique<br>Cochinchine, Madagascar,<br>Une phalange magnifique<br>A fait flotter nos étendards.<br>Sa devise Honneur et Vaillance<br>Forme des soldats valeureux,<br>Son drapeau, celui de la France<br>Est un emblème des plus glorieux.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Vive la Légion étrangère !<br>Et quand défilent les képis blancs<br>Si leur allure n’est pas légère<br>Ils portent tous tête haute et fière,<br>Et s’élançant dans la fournaise<br>Le cœur joyeux, jamais tremblants,<br>Au son de notre Marseillaise<br>Savent combattre les képis blancs.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>C’est une chose d’importance<br>La discipline à la Légion,<br>L’amour du chef, l’obéissance<br>Sont de pure tradition.<br>Et pour notre France chérie<br>Tous ces étrangers bravement<br>Viennent défendre notre Patrie<br>Avec honneur et dévouement.</div></div></section>","188":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Sidi-Brahim</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Francs Chasseurs, hardis compagnons,<br>Voici venir le jour de gloire,<br>Entendez l’appel du clairon<br>Qui vous présage la victoire,<br>Volez, intrépides Chasseurs,<br>La France est là qui vous regarde,<br>Quand sonne l’heure du combat,<br>Votre place est à l’avant-garde !</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>En avant ! Braves bataillons,<br>Jaloux de votre indépendance<br>Si l’ennemi vers nous s’avance,<br>Marchons ! Marchons ! Marchons !<br>Serrons les rangs<br>Mort aux ennemis de la France !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Quand votre pied rapide et sûr<br>Rase le sol, franchit l’abîme,<br>On croit voir à travers l’azur<br>L’aigle voler de cime en cime,<br>Vous roulez en noirs tourbillons<br>Et parfois, limiers invincibles,<br>Vous vous couchez dans les sillons<br>Pour vous relever plus terribles !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Aux champs où l’oued Had suit son cours<br>Sidi-Brahim a vu nos frères<br>Un contre cent lutter trois jours<br>Contre des hordes sanguinaires.<br>Ils sont tombés silencieux<br>Sous le choc comme une muraille.<br>Que leurs fantômes glorieux<br>Guident nos pas dans la bataille !</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Héros aux courages inspirés,<br>Vos pères conquirent le monde,<br>Et le monde régénéré<br>En garde la trace féconde.<br>Nobles aïeux, reposez-vous,<br>Dormez dans vos couches austères,<br>La France peut compter sur nous,<br>Les fils seront dignes des pères.</div></div></section>","189":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Verdun ! On ne passe pas</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Un aigle noir a plané sur la ville,<br>Il a juré d’être victorieux,<br>De tous côtés, les corbeaux se faufilent<br>Dans les sillons et dans les chemins creux.<br>Mais tout à coup, le coq gaulois claironne :<br>Cocorico, debout petits soldats !<br>Le soleil luit, partout le canon tonne,<br>Jeunes héros, voici le grand combat.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Et Verdun, la victorieuse,<br>Pousse un cri que porte là-bas<br>Les échos des bords de la Meuse,<br>Halte là ! on ne passe pas...<br>Plus de morgue, plus d’arrogance,<br>Fuyez barbares et laquais,<br>C’est ici la porte de France,<br>Et vous ne passerez jamais.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Les ennemis s’avancent avec rage,<br>Énorme flot d’un vivant océan,<br>Semant la mort partout sur son passage,<br>Ivres de bruit, de carnage et de sang ;<br>Ils vont passer... quand relevant la tête,<br>Un officier dans un suprême effort,<br>Quoique mourant, crie : A la baïonnette<br>Hardi les gars debout, debout les morts !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Mais nos enfants, dans un élan sublime,<br>Se sont dressés ; et bientôt l’aigle noir,<br>La rage au cœur impuissant en son crime,<br>Vit disparaître son suprême espoir.<br>Les vils corbeaux devant l’âme française<br>Tombent sanglants, c’est le dernier combat<br>Pendant que nous chantons la Marseillaise,<br>Les assassins fuient devant les soldats.</div></div></section>","190":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">L'Alsace et la Lorraine</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>France à bientôt ! Car la Sainte Espérance<br>Emplit nos cœurs en te disant adieu.<br>En attendant l’heure de la délivrance,<br>Pour l’avenir nous allons prier Dieu.<br>Nos monuments, où flottent leurs bannières,<br>Semblent porter le deuil de ton drapeau.<br>France, entends-tu la dernière prière<br>De tes enfants couchés dans leur tombeau ?</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Vous n’aurez pas l’Alsace et la Lorraine,<br>Et malgré vous, nous resterons français.<br>Vous avez pu germaniser la plaine,<br>Mais notre cœur vous ne l’aurez jamais.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Eh quoi ! nos fils quitteraient leur chaumière<br>Et s’en iraient grossir vos régiments<br>Pour égorger la France, notre mère ?<br>Vous armeriez le bras de ses enfants ?<br>Ah! Vous pouvez leur confier des armes,<br>C’est contre vous qu’elles leur serviront<br>Le jour où las de voir couler nos larmes,<br>Pour nous venger leurs bras se lèveront.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Ah ! jusqu’au jour où, drapeau tricolore,<br>Tu flotteras sur nos murs exilés.<br>Frères étouffons la haine qui nous dévore<br>Et fait bondir nos cœurs inconsolés.<br>Mais le grand jour où la France meurtrie<br>Reformera ses nouveaux bataillons<br>Au cri sauveur jeté par la Patrie<br>Hommes, enfants, femmes, nous reprendrons.</div></div></section>","191":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Marche des tirailleurs</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Six canons balayaient la plaine<br>Crachant la mort sur nos lignards.<br>«Mes enfants», dit le Capitaine<br>«Faites moi taire ces braillards !»<br>Cette réplique étant très nette,<br>Les turcos froncent les sourcils<br>Et puis au bout de leurs fusils<br>Ils ajustent leurs baïonnettes.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Les turcos, les turcos sont de bons enfants,<br>Les turcos, les turcos sont de bons enfants,<br>Mais il ne faut pas qu’on les gène<br>Sans cela la chose est certaine :<br>Les turcos deviennent méchants.<br>Ça n’empêche pas le sentiment<br>Les turcos, les turcos sont de bons enfants.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Les turcos sont au moins cinquante<br>Et ces héros sont beaux à voir.<br>En mourant leur bouche plaisante<br>Les turcos sont des Français noirs.<br>Ils sautent dans l’herbe sanglante<br>Et là ils grimpent à l’assaut<br>Et quand ils arrivent en haut<br>Les turcos ne sont plus que trente !</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Alors sans tambours ni trompettes<br>On voit bondir nos tirailleurs,<br>En un moment la place est nette<br>Il ne reste plus d’Artilleurs ;<br>Et quand ils cessent de se battre<br>Les six canons se trouvent pris,<br>Mais eux tous sanglants et meurtris<br>Les turcos ne sont plus que quatre !</div></div></section>","192":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">L'Edelweiss</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>L’air pur de la montagne,<br>Nous rend fiers et joyeux..<br>Gravissant la rocaille,<br>Nous grimpons jusqu’aux cieux.<br>Il s’agit de savoir<br>Si l’ennemi dangereux,<br>N’a pas bien avant nous déjà,<br>Pris le point précieux.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>C’était un Edelweiss,<br>Un gentil Edelweiss,<br>Qui nous guidait là-haut<br>Pour un dernier assaut.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Grâce à notre courage,<br>Nous sommes arrivés.<br>De l’ennemi plus de trace,<br>Nous sommes victorieux.<br>Mais avant de partir,<br>Ne serait-ce pas gai,<br>D’orner de ce joli bouquet<br>Nos lourds casques d’acier ?</div></div></section>","193":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Hymne à Saint Michel</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Ô Michel, patron des paras<br>Trempe nos cœurs de hardiesse,<br>Conduis nos pas joyeux<br>Pour le devoir tout près de Dieu.<br>Guide-nous dans les durs sentiers<br>Et garde-nous de nos détresses.<br>O Michel, patron des paras<br>Trempe nos cœurs de hardiesse.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Ô Michel, ange chevalier<br>Lave nos cœurs dans l’onde pure,<br>Fais-nous loyaux et droits<br>Et valeureux en les tournois,<br>Pour servir fais-nous être prêts<br>Et défends-nous de tout parjure.<br>O Michel, ange chevalier<br>Lave nos cœurs dans l’onde pure.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Ô Michel, ange des guerriers<br>Arme nos cœurs de sainte audace.<br>Ta main vengea les cieux,<br>Arrache-nous aux camps peureux<br>Laisse-nous résolus et fiers<br>Sangle nos chairs dans les cuirasses.<br>O Michel, ange des guerriers<br>Arme nos cœurs de sainte audace.</div></div></section>","194":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les adieux suisses</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Nous étions trop heureux mon amie,<br>Nous avions trop d’espoir et d’amour,<br>Nous croyions nous aimer pour la vie<br>Mais hélas les beaux jours sont si courts. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Le bonheur dure peu sur la terre.<br>Entends-tu tout là-bas le tambour ?<br>Mon doux cœur je m’en vais à la guerre,<br>Ne crains rien jusqu’au jour du retour. (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>L’ennemi a passé nos frontières,<br>Il a pris nos maisons et nos champs.<br>Reprenons le pays de nos pères,<br>Il faut vivre ou mourir bravement. (bis)</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Mes amis si Dieu veut que je meure<br>Retirez cet anneau de mon doigt.<br>Mon amie est là-bas qui me pleure<br>Dites-lui cette bague est pour toi. (bis)</div></div></section>","195":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Chant du légionnaire tombé</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Soldat ne pleure pas marchant dans la nuit triste et déserte (bis)<br>En vain l’ami nous t’avons attendu sur tout le sentier. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Seul le vent encore soupire ta chanson parmi les fleurs. (bis)<br>Nature qui console ce triste tombeau où tu reposes. (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Sur tous les sentiers où nous t’allons, nous t’avons cherché (bis)<br>Et si même les tiens t’ont oublié nous chantons pour toi. (bis)</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Larme, perle de sang, étoile tombée dans cette guerre. (bis)<br>Sentier de feu et de victoire pour ta garde légionnaire. (bis)</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Le vent souffle sur les mémoires vers le camp triste et amer. (bis)<br>Nous te pleurerons toujours légionnaire, dors pour toujours. (bis)</div></section>","196":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Cravate verte et képi blanc</div><div class=\"song-actions\"></div></div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Cravate verte et képi blanc<br>Où t’en vas-tu gai légionnaire ?<br>Je vais où le plaisir m’attend.<br>Le ciel est pur, la lune éclaire<br>Bel Abbès de reflets d’argent,<br>Et le vin rougeoie dans mon verre.<br>Comme une joie d’adolescent<br>Loin des locaux disciplinaires,<br>Des gardes, des rassemblements.<br>Buvant sec, faisant bonne chère,<br>Il s’en va le gai légionnaire.<br>Cravate verte, képi blanc.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Cravate verte et képi blanc<br>Où t’en vas-tu gai légionnaire ?<br>Je vais où ma belle m’attend.<br>Elle est fidèle, elle est sincère,<br>Elle est ma joie et mon tourment.<br>Lorsque dans mes bras je la serre,<br>Je suis heureux tout bêtement.<br>Mon amour n’est pas un mystère,<br>Et son coeur tout neuf me le rend<br>Plus heureux qu’un bon milliardaire.<br>Il s’en va le gai légionnaire.<br>Cravate verte, képi blanc.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Cravate verte et képi blanc<br>Où t’en vas-tu gai légionnaire ?<br>Je vais où le baroud m’attend.<br>C’est mon devoir de faire la guerre,<br>Partout où l’ennemi m’attend.<br>Nord ou sud toujours sur la terre,<br>Notre drapeau va palpitant<br>Tout couvert d’exploits légendaires.<br>La joie au coeur, la rage aux dents<br>Sur la voie tracée par nos pères.<br>Il s’en va le gai légionnaire.<br>Cravate verte, képi blanc.</div></div></section>","197":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">L'enfant de Strasbourg</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Petit Papa c’est donc la mi-carême<br>Car te voilà déguisé en soldat<br>Dis-moi Papa, dis-moi que c’est pour rire<br>Ou pour faire peur aux tout petits enfants. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Non, non ma fille je pars pour la patrie<br>C’est mon devoir tous les Papas s’en vont<br>Embrassez-moi toi et ta mère chérie<br>Je reviendrai bien vite à la maison. (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Pourquoi Maman cett’ lettre et cett’ médaille<br>Que le facteur vient de nous apporter ?<br>Dis-moi maman tu pleures et tu défailles<br>A-t-on tué ton mari adoré ? (bis)</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Oui mon enfant tu n’auras plus de père<br>Pleurons ensemble car nous la haïssons<br>Cette guerr’ atroce qui fait pleurer les mères<br>Et tue les pères des petits anges blonds. (bis)</div><div class=\"verse\"><span class=\"verse-number\">5.</span>La neige tombe aux marches de l’église<br>Là est assise une enfant de Strasbourg<br>Elle reste là malgré le froid la bise<br>Elle reste là malgré la fin du jour. (bis)</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Un homme passe, à la fillette donne,<br>Elle reconnaît l’uniforme allemand,<br>Elle refus’ l’aumône qu’on lui offre<br>A l’ennemi, elle dit bien fièrement : (bis)</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Gardez l’aumône, je garde la souffrance,<br>Soldat prussien passez votre chemin,<br>Car moi je suis une enfant de la France,<br>A l’ennemi je ne tends pas la main. (bis)</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Mon père est mort sur un champ de bataille<br>Je n’ai pas vu l’ombre de son cercueil,<br>Blessé à mort par l’une de vos balles,<br>C’est la raison de ma robe de deuil. (bis)</div><div class=\"verse\"><span class=\"verse-number\">9.</span>Tout en priant dans cette cathédrale<br>Ma mère est morte sous le porche écroulé,<br>Frappée à mort par l’une de vos balles,<br>Frappée à mort par l’un de vos boulets. (bis)</div><div class=\"verse\"><span class=\"verse-number\">10.</span>Vous avez eu mon père et puis ma mère<br>Vous avez tué des milliers de Français,<br>Vous avez eu l’Alsace et la Lorraine<br>Mais mon p’tit cœur vous ne l’aurez jamais<br>Car mon p’tit cœur il restera Français !</div></div></section>","198":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Sur la route</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Sur la route, près d’un vieux chêne,<br>Deux paras sont là, postés.<br>Ils écoutent, sur la route…<br>Un coup part, l’un d’eux tombe frappé.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Mon village, aux frais ombrages,<br>Où m’attend ma bien-aimée,<br>Où les roses fraîches éclosent;<br>Elle attend le retour espéré.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Sur la route, près d’un vieux chêne,<br>Un para est là, posté.<br>Il découvre, il retrouve<br>Le souvenir de tout son passé.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Sur la route, près d’un vieux chêne,<br>Un para est là, posté…<br>Il veut croire que la gloire<br>Ne permet pas le moindre regret.</div></section>","199":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le clairon</div><div class=\"song-actions\"></div></div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>L’air est pur, la route est large.<br>Le clairon sonne la charge,<br>Les zouaves vont chantant.<br>Et là-haut sur la colline,<br>Dans la forêt qui domine<br>On les guette on les attend.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Le clairon est un vieux brave<br>Et lorsque la lutte est grave<br>C’est un rude compagnon.<br>Il a vu mainte bataille<br>Et porte plus d’une entaille.<br>Depuis les pieds jusqu’au front.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>C’est lui qui guide la fête :<br>Jamais sa fière trompette<br>N’eut un accent plus vainqueur.<br>Et de son souffle de flamme<br>L’espérance vient à l’âme,<br>Le courage monte au cœur.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>On grimpe, on court, on arrive<br>Et la fusillade est vive<br>Et les Prussiens sont adroits<br>Quand enfin le cri se jette :<br>«En marche à la baïonnette !»<br>Et l’on entre sous le bois.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>A la première décharge,<br>Le clairon sonnant la charge<br>Tombe, frappé sans recours.<br>Mais par un effort suprême<br>Menant le combat quand même<br>Le clairon sonne toujours.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Et cependant le sang coule,<br>Mais sa main qui le refoule<br>Suspend un instant la mort.<br>Et de sa note affolée,<br>Précipitant la mêlée<br>Le vieux clairon sonne encore.</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Il est là couché sur l’herbe<br>Dédaignant, blessé superbe,<br>Tout espoir et tout recours.<br>Et sur sa lèvre sanglante,<br>Gardant sa trompette ardente<br>Il sonne, il sonne toujours.</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Puis dans la forêt pressée,<br>Voyant la charge lancée<br>Et les zouaves bondir,<br>Alors le clairon s’arrête :<br>Sa dernière chasse est faite,<br>Il achève de mourir.</div></div></section>","200":"<div class=\"pdfimg\" data-img=\"200\" data-alt=\"Illustration du carnet\"></div>","201":"<div class=\"pdfimg\" data-img=\"201\" data-alt=\"Chants de veillée\"></div>","202":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La légende du feu</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Les scouts ont mis la flamme<br>Au bois résineux,<br>Ecoutez chanter l’âme<br>Qui palpite en eux.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Monte, flamme légère,<br>Feu de camp si chaud, si bon,<br>Dans la plaine ou la clairière<br>Monte encore et monte donc (bis)<br>Feu de camp si chaud, si bon.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>J’étais jadis un Prince<br>Perfide et méchant,<br>Dépeuplant la province<br>Des petits enfants.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Me tendit ses embûches<br>L’enchanteur Merlin,<br>M’enferma dans les bûches<br>Du grand bois voisin.</div></section>","203":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Ésaü</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>A l’époque tertiaire<br>Il y avait un barbu : Esaü,<br>Sa barbe traînait par terre,<br>Son corps était velu Esaü,<br>Chez lui pas besoin de culotte<br>De chemise ou de redingote, Esaü.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Ah ! vraiment oui c’est épatant<br>Oui c’est surprenant, abracadabrant !<br>Non jamais on ne verra plus<br>De barbus comme Esaü !<br>Esaü, Esaü, Esaü, Esaü,<br>C’est le roi des barbus<br>C’est le roi des poilus<br>C’est le roi des velus, Esaü.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>On crut à sa naissance<br>Qu’il n’vivrait pas longtemps, Esaü,<br>Contre toute espérance<br>Il vécut six cents ans Esaü,<br>Il eut des garçons et des filles<br>Tous poilus comme des gorilles Esaü.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Quand il partait en guerre<br>Contre les autres barbus Esaü,<br>Il les flanquait par terre<br>Et leur tapait dessus Esaü,<br>Les prenait par le fond d’la culotte<br>Et les amenait dans sa grotte.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Hélas à notre époque<br>Il n’y a plus de barbus Esaü,<br>Les hommes sont imberbes,<br>Et les femmes encore plus, Esaü,<br>C’est l’âg’ du rasoir mécanique, nique, nique<br>Et même électrique, Esaü.</div></div></section>","204":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le feu brille</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Le feu brille et la forêt palpite,<br>Notre chef est parmi nous la la la ;<br>Il nous parle des temps héroïques<br>Où les preux luttaient pour nous.<br>Sur nos têtes le vent crie et passe,<br>A ce souffle les chênes frémissent.<br>Le feu brille et la forêt palpite,<br>Notre chef est parmi nous.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Devant la flamme bleue qui s’éveille<br>Jaillissant claire du feu la la la,<br>Notre ardeur endormie se réveille<br>Et fait scintiller les cieux.<br>Allons garçons que le chef appelle,<br>Que vos mains s’étreignent énergiques,<br>Car le feu qui appelle et commande<br>A surgi jeune et joyeux.</div></section>","205":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La chèvre</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Ballottant d’la queue<br>Et grignotant des dents<br>Ballottant d’la queue<br>Et grignotant des dents.</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Il était une chèvre de fort tempérament<br>Qui revenait d’Espagne et parlait allemand.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Elle revenait d’Espagne et parlait allemand<br>Elle entra par hasard dans le champ d’un Normand.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Elle entra par hasard dans le champ d’un Normand<br>Elle y vola un chou qui valait bien trois francs,</div><div class=\"verse\"><span class=\"verse-number\">4.</span>...Et la queue d’un poireau qu’en valait bien autant.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>...Le Normand l’assigna devant le Parlement.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>...La chèvre comparut et s’assit sur un banc,</div><div class=\"verse\"><span class=\"verse-number\">7.</span>...Puis elle ouvrit le Code et regarda dedans.</div><div class=\"verse\"><span class=\"verse-number\">8.</span>...Elle vit que son affaire allait fort tristement.</div><div class=\"verse\"><span class=\"verse-number\">9.</span>...Lors, elle ouvrit la porte et prit la clé des champs !</div></div></section>","206":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Colchiques dans les prés</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Colchiques dans les prés<br>Fleurissent, fleurissent,<br>Colchiques dans les prés,<br>C’est la fin de l’été.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>La feuille d’automne<br>Emportée par le vent,<br>En ronde monotone<br>Tombe en tourbillonnant.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Châtaignes dans les bois<br>Se fendent, se fendent,<br>Châtaignes dans les bois<br>Se fendent sous le pas.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Nuages dans le ciel<br>S’étirent, s’étirent,<br>Nuages dans le ciel<br>S’étirent comme une aile.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Et ce chant dans mon cœur<br>Murmure, murmure,<br>Et ce chant dans mon cœur<br>Appelle le bonheur.</div></div></section>","207":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Dans les prisons de Nantes</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Dans les prisons de Nantes, lang di..<br>Dans les prisons de Nantes,<br>Y avait un prisonnier. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Personne ne vint le voir, lang di.......<br>Personne ne vint le voir,<br>Que la fille du geôlier. (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Un jour il lui demande, lang di ......<br>Un jour il lui demande,<br>Que dit-on de moé ? (bis)</div><div class=\"verse\"><span class=\"verse-number\">4.</span>On dit de vous en ville, lang di ....<br>On dit de vous en ville,<br>Que vous serez pendu (bis)</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Mais s’il faut qu’on me pende,...<br>Mais s’il faut qu’on me pende,<br>Déliez moi les pieds. (bis)</div><div class=\"verse\"><span class=\"verse-number\">6.</span>La fille était jeunette, lang di ....<br>La fille était jeunette,<br>Les pieds lui a délié. (bis)</div><div class=\"verse\"><span class=\"verse-number\">7.</span>Le prisonnier alerte, lang di ....<br>Le prisonnier alerte,<br>Dans la Loire s’est jeté. (bis)</div><div class=\"verse\"><span class=\"verse-number\">8.</span>Dès qu’il fût sur les rives, lang di ....<br>Dès qu’il fût sur les rives,<br>II se mît à chanter. (bis)</div><div class=\"verse\"><span class=\"verse-number\">9.</span>Je chante pour les belles, lang di ....<br>Je chante pour les belles,<br>Surtout celle du geôlier. (bis)</div><div class=\"verse\"><span class=\"verse-number\">10.</span>Si je reviens à Nantes, ...<br>Si je reviens à Nantes,<br>Oui, je l’épouserai. (bis)</div></div></section>","208":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le petit âne gris</div><div class=\"song-actions\"></div></div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Ecoutez cette histoire<br>Que l’on m’a racontée<br>Du fond de ma mémoire,<br>Je vais vous la chanter<br>Elle se passe en Provence<br>Au milieu des moutons<br>Dans le sud de la France<br>Au pays des santons. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Quand il vint au domaine<br>Y’avait un beau troupeau,<br>Les étables étaient pleines<br>De brebis et d’agneaux.<br>Marchant toujours en tête<br>Aux premières lueurs,<br>Pour tirer sa charrette<br>Il mettait tout son cœur. (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Au temps des transhumances<br>Il s’en allait heureux.<br>Remontant la Durance<br>Honnête et courageux.<br>Mais un jour de Marseille<br>Des Messieurs sont venus<br>La ferme était bien vieille<br>Alors, on l’a vendue. (bis)</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Il resta au village<br>Tout le monde l’aimait bien<br>Vaillant malgré son âge<br>Et malgré son chagrin.<br>Image d’évangile<br>Vivant d’humilité<br>Il se rendait utile<br>Auprès du cantonnier. (bis)</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Cette vie honorable<br>Un soir, s’est terminée<br>Dans le fond d’une étable<br>Tout seul il s’est couché.<br>Pauvre bête de somme<br>Il a fermé les yeux,<br>Abandonné des Hommes<br>Il est mort sans adieux. (bis)</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Mmmmmmm......<br>Cette chanson sans gloire<br>Vous racontait la vie<br>Vous racontait l’histoire<br>D’un petit âne gris. (bis)</div></div></section>","209":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les cosaques</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Nous aimons vivre au fond des bois,<br>Aller coucher sur la dure,<br>La forêt nous dit de ses milles voix :<br>Lance-toi dans la grande aventure. (bis)</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>La, la, la, la, la, la, la, la...</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Nous aimons vivre sur nos chevaux<br>Dans les plaines du Caucase ;<br>Emportés par leur rapide galop<br>Nous allons plus vite que Pégase.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Nous aimons vivre auprès du feu<br>Et danser sous les étoiles ;<br>La nuit claire nous dit de ses milles feux :<br>Sois gai lorsque le ciel est sans voile.</div></section>","210":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Kazatchok</div><div class=\"song-actions\"></div></div><div class=\"verse\"><span class=\"verse-number\">1.</span>Quand la neige a recouvert la plaine,<br>Je prends mon cheval et mon traîneau.<br>Et mon chant s’élève à perdre haleine,<br>Non jamais le monde fut si beau. (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Au matin dans la brise glaciale,<br>Je m’en vais au gré de mon traîneau.<br>Mais le ciel peu à peu se dévoile,<br>Non jamais le monde fut si beau. (bis)</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Dès le soir quand la nuit est rebelle,<br>Mon cheval s’empresse au grand galop.<br>Et mon cœur lui reste aussi fidèle,<br>Non jamais le monde fut si beau. (bis)</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Vole au ciel, vole chanson légère,<br>Le soleil vers lui t’emportera,<br>Vers celui qui donne la lumière,<br>Et réchauffe le cœur de nos gars. (bis)</div></section>","211":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Plaine, ma plaine</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Plaine, ma plaine<br>Plaine, ô mon immense plaine<br>Où traîne encore le cri des loups<br>Grand’ steppe blanche de chez nous.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Plaine, ma plaine<br>Dans l’immensité des neiges<br>Entends-tu le pas des chevaux ?<br>Entends-tu le pas des galops ?</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Plaine, ma plaine<br>Sous l’épais manteau de neige<br>La terre renferme dans sa main<br>La graine récolte de demain.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Plaine, ma plaine<br>Vas-t’en dire aux autres plaines<br>Reviennent le soleil, les étés<br>Pour tous ceux qui savent’ espérer</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Plaine, ma plaine<br>Ô doux vent de ma plaine<br>Tu peux gémir avec les loups<br>L’espoir est plus fort que tout.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Plaine, ma plaine<br>Plaine, ô mon immense plaine<br>Où traîne encore le cri des loups<br>Grande steppe blanche de chez nous.</div></div></section>","212":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">L'homme de Cro-Magnon</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>C’était au temps de la préhistoire,<br>Il y a deux ou trois cents mille ans<br>Vint au monde un être bizarre<br>Proche parent de l’orang-outan.<br>Debout sur ses pattes de derrière<br>Vêtu d’un slip en peau de bison,<br>Il allait parcourir la terre<br>C’était l’homme de Cro-Magnon.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>L’homme de Cro,<br>L’homme de ma, l’homme de gnon<br>L’homme de Cro-Magnon pom, pom<br>L’homme de Cro de Magnon, ce n’est pas du bidon,<br>L’homme de Cro-Magnon pom, pom (bis)</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Armé de sa hache de guerre<br>Et d’un couteau en pierre itou<br>Il chassait l’ours et la panthère<br>En serrant les fesses malgré tout.<br>Devant le diplodocus en rage<br>Il se faisait tout d’même petit<br>Et murmurait dans son langage :<br>Vivement qu’on invente le fusil.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Il était poète à ses heures<br>Disant à sa femme en émoi :<br>Tu es belle comme un dinosaure<br>Tu ressembles à Garbo Gretta,<br>Si tu veux voir des cartes postales<br>Viens dans ma caverne tout là-haut<br>T’y verras des peintures murales<br>On dirait du vrai Picasso.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Trois cent mille ans après sur terre<br>Comme nos ancêtres nous admirons<br>Les prés, les bois et les rivières<br>Mais s’ils revenaient<br>Quelle déception !<br>D’nous voir trimer six jours sur sept<br>Ils diraient sans faire de détail<br>Faut-y qu’nos descendants soient bêtes<br>D’avoir inventé le travail ?</div></div></section>","213":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Singing aye !</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Elle descend de la montagne à cheval, ohé ! (bis)<br>Elle descend de la montagne (ter) à cheval, ohé !</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Singing aye, aye, youpi, youpi aye ! (bis)<br>Sing aye, aye,<br>Youpi aye, aye (bis),<br>Youpi, youpi aye !</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Elle embrasse son grand-père en descendant de cheval...</div><div class=\"verse\"><span class=\"verse-number\">3.</span>J’aimerais bien être son grand-père quand elle descend de cheval...</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Mais j’préfère avoir 20 ans et toutes mes dents de cheval...</div></div></section>","214":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Se canto (Devant ma fenêtre)</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Devant ma fenêtre<br>Y’a un oisillon,<br>Toute la nuit chante,<br>Chante sa chanson.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>S’il chante qu’il chante<br>Chante pas pour moi<br>Chante pour ma mie<br>Qui est loin de moi.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Ces hautes montagnes,<br>Ces longues vallées<br>Cachent le visage<br>De ma bien-aimée.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Baissez-vous montagnes,<br>Plaines, haussez-vous.<br>Que je voie sans peine<br>Où sont mes amours.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Les chères montagnes,<br>Tant s’abaisseront,<br>Qu’à la fin ma mie<br>Mes yeux vous verront.</div><div class=\"verse\"><span class=\"verse-number\">1.</span>Debat ma fenestro<br>At oun auselou<br>Touto la ney canto.<br>Canto sa cansou.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Se canto, que canto,<br>Canto pas per you,<br>Canto per mamio<br>Qu’ès alen de you.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Aqueros mountagnos<br>Que tan hautes soun<br>M’empéchoun de beyre<br>Mas amours oun soun.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Bassas-bous, mountagnos<br>Planos, aoussas-bous<br>Per que posquibeyre<br>Mas amours oun soun.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Aqueros mountagnos<br>Tan s’abacharan<br>E mas amourettos<br>Se rapproucharan.</div></div></section>","215":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La choupe aux choux</div><div class=\"song-actions\"></div></div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Chez le bon Dieu, y’avait bien du beau monde<br>Des Bourguignons, des Picards, des Bretons. (bis)<br>Et tous chantaient, avec la Sainte Vierge,<br>Et tous dansaient, dans les parvis des cieux.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Mais dans un coin, y en a qu’étaient tout tristes,<br>Cherchaient en vain quelqu’chose n’y trouvaient point.<br>L’Bon Dieu leur dit : « Dites-moi qui vous êtes ? »<br>Lui répondirent: « Nous chom’ les j’ Auvergnats ! »</div><div class=\"verse\"><span class=\"verse-number\">3.</span>«Que vous faut-y mes pauvr’s enfants, pour être<br>Comme tous mes fils contents au Paradis ? »<br>«Eqchcujez-nous, ch’est un toupin pour faire<br>Comme chez nous, d’la bonne choupe aux choux. »</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Lors leur donna pour toupin, l’ fond d’ la lune ;<br>« Êtes vous comme ça contents braves Auvergnats ?»<br>« Bien chûr, fouchtra ! » Et les voilà qui dansent<br>Dans l’firmament. Mon Dieu, quel branlebas !</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Prenant le bras des saints, des patriarches<br>S’mir’nt à chanter, les braves Auvergnats :<br>« La choupe aux choux, se f’ra dans la marmite,<br>Dans la marmite se f’ra la choupe aux choux ! »</div></div></section>","216":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les crocodiles</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Un crocodile s’en allait à la guerre,<br>Disait au r’voir à ses petits enfants,<br>Traînant ses pieds, ses pieds dans la poussière,<br>Il s’en allait combattre les éléphants.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Ah ! les cro cro cro les cro cro cro, les crocodiles<br>Sur les bords du Nil ils sont partis n’en parlons plus.<br>Ah ! les cro cro cro, les cro cro cro, les crocodiles<br>Sur les bords du Nil ils sont partis n’en parlons plus.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Il fredonnait une marche militaire,<br>Dont il mâchait les mots à grosses dents.<br>Quand il ouvrait la gueule tout entière,<br>On croyait voir ses ennemis dedans.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Il agitait sa grande queue à l’arrière,<br>Comme s’il était d’avance triomphant.<br>Les animaux devant sa mine altière,<br>Dans les forêts, s’enfuyaient tout tremblants.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Un éléphant parut et, sur la terre,<br>Se prépara à ce combat d’ géants.<br>Mais près de là, courait une rivière :<br>Le crocodile s’y jeta subitement.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Et tout rempli d’une crainte salutaire,<br>S’en retourna vers ses petits enfants.<br>Notre éléphant, d’une trompe plus fière,<br>Voulut alors accompagner ce chant :</div></div></section>","217":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Cantique des étoiles</div><div class=\"song-actions\"></div></div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>As-tu compté les étoiles<br>Et les astres radieux,<br>Déployant aux nuits sans voile<br>Leur cortège dans les cieux ?<br>Dieu qui leur donna<br>La vie et l’éclat,<br>Dieu qui leur fixa<br>La course et le pas,<br>Sait aussi quel est leur nombre<br>Et ne les oublie pas.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>As-tu compté les abeilles<br>Butinant parmi les fleurs,<br>Papillons, mouches vermeilles,<br>Sans soucis et travailleurs ?<br>Dieu qui les vêtit<br>Couleur paradis,<br>Dieu qui leur fournit<br>Vivres et logis,<br>Sait aussi quel est leur nombre<br>Et ne les oublie pas.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>As-tu compté les fleurettes<br>Souriant au gai printemps,<br>Boutons d’or et pâquerettes,<br>Fleurs des bois et fleurs des champs ?<br>Celui qui leur fit<br>Ces riches habits<br>Celui qui leur mit<br>Ce frais coloris,<br>Sait aussi quel est leur nombre<br>Et ne les oublie pas.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>As-tu compté les nuées<br>Passant dans les champs du ciel,<br>Et les gouttes de rosée<br>Aux reflets de l’arc-en-ciel ?<br>Dieu qui fit le temps<br>Sombre ou éclatant ;<br>Le ruisseau chantant<br>Et les flots grondant<br>Sait aussi quel est leur nombre<br>Et ne les oublie pas.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Sais-tu combien, sur la terre,<br>Vivent d’enfants comme toi,<br>Dans le luxe ou la misère,<br>Fils de pauvres, fils de rois ?<br>Dieu les connaît tous<br>Dieu les aime tous<br>Dieu les garde tous<br>Et Dieu les veut tous.<br>Tu es aussi dans le nombre<br>De ceux qu’Il n’oublie pas.</div></div></section>","218":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Ma Guadeloupe</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Ah, ‘endez-moi ma Guadeloupe et ma savane<br>Et mon petit bois de bananiers où moi j’ suis né.</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Quand moi faim, moi malin<br>Moi manger banane<br>Quand moi soif, moi malin<br>Moi boi’e vin de palme.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Quand moi gai, moi malin,<br>Moi jouer guita’e<br>Quand moi t’iste, moi malin<br>Moi pleu’er des la’mes</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Quand moi chaud, moi malin,<br>Moi mett’e un p’tit pagne<br>Quand moi froid, moi malin,<br>Moi bâti’ cabane</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Quand moi jeune, moi malin,<br>Moi p’end’petite femme.<br>Quand moi vieux, moi malin<br>Moi m’servi’ d’une canne.</div></div></section>","219":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les cornemuses</div><div class=\"song-actions\"></div></div><div class=\"verse nonum\">Depuis l’été dernier, j’entends les cornemuses,<br>Je les entends chanter toute la journée.</div><div class=\"verse nonum\">Je les entends, je les entends,<br>Je les entends toute la journée.</div><div class=\"verse nonum\">Ouin… Ouin… Ouin… Ouin…</div></section><section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Maudit sois-tu carillonneur</div><div class=\"song-actions\"></div></div><div class=\"verse nonum\">Maudit sois-tu, carillonneur,</div><div class=\"verse nonum\">Que Dieu créa pour mon malheur.</div><div class=\"verse nonum\">Dès le point du jour, à sa cloche il s’accroche,</div><div class=\"verse nonum\">Et le soir encore carillonne plus fort.</div><div class=\"verse nonum\">Quand sonnera-t’on la mort du sonneur ?</div></section>","220":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Les retrouvailles</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Le temps est loin de nos vingt ans,<br>Des coups de poing, des coups de sang.<br>Mais qu’à c’la n’tienne : c’est pas fini,<br>On peut chanter quand le verre est bien rempli.</div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Buvons encore une dernière fois<br>À l’amitié, l’amour, la joie<br>On a fêté nos retrouvailles<br>Ça me fait de la peine<br>Mais il faut que je m’en aille</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Te souviens-tu de cet été,<br>La première fois qu’on s’est saoulé ?<br>Tu m’as ramené à la maison<br>En chantant, on marchait à reculons.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>J’ai voulu un jour changer d’étoile<br>Sur un navire, j’ai mis les voiles<br>Pour n’être plus qu’un étranger<br>Ne sachant plus très bien où il allait.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>J’t’ai raconté mon mariage<br>A la mairie d’un petit village.<br>Je rigolais dans mon plastron<br>Pendant que le mair’sayait d’prononcer mon nom.</div><div class=\"verse\"><span class=\"verse-number\">5.</span>J’t’ai pas écrit toutes ces années<br>Et toi aussi tu t’es marié.<br>T’as trois enfants à faire manger<br>Moi j’en ai cinq si ça peut te consoler.</div></div></section>","221":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Hegoak</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse nonum\">Hegoak ebaki banizkio<br>Neuria izango zen (bis)</div><div class=\"verse nonum\">Ez zuen alde egingo</div><div class=\"verse nonum\">Bainan horrela<br>Ez zen gehiaqo xoria izanqo (bis)</div><div class=\"verse nonum\">Eta nik, xoria nuen maite<br>Eta nik eta nik, xoria nuen maite</div><div class=\"verse nonum\">Lalala...</div><div class=\"verse nonum\">Bainan horrela<br>Ez zen gehiaqo xoria izanqo<br>Bainan horrela<br>Ez zen gehiaqo xoria izanqo<br>Eta nik, xoria nuen maite<br>Eta nik eta nik, xoria nuen maite<br>Lalala...</div><div class=\"verse nonum\">Si je lui avais coupé les ailes.<br>Elle aurait été mienne</div><div class=\"verse nonum\">Elle ne serait pas partie</div><div class=\"verse nonum\">Mais ainsi,<br>elle n’aurait plus été un oiseau</div><div class=\"verse nonum\">Et moi, c’est l’oiseau que j’aimai<br>Et moi, et moi, c’est l’oiseau que j’aimai</div></div></section>","222":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La montagne</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>J’ai laissé là-bas, dans mon beau pays<br>J’ai laissé tous mes amis.<br>J’ai voulu partir et je suis parti<br>Une fin d’après-midi.<br>La montagne était si belle<br>Que j’ai voulu la revoir,<br>Quand descend le soir,<br>Laissez-moi chanter<br>La chanson du souvenir.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>J’ai laissé là-bas, dans mon beau pays<br>Une fille si jolie<br>Elle doit pleurer et compter les jours<br>Et prier pour mon retour.<br>La montagne était si belle…<br>...Laissez-moi chanter<br>La chanson pour l’endormir.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Mais je reviendrai, dans mon beau pays<br>Pour y chercher mon amie<br>Nous nous marierons et retournerons<br>Très souvent par les monts.<br>La montagne était si belle…<br>...Laissez-moi chanter<br>La chanson de notre amour.</div></div></section>","223":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">La jument de Michao</div><div class=\"song-actions\"></div></div><div class=\"verse nonum\">C’est dans dix ans je m’en irai<br>J’entends le loup et le renard chanter. (bis)</div><div class=\"verse nonum\">J’entends le loup, le renard et la belette,<br>J’entends le loup et le renard chanter. (bis)</div><div class=\"verse nonum\">La jument de Michao et son petit poulain<br>A passé dans le pré et mangé tout le foin. (bis)</div><div class=\"verse nonum\">L’hiver viendra les gars, l’hiver viendra<br>La jument de Michao, elle s’en repentira. (bis)</div><div class=\"verse nonum\">C’est dans neuf ans...<br>C’est dans huit ans...<br>C’est dans sept ans...</div></section>","224":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Je t'aime ô ma Patrie</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Je t’aime ô ma Patrie<br>Pour tes monts neigeux et fiers ;<br>Pour la chanson jolie<br>De tes fleuves toujours clairs ;<br>Pour tes grèves que soulèvent<br>Des flots si bleus<br>Où l’on voit briller les cieux<br>Calmes et radieux.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Je t’aime pour tes plaines<br>Où mûrissent tes moissons,<br>Pour tes forêts de chênes,<br>Pour tes bois et tes vallons,<br>Pour tes vignes qui s’alignent<br>Sur tes coteaux,<br>Pour le chant de tes ruisseaux<br>Où boivent les oiseaux.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Je t’aime pour la grâce<br>Dont se parent tes enfants,<br>Pour la fierté qui passe<br>Au regard de leurs vingt ans ;<br>Pour leur âme qui s’enflamme<br>Prompte au secours,<br>Et se donne sans retour<br>D’un simple et pur amour.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Je t’aime, ô douce France !<br>Pour la gloire de ton nom,<br>Pour les bienfaits immenses<br>De ton cœur joyeux et bon !<br>De patrie plus chérie,<br>Il n’en est pas,<br>Pour la paix voici nos bras<br>Nos cœurs pour les combats.</div></div></section>","225":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">L'enfant au cœur d'or</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Mon ange blond,<br>Connais-tu cette chanson<br>Du joli temps passé,<br>Que les mamans chantaient aux petits enfants<br>Le soir pour les bercer.</div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>C’est la légende de l’enfant<br>De l’enfant du pays d’Armor<br>Qui naquit un jour de printemps<br>Avec un cœur tout rempli d’or.<br>Plus il allait en grandissant<br>Et plus son cœur devenait grand<br>Plus son trésor devenait lourd,<br>Plus il avait le mal d’amour.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Les parents dont il était né<br>Etaient de pauvres miséreux,<br>Il résolut de leur donner<br>Tout l’or de son cœur généreux.<br>Avec un grand couteau pointu<br>Ouvrit son cœur tout scintillant<br>Et chaque jour mit son écu<br>Dans les sabots de ses parents.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Mais il donna et tant et tant,<br>Qu’un soir la mort ferma ses yeux.<br>Un Ange alors au même instant<br>Emporta son cœur vers les cieux.<br>Et depuis lors la nuit venue<br>On peut voir au pays d’Armor<br>Briller tout au fond de la nuit<br>Une nouvelle étoile d’or.</div><div class=\"refrain\"><div class=\"refrain-label\">Dernier refrain :</div>Qu’elle était belle et naïve la chanson<br>Du joli temps passé,<br>Que les mamans chantaient à leurs anges blonds<br>Le soir pour les bercer.</div></div></section>","226":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Ô douce France</div><div class=\"song-actions\"></div></div><div class=\"refrain\"><div class=\"refrain-label\">Refrain :</div>Ô douce France,<br>Mon beau pays<br>Lieu de mon enfance<br>Du bonheur, des chansons et des rires.<br>Ta souvenance<br>Berce ma dolence<br>D’un chant d’espérance.</div><div class=\"verse\"><span class=\"verse-number\">1.</span>Et là sur cette terre,<br>Où je suis exilé,<br>Mon âme est solitaire<br>Et mon cœur désolé.<br>J’attends chaque jour,<br>Le moment du retour.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Ici, ton cher visage<br>Eclaire nos destins<br>Pour garder bon courage<br>On pense au clair matin<br>Qui chassait toujours<br>L’ombre des mauvais jours.</div></section>","227":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Le jour au loin s'enfuit</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Si calme si tranquille<br>Sur nous descend la nuit<br>Les ombres se profilent<br>Le jour au loin s’enfuit,<br>La lune brille,<br>Le jour au loin s’enfuit.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>C’est l’heure des chimères,<br>Le temps du souvenir<br>La vie se change en rêve<br>Présent et avenir<br>Font une trêve<br>Le temps du souvenir.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>La terre se repose<br>Tout rentre dans la paix<br>Les êtres et les choses<br>Retrouvent l’unité<br>Paupières closes<br>Tout rentre dans la paix.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Autour du feu qui danse<br>Amis chantons encore<br>Après ce grand silence<br>Le monde, qui s’endort<br>Dans l’espérance<br>Reprendra son essor.</div></div></section>","228":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Hymne à la joie</div><div class=\"song-actions\"></div></div><div class=\"cols c3\"><div class=\"verse\"><span class=\"verse-number\">1.</span>Joie discrète, humble, fidèle,<br>Qui murmure dans les eaux,<br>Dans le froissement des ailes<br>Et les hymnes des oiseaux,<br>Joie qui vibre dans les feuilles<br>Dans les prés et les moissons<br>Nos âmes blanches t’accueillent<br>Par de naïves chansons.</div><div class=\"verse\"><span class=\"verse-number\">2.</span>Joie de l’être et de la vie<br>Sanglante comme un beau soir,<br>Éclosion infinie<br>Des rêves et des espoirs,<br>Dans notre coupe tendue<br>Verse-nous le vin vermeil<br>Où s’éclot, fervente et drue,<br>La puissance du soleil.</div><div class=\"verse\"><span class=\"verse-number\">3.</span>Joie limpide, joie austère,<br>Pâle fille du devoir,<br>Dont l’immaculé mystère<br>Se revêt de voiles noirs.<br>Ah, surgis, ardente et pure,<br>De l’œuvre de tous les jours<br>Pour lui donner la parure<br>Lumineuse de l’amour.</div><div class=\"verse\"><span class=\"verse-number\">4.</span>Joie immense, joie profonde,<br>Ombre vivante de Dieu,<br>Abats-toi sur notre monde<br>Comme un aigle vient des cieux.<br>Enserre dans ton étreinte<br>La tremblante humanité.<br>Que s’évapore la crainte,<br>Que naisse la liberté !</div><div class=\"verse\"><span class=\"verse-number\">5.</span>Joie énorme, joie terrible<br>Du sacrifice total,<br>Toi qui domptes l’impossible,<br>Et maîtrises le fatal ;<br>Joie sauvage, âpre et farouche<br>Cavalière de la mort,<br>Nous soufflons à pleine bouche<br>Dans l’ivoire de ton cor.</div><div class=\"verse\"><span class=\"verse-number\">6.</span>Joie qui monte et déborde,<br>Tu veux nos cœurs ? Les voilà.<br>Et nos âmes sont les cordes<br>Où ton archer passera.<br>Que ton rythme nous emporte<br>Aux splendeurs de l’Éternel<br>Comme un vol de feuilles mortes<br>Que l’orage entraîne au ciel.</div></div></section>","229":"<div class=\"song-pair\"><section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Canon du feu</div><div class=\"song-actions\"></div></div><div class=\"verse nonum\">(Vivace)</div><div class=\"verse nonum\">Entendez-vous dans le feu</div><div class=\"verse nonum\">Tous ces bruits mystérieux ?</div><div class=\"verse nonum\">Ce sont les tisons qui chantent,</div><div class=\"verse nonum\">Eclaireur, sois joyeux !</div></section><section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Canon de la pluie</div><div class=\"song-actions\"></div></div><div class=\"verse nonum\">Ta ta ta ta ta ta ta ta flic floc</div><div class=\"verse nonum\">ouh ouh ouh...</div><div class=\"verse nonum\">C’est la pluie qui vient frapper sur nos coeurs,</div><div class=\"verse nonum\">C’est le vent qui vient chanter notre bonheur !</div></section></div>","230":"<section class=\"song\"><div class=\"song-head\"><div class=\"song-title\">Canons de veillée</div><div class=\"song-actions\"></div></div><div class=\"cols c2\"><div class=\"verse nonum\">Quand le cheval de Thomas tomba,<br>Comment Thomas ne tomba-t-il pas,<br>Matthieu dit qu’il n’a pas vu tomber Thomas<br>Thomas tomba-t-il ou ne tomba-t-il pas?</div><div class=\"verse nonum\">Un gai luron des Flandres,<br>S’en vint en Wallonie,<br>S’en vint, s’en vint en Wallonie</div><div class=\"verse nonum\">Pour y compter des fables,<br>Des fables de son pays, Tirlalala<br>Tirlalala des fables de son pays.</div><div class=\"verse nonum\">Heureux qui peut entendre,<br>Entendre de ses chansons, Tirlalala<br>Tirlalala entendre de ses chansons.</div><div class=\"verse nonum\">Depuis l’été dernier, j’entends les cornemuses,<br>Je les entends chanter, toute la journée.<br>Je les entends, je les entends, je les entends, toute la<br>journée<br>Ouin, ouin, ouin, ouin (bis)</div></div></section>","231":"<div class=\"toc-page\"><div class=\"toc-title\">Table alphabéti
